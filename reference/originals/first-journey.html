<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoveTree · 첫 여정 통합</title>
<meta name="description" content="사랑에 빠지는 순간을 하나의 러브트리로 이어 보세요.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Manrope:wght@500;600;700&display=swap');
:root{
  --paper:#f7f0e8;--white:#fffdf8;--ink:#403536;--muted:#93837d;
  --rose:#c86e79;--deep:#98505e;--sage:#879975;--sage-deep:#596b4c;
  --line:rgba(119,91,82,.18);--display:'Gowun Batang','Noto Serif KR',serif;
  --body:'Gowun Dodum','Noto Sans KR',sans-serif;--latin:'Manrope','Gowun Dodum',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--body);background:var(--paper)}
button,a,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(200,110,121,.34);outline-offset:3px}
.unified-bar{
  position:sticky;top:0;z-index:1000;min-height:76px;padding:0 max(24px,calc((100vw - 1210px)/2));
  display:grid;grid-template-columns:minmax(145px,1fr) auto minmax(145px,1fr);align-items:center;gap:22px;
  border-bottom:1px solid rgba(119,91,82,.14);background:rgba(255,253,248,.89);
  backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(75,51,42,.055)
}
.unified-logo{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;gap:10px;width:max-content;color:var(--deep);font:700 1.34rem var(--display);letter-spacing:-.045em;text-decoration:none}
.unified-mark{width:28px;height:28px;position:relative;transform:rotate(7deg)}
.unified-mark:before{content:"";position:absolute;left:12px;top:3px;width:2px;height:22px;border-radius:99px;background:var(--sage-deep)}
.unified-mark:after{content:"";position:absolute;left:3px;top:4px;width:20px;height:15px;background:radial-gradient(ellipse at 23% 58%,var(--sage) 0 34%,transparent 36%),radial-gradient(ellipse at 78% 35%,var(--rose) 0 30%,transparent 32%);transform:rotate(-14deg)}
.stage-nav{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.stage-button{position:relative;min-height:36px;padding:0 12px;border:1px solid transparent;border-radius:999px;background:transparent;color:#aa9992;font-size:.65rem;white-space:nowrap;transition:.18s}
.stage-button:hover{background:rgba(255,250,243,.85);color:var(--deep)}
.stage-button.active{border-color:rgba(200,110,121,.22);background:rgba(240,215,213,.58);color:var(--deep);font-weight:700}
.stage-button.done{color:var(--sage-deep)}
.stage-button.done:before{content:"✓";margin-right:5px;color:var(--sage);font-weight:700}
.stage-button.locked{opacity:.45}
.stage-button .index{font:700 .49rem var(--latin);margin-right:4px}
.menu-actions{justify-self:end;display:flex;align-items:center;gap:15px;color:var(--muted);font-size:.67rem}
.menu-actions button{border:0;background:transparent;color:inherit;padding:7px 0}
.menu-actions button:hover{color:var(--deep)}
.reset-link{display:none!important;font-size:.56rem!important;color:#b5a49d!important}
body[data-started="true"] .reset-link{display:inline-block!important}
.stage-wrap{position:relative;min-height:calc(100vh - 76px)}
landing-stage,memory-stage,connect-stage,growth-stage{display:block;animation:stageIn .24s ease both}
landing-stage[hidden],memory-stage[hidden],connect-stage[hidden],growth-stage[hidden]{display:none!important}
@keyframes stageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.global-toast{position:fixed;left:50%;bottom:24px;z-index:3000;opacity:0;pointer-events:none;transform:translate(-50%,20px);padding:11px 16px;border-radius:999px;background:#433536;color:white;font-size:.64rem;box-shadow:0 13px 30px rgba(45,32,30,.24);transition:.2s}
.global-toast.show{opacity:1;transform:translate(-50%,0)}
.growth-screen{min-height:calc(100vh - 76px);padding:46px 24px 70px;background:radial-gradient(circle at 12% 18%,rgba(219,151,145,.20),transparent 27rem),radial-gradient(circle at 92% 80%,rgba(156,174,130,.17),transparent 28rem),linear-gradient(135deg,#f8f1e9,#fbf8f1 58%,#f1e8dc)}
.growth-shell{width:min(1000px,100%);margin:auto;text-align:center}
.growth-eyebrow{margin:0 0 15px;color:var(--deep);font:700 .62rem var(--latin);letter-spacing:.16em;text-transform:uppercase}
.growth-shell h1{margin:0;font:400 clamp(2.8rem,6vw,5.2rem)/1.08 var(--display);letter-spacing:-.085em}.growth-shell h1 span{display:block;color:var(--rose)}
.growth-shell>p{max-width:600px;margin:20px auto 30px;color:var(--muted);font-size:.83rem;line-height:1.8}
.growth-board{position:relative;min-height:430px;padding:26px;border:1px solid var(--line);border-radius:34px;background:rgba(255,253,248,.84);box-shadow:0 28px 80px rgba(75,51,42,.15);overflow:hidden;text-align:left}
.growth-board:before{content:"";position:absolute;left:50%;top:34px;bottom:44px;width:3px;border-radius:9px;background:linear-gradient(var(--rose),#d9bda4,var(--sage));transform:translateX(-50%)}
.growth-cards{position:relative;z-index:2;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:18px;min-height:330px}.growth-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 16px 35px rgba(75,51,42,.13)}
.growth-thumb{height:155px;background:linear-gradient(145deg,#dba6a2,#e8cfbf 48%,#a7b38e);background-size:cover;background-position:center;display:grid;place-items:center;color:white;font-size:1.5rem}.growth-copy{padding:15px}.growth-copy small{color:var(--deep);font:700 .55rem var(--latin)}.growth-copy strong{display:block;margin-top:6px;font:400 1.1rem var(--display)}.growth-copy p{margin:6px 0 0;color:var(--muted);font-size:.65rem;line-height:1.55}.growth-arrow{display:grid;place-items:center;width:52px;height:52px;margin:auto;border-radius:50%;background:#e1e9dc;color:var(--sage-deep);font-size:1.2rem}
.growth-actions{display:flex;justify-content:center;gap:10px;margin-top:24px}.growth-actions button{min-height:45px;padding:0 18px;border-radius:999px;font-weight:700}.growth-again{border:1px solid rgba(89,107,76,.3);background:var(--white);color:var(--sage-deep)}.growth-home{border:0;background:var(--rose);color:white}
@media(max-width:860px){.unified-bar{grid-template-columns:auto 1fr auto;padding:0 18px;gap:12px}.stage-nav{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}.stage-nav::-webkit-scrollbar{display:none}.stage-button{padding:0 9px}.menu-actions{gap:8px}.menu-actions .desktop-action{display:none}}
@media(max-width:560px){.unified-bar{min-height:66px;grid-template-columns:auto minmax(0,1fr);padding:0 14px}.unified-logo{font-size:1.12rem}.stage-nav{grid-column:2}.menu-actions{display:none}.stage-button{font-size:.59rem;min-height:32px;padding:0 8px}.stage-button .label-long{display:none}.stage-wrap{min-height:calc(100vh - 66px)}.growth-screen{min-height:calc(100vh - 66px);padding:30px 15px 50px}.growth-cards{grid-template-columns:1fr;gap:12px}.growth-board:before{left:50%;top:185px;bottom:185px}.growth-arrow{transform:rotate(90deg)}.growth-actions{display:grid}.growth-actions button{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-started="false">
<header class="unified-bar" aria-label="LoveTree 첫 여정 메뉴">
  <button class="unified-logo" id="brand-home" type="button" aria-label="LoveTree 처음 화면으로"><span class="unified-mark" aria-hidden="true"></span>LoveTree</button>
  <nav class="stage-nav" aria-label="첫 여정 단계">
    <button class="stage-button" type="button" data-stage="step1"><span class="index">01</span><span>첫 순간</span></button>
    <button class="stage-button" type="button" data-stage="step2"><span class="index">02</span><span>마음 남기기</span></button>
    <button class="stage-button" type="button" data-stage="step3"><span class="index">03</span><span>다음 영상 잇기</span></button>
    <button class="stage-button" type="button" data-stage="growth"><span class="index">04</span><span class="label-long">러브트리 </span><span>성장</span></button>
  </nav>
  <div class="menu-actions">
    <button class="desktop-action" type="button" id="browse-action">둘러보기</button>
    <button class="desktop-action" type="button" id="login-action">로그인</button>
    <button class="reset-link" type="button" id="reset-action">처음부터 다시 시작</button>
  </div>
</header>
<main class="stage-wrap">
  <landing-stage id="landing-stage"></landing-stage>
  <memory-stage id="memory-stage" hidden></memory-stage>
  <connect-stage id="connect-stage" hidden></connect-stage>
  <growth-stage id="growth-stage" hidden></growth-stage>
</main>
<div class="global-toast" id="global-toast" role="status" aria-live="polite"></div>

<template id="landing-template"><style>@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Manrope:wght@500;600;700&display=swap');

:host{

}

<div class="toast" id="toast"></div></template>

<script>
(() => {
  'use strict';
  const STORAGE_KEY='lovetree-first-journey-unified';
  const STEP2_KEY='lovetree-step2-record';
  const STEP3_KEY='lovetree-step3-connection';
  const today=()=>new Date().toISOString().slice(0,10);
  const defaultState=()=>({
    currentScreen:'landing',treeName:'건호에게 입덕한 3일',
    firstMoment:{url:'',videoId:'',title:'처음 마음이 멈춘 장면',note:'',discoveryDate:today(),thumbnail:'',saved:false},
    memory:{emotion:'설렘',customEmotion:'',time:'01:30',note:'',date:today(),publicMemo:false,saved:false},
    connections:[],step3Origin:null,
    drafts:{step3:{url:'',title:'',time:'00:00',relation:'댓글을 따라 찾아봤어요',note:''}}
  });
  function loadState(){
    const base=defaultState();
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      if(!saved)return base;
      return {...base,...saved,firstMoment:{...base.firstMoment,...saved.firstMoment},memory:{...base.memory,...saved.memory},drafts:{...base.drafts,...saved.drafts,step3:{...base.drafts.step3,...saved.drafts?.step3}}};
    }catch{return base}
  }
  let appState=loadState();
  const globalToast=document.querySelector('#global-toast');
  let toastTimer=0;
  function showGlobalToast(message){clearTimeout(toastTimer);globalToast.textContent=message;globalToast.classList.add('show');toastTimer=setTimeout(()=>globalToast.classList.remove('show'),2300)}
  function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));document.body.dataset.started=String(appState.currentScreen!=='landing'||appState.firstMoment.saved)}
  function youtubeId(value){const match=(value||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{6,})/);return match?match[1]:null}
  function parseTime(value){const match=(value||'').trim().match(/^(\d{1,2}):([0-5]\d)$/);return match?Number(match[1])*60+Number(match[2]):null}
  function formatTime(seconds){seconds=Math.max(0,seconds);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  function thumb(id){return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:''}
  function stageForScreen(screen){if(screen==='landing'||screen==='step1')return 'landing';if(screen.startsWith('step2'))return 'step2';if(screen.startsWith('step3'))return 'step3';return 'growth'}
  function normalizeScreen(){
    if((appState.currentScreen.startsWith('step2')||appState.currentScreen.startsWith('step3')||appState.currentScreen==='growth')&&!appState.firstMoment.saved)appState.currentScreen='landing';
    if((appState.currentScreen.startsWith('step3')||appState.currentScreen==='growth')&&!appState.memory.saved)appState.currentScreen='step2';
    if(appState.currentScreen==='growth'&&!appState.connections.length)appState.currentScreen='step3';
  }
  normalizeScreen();

  class LandingStage extends HTMLElement{
    connectedCallback(){
      if(this.shadowRoot)return;
      this.attachShadow({mode:'open'}).append(document.querySelector('#landing-template').content.cloneNode(true));
      this.$=s=>this.shadowRoot.querySelector(s);
      this.toast=this.$('#toast');
      this.wire();this.updateFromState();this.setMode(appState.currentScreen==='step1'?'step1':'landing');this.applyImageFallbacks();
    }
    showToast(message){this.toast.textContent=message;this.toast.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>this.toast.classList.remove('show'),2400)}
    openModal(){this.$('#modal').classList.remove('hidden');this.$('#modal').setAttribute('aria-hidden','false');setTimeout(()=>this.$('#tree-name').focus(),0)}
    closeModal(){this.$('#modal').classList.add('hidden');this.$('#modal').setAttribute('aria-hidden','true')}
    setMode(mode){this.$('#home').classList.toggle('hidden',mode!=='landing');this.$('#flow').classList.toggle('hidden',mode!=='step1');if(mode==='step1')this.updateFromState()}
    updatePreview(){
      const value=this.$('#content-url').value;const id=youtubeId(value);const win=this.$('#preview-window');
      if(id){win.style.backgroundImage=`linear-gradient(180deg,rgba(255,244,231,.08),rgba(46,34,34,.27)),url(${thumb(id)})`;win.style.backgroundSize='cover';win.style.backgroundPosition='center';this.$('#preview-title').textContent='첫 순간으로 연결할 영상';this.$('#preview-subtitle').textContent='이 장면에서 러브트리의 첫 뿌리가 시작됩니다.'}
      else{win.style.backgroundImage='';this.$('#preview-title').textContent='링크를 넣으면 콘텐츠가 보여요';this.$('#preview-subtitle').textContent='YouTube 주소를 붙여 넣어 러브트리의 뿌리를 만들어 보세요.'}
    }
    updateFromState(){
      this.$('#tree-name').value=appState.treeName||'건호에게 입덕한 3일';this.$('#preview-tree-name').textContent=appState.treeName||'나의 첫 러브트리';
      this.$('#content-url').value=appState.firstMoment.url||'';this.$('#discovery-note').value=appState.firstMoment.note||'';this.$('#discovery-date').value=appState.firstMoment.discoveryDate||today();this.updatePreview();
    }
    applyImageFallbacks(){this.shadowRoot.querySelectorAll('.media img').forEach(img=>{img.addEventListener('error',()=>{const media=img.closest('.media');media.classList.add('image-fallback');if(!media.querySelector('.fallback-flower')){const mark=document.createElement('b');mark.className='fallback-flower';mark.textContent='✿';media.append(mark)}})})}
    wire(){
      this.shadowRoot.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>this.openModal()));
      this.$('[data-close]').addEventListener('click',()=>this.closeModal());
      this.$('#modal').addEventListener('click',event=>{if(event.target===this.$('#modal'))this.closeModal()});
      this.$('#name-form').addEventListener('submit',event=>{event.preventDefault();appState.treeName=this.$('#tree-name').value.trim()||'나의 첫 러브트리';persist();this.closeModal();showScreen('step1')});
      this.$('[data-home]').addEventListener('click',()=>showScreen('landing'));
      this.$('#content-url').addEventListener('input',()=>{appState.firstMoment.url=this.$('#content-url').value;appState.firstMoment.videoId=youtubeId(appState.firstMoment.url)||'';persist();this.updatePreview()});
      this.$('#discovery-note').addEventListener('input',()=>{appState.firstMoment.note=this.$('#discovery-note').value;persist()});
      this.$('#discovery-date').addEventListener('input',()=>{appState.firstMoment.discoveryDate=this.$('#discovery-date').value;persist()});
      this.$('#discovery-form').addEventListener('submit',event=>{
        event.preventDefault();const raw=this.$('#content-url').value.trim();let parsed;try{parsed=new URL(raw)}catch{this.$('#content-url').focus();this.showToast('발견한 콘텐츠 링크를 확인해 주세요.');return}
        const id=youtubeId(parsed.href);if(!id){this.$('#content-url').focus();this.showToast('YouTube 링크를 확인해 주세요.');return}
        appState.firstMoment={...appState.firstMoment,url:parsed.href,videoId:id,title:'첫 순간으로 연결할 영상',note:this.$('#discovery-note').value,discoveryDate:this.$('#discovery-date').value||today(),thumbnail:thumb(id),saved:true};
        if(!appState.memory.note)appState.memory.note=appState.firstMoment.note;appState.memory.date=appState.firstMoment.discoveryDate;persist();this.showToast('첫 뿌리가 생겼어요 ✦');setTimeout(()=>showScreen('step2'),480)
      });
      this.shadowRoot.addEventListener('keydown',event=>{if(event.key==='Escape')this.closeModal()});
    }
  }

  class MemoryStage extends HTMLElement{
    connectedCallback(){if(this.shadowRoot)return;this.attachShadow({mode:'open'}).append(document.querySelector('#step2-template').content.cloneNode(true));this.$=s=>this.shadowRoot.querySelector(s);this.toast=this.$('#toast');this.publicMemo=false;this.wire();this.relabelProgress();this.updateFromState();this.setMode(appState.currentScreen==='step2-success'?'success':'form')}
    showToast(message){this.toast.textContent=message;this.toast.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>this.toast.classList.remove('show'),2200)}
    relabelProgress(){const labels=['첫 순간','마음 남기기','다음 영상 잇기','러브트리 성장'];this.shadowRoot.querySelectorAll('.progress-item span').forEach((el,i)=>el.textContent=labels[i])}
    selectedEmotion(){const custom=this.$('#custom-emotion').value.trim();return custom||this.$('.chip.selected')?.dataset.emotion||'설렘'}
    setTime(seconds){const value=formatTime(seconds);this.$('#time').value=value;this.$('#card-time').value=value;this.$('#video-time').textContent=value;appState.memory.time=value;persist()}
    setMode(mode){this.$('#form-view').classList.toggle('hidden',mode!=='form');this.$('#success-view').classList.toggle('hidden',mode!=='success')}
    updateFromState(){
      const first=appState.firstMoment;const memory=appState.memory;const frame=this.$('#video-frame');
      frame.style.backgroundImage=`linear-gradient(180deg,rgba(255,245,233,.06),rgba(42,31,33,.30)),url(${thumb(first.videoId)})`;
      this.$('#video-url').textContent=first.url||'https://youtube.com/watch?v=nqofkzQD19E';this.$('#video-title').textContent=first.title||'처음 마음이 멈춘 장면';
      this.$('#time').value=memory.time||'01:30';this.$('#card-time').value=memory.time||'01:30';this.$('#video-time').textContent=memory.time||'01:30';
      this.$('#memory').value=memory.note||first.note||'';this.$('#counter').textContent=`${this.$('#memory').value.length} / 140`;this.$('#date').value=memory.date||first.discoveryDate||today();
      this.$('#custom-emotion').value=memory.customEmotion||'';this.shadowRoot.querySelectorAll('.chip').forEach(chip=>chip.classList.toggle('selected',!memory.customEmotion&&chip.dataset.emotion===(memory.emotion||'설렘')));
      this.publicMemo=Boolean(memory.publicMemo);this.$('#visibility').classList.toggle('on',this.publicMemo);this.$('#visibility').setAttribute('aria-pressed',String(this.publicMemo));this.$('#visibility-label').textContent=this.publicMemo?'공개할 때 이 메모도 함께 보여주기':'공개할 때 이 메모는 나만 보기';
      if(memory.saved)this.fillResult();
    }
    fillResult(){const m=appState.memory;this.$('#result-emotion').textContent=`${m.emotion||'설렘'} · ${m.time||'01:30'}`;this.$('#result-memory').textContent=m.note||'이 장면을 다시 보고 싶어서 첫 마음으로 남겼어요.';this.$('#result-date').textContent=`${m.date||'날짜 미정'} · ${m.publicMemo?'공개 메모':'나만 보는 메모'}`}
    wire(){
      this.shadowRoot.querySelectorAll('.chip').forEach(button=>button.addEventListener('click',()=>{this.shadowRoot.querySelectorAll('.chip').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');this.$('#custom-emotion').value='';appState.memory.emotion=button.dataset.emotion;appState.memory.customEmotion='';persist()}));
      this.$('#custom-emotion').addEventListener('input',event=>{if(event.target.value.trim())this.shadowRoot.querySelectorAll('.chip').forEach(item=>item.classList.remove('selected'));appState.memory.customEmotion=event.target.value;appState.memory.emotion=event.target.value.trim()||'설렘';persist()});
      this.$('#memory').addEventListener('input',()=>{this.$('#counter').textContent=`${this.$('#memory').value.length} / 140`;appState.memory.note=this.$('#memory').value;persist()});
      this.$('#date').addEventListener('input',()=>{appState.memory.date=this.$('#date').value;persist()});
      this.$('#time').addEventListener('input',()=>{appState.memory.time=this.$('#time').value;persist()});
      this.$('#minus-five').addEventListener('click',()=>{const seconds=parseTime(this.$('#time').value);this.setTime((seconds===null?90:seconds)-5)});
      this.$('#plus-five').addEventListener('click',()=>{const seconds=parseTime(this.$('#time').value);this.setTime((seconds===null?90:seconds)+5)});
      this.$('#sync-time').addEventListener('click',()=>{const seconds=parseTime(this.$('#card-time').value);if(seconds===null){this.$('#card-time').focus();this.showToast('시간을 01:30처럼 적어 주세요.');return}this.setTime(seconds);this.showToast('기억할 시간을 맞췄어요.')});
      this.$('#play').addEventListener('click',()=>window.open(`https://www.youtube.com/watch?v=${appState.firstMoment.videoId}&t=${parseTime(this.$('#time').value)||0}s`,'_blank','noopener'));
      this.$('#visibility').addEventListener('click',event=>{this.publicMemo=!this.publicMemo;event.currentTarget.classList.toggle('on',this.publicMemo);event.currentTarget.setAttribute('aria-pressed',String(this.publicMemo));this.$('#visibility-label').textContent=this.publicMemo?'공개할 때 이 메모도 함께 보여주기':'공개할 때 이 메모는 나만 보기';appState.memory.publicMemo=this.publicMemo;persist()});
      this.$('#memory-form').addEventListener('submit',event=>{event.preventDefault();const seconds=parseTime(this.$('#time').value);if(seconds===null){this.$('#time').focus();this.showToast('영상 시간은 01:30 형식으로 적어 주세요.');return}const emotion=this.selectedEmotion();const note=this.$('#memory').value.trim()||'이 장면을 다시 보고 싶어서 첫 마음으로 남겼어요.';appState.memory={emotion,customEmotion:this.$('#custom-emotion').value.trim(),time:formatTime(seconds),note,date:this.$('#date').value,publicMemo:this.publicMemo,saved:true};localStorage.setItem(STEP2_KEY,JSON.stringify({id:appState.firstMoment.videoId,url:appState.firstMoment.url,title:appState.firstMoment.title,time:appState.memory.time,emotion,note,date:appState.memory.date,publicMemo:this.publicMemo}));persist();this.fillResult();this.setMode('success');appState.currentScreen='step2-success';persist();updateNav();this.showToast('첫 마음 카드가 피어났어요 ✦')});
      this.$('#edit').addEventListener('click',()=>{this.setMode('form');appState.currentScreen='step2';persist();updateNav();this.$('#memory').focus()});
      this.$('#next').addEventListener('click',()=>{this.showToast('첫 가지가 자라는 화면으로 이어집니다.');setTimeout(()=>showScreen('step3'),360)});
      this.$('#back').addEventListener('click',()=>showScreen('step1'));
    }
  }

  class ConnectStage extends HTMLElement{
    connectedCallback(){if(this.shadowRoot)return;this.attachShadow({mode:'open'}).append(document.querySelector('#step3-template').content.cloneNode(true));this.$=s=>this.shadowRoot.querySelector(s);this.toast=this.$('#toast');this.firstRecord=null;this.wire();this.relabelProgress();this.updateFromState();this.setMode(appState.currentScreen==='step3-success'?'success':'form')}
    showToast(message){this.toast.textContent=message;this.toast.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>this.toast.classList.remove('show'),2200)}
    relabelProgress(){const labels=['첫 순간','마음 남기기','다음 영상 잇기','러브트리 성장'];this.shadowRoot.querySelectorAll('.progress-item span').forEach((el,i)=>el.textContent=labels[i])}
    currentFirst(){return appState.step3Origin||{id:appState.firstMoment.videoId,url:appState.firstMoment.url,title:appState.firstMoment.title,time:appState.memory.time||'01:30',emotion:appState.memory.emotion||'설렘',note:appState.memory.note||appState.firstMoment.note,date:appState.memory.date||appState.firstMoment.discoveryDate}}
    selectedRelation(){return this.$('.relation.selected')?.dataset.relation||'댓글을 따라 찾아봤어요'}
    setMode(mode){this.$('#form-view').classList.toggle('hidden',mode!=='form');this.$('#success-view').classList.toggle('hidden',mode!=='success');const items=[...this.shadowRoot.querySelectorAll('.progress-item')];if(mode==='success'){items[2].classList.remove('active');items[2].classList.add('done');items[2].querySelector('i').textContent='✓'}else{items[2].classList.add('active');items[2].classList.remove('done');items[2].querySelector('i').textContent='03'}}
    applyFirstCard(){this.firstRecord=this.currentFirst();const id=this.firstRecord.id||youtubeId(this.firstRecord.url);this.$('#first-thumb').style.backgroundImage=`linear-gradient(180deg,rgba(255,245,233,.05),rgba(44,32,34,.30)),url(${thumb(id)})`;this.$('#first-title').textContent=this.firstRecord.title||'처음 마음이 멈춘 장면';this.$('#first-note').textContent=this.firstRecord.note||'우연히 보게 됐는데 하루 종일 이 장면이 생각났어.';this.$('#first-time').textContent=this.firstRecord.time||'01:30';let meta=this.$('.first-extra-meta');if(!meta){meta=document.createElement('span');meta.className='first-extra-meta';this.$('.moment.first .card-copy').append(meta)}meta.textContent=`${this.firstRecord.emotion||'설렘'} · ${this.firstRecord.date||'날짜 미정'}`}
    updateNextPreview(){const id=youtubeId(this.$('#next-url').value);const title=this.$('#next-title').value.trim()||'다음으로 찾아본 영상';const note=this.$('#next-note').value.trim()||'왜 이 영상으로 이어졌는지 한 문장으로 남겨 보세요.';const validTime=parseTime(this.$('#next-time').value)!==null?this.$('#next-time').value:'00:00';this.$('#next-title-preview').textContent=title;this.$('#next-note-preview').textContent=note;this.$('#next-time-label').textContent=validTime;this.$('#relation-bubble').textContent=this.selectedRelation();if(id){this.$('#next-thumb').style.backgroundImage=`linear-gradient(180deg,rgba(255,245,233,.05),rgba(44,32,34,.30)),url(${thumb(id)})`;this.$('#next-card').classList.remove('waiting');this.$('#empty-seed').classList.add('hidden');this.$('#next-play').classList.remove('hidden');this.$('#next-time-label').classList.remove('hidden');this.$('#url-status').textContent='다음 영상이 카드에 연결됐어요.';this.$('#url-status').style.color='var(--sage-deep)'}else{this.$('#next-thumb').style.backgroundImage='';this.$('#next-card').classList.add('waiting');this.$('#empty-seed').classList.remove('hidden');this.$('#next-play').classList.add('hidden');this.$('#next-time-label').classList.add('hidden');this.$('#url-status').textContent='링크를 넣으면 오른쪽 카드에 썸네일이 나타나요.';this.$('#url-status').style.color=''}}
    updateFromState(){this.applyFirstCard();const d=appState.drafts.step3||{};this.$('#next-url').value=d.url||'';this.$('#next-title').value=d.title||'';this.$('#next-time').value=d.time||'00:00';this.$('#next-note').value=d.note||'';this.$('#counter').textContent=`${this.$('#next-note').value.length} / 140`;this.shadowRoot.querySelectorAll('.relation').forEach((item,index)=>item.classList.toggle('selected',d.relation?item.dataset.relation===d.relation:index===0));this.updateNextPreview();if(appState.connections.length&&appState.currentScreen==='step3-success')this.fillSuccess(appState.connections[appState.connections.length-1])}
    saveDraft(){appState.drafts.step3={url:this.$('#next-url').value,title:this.$('#next-title').value,time:this.$('#next-time').value,relation:this.selectedRelation(),note:this.$('#next-note').value};persist()}
    fillSuccess(connection){this.$('#summary-first').textContent=connection.first.title||'처음 마음이 멈춘 장면';this.$('#summary-next').textContent=connection.next.title;this.$('#success-relation').textContent=connection.next.relation}
    resetForm(){appState.drafts.step3={url:'',title:'',time:'00:00',relation:'댓글을 따라 찾아봤어요',note:''};this.$('#next-url').value='';this.$('#next-title').value='';this.$('#next-time').value='00:00';this.$('#next-note').value='';this.$('#counter').textContent='0 / 140';this.shadowRoot.querySelectorAll('.relation').forEach((item,index)=>item.classList.toggle('selected',index===0));this.$('#branch-path').classList.remove('connected');this.$('#branch-leaf').classList.remove('connected');persist();this.updateNextPreview()}
    wire(){
      ['#next-url','#next-title','#next-time'].forEach(selector=>this.$(selector).addEventListener('input',()=>{this.saveDraft();this.updateNextPreview()}));
      this.$('#next-note').addEventListener('input',()=>{this.$('#counter').textContent=`${this.$('#next-note').value.length} / 140`;this.saveDraft();this.updateNextPreview()});
      this.shadowRoot.querySelectorAll('.relation').forEach(button=>button.addEventListener('click',()=>{this.shadowRoot.querySelectorAll('.relation').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');this.saveDraft();this.updateNextPreview()}));
      this.$('#connect-form').addEventListener('submit',event=>{event.preventDefault();const id=youtubeId(this.$('#next-url').value);if(!id){this.$('#next-url').focus();this.showToast('YouTube 링크를 확인해 주세요.');return}if(parseTime(this.$('#next-time').value)===null){this.$('#next-time').focus();this.showToast('영상 시간은 01:30 형식으로 적어 주세요.');return}const nextRecord={id,url:this.$('#next-url').value.trim(),title:this.$('#next-title').value.trim()||'다음으로 찾아본 영상',time:this.$('#next-time').value.trim(),relation:this.selectedRelation(),note:this.$('#next-note').value.trim()||'첫 장면을 본 뒤 이 영상까지 찾아보게 됐어요.'};const connection={first:this.currentFirst(),next:nextRecord,createdAt:new Date().toISOString()};appState.connections.push(connection);localStorage.setItem(STEP3_KEY,JSON.stringify(connection));this.$('#branch-path').classList.add('connected');this.$('#branch-leaf').classList.add('connected');this.$('#relation-bubble').textContent=nextRecord.relation;this.fillSuccess(connection);this.setMode('success');appState.currentScreen='step3-success';persist();updateNav();this.showToast('첫 가지가 이어졌어요 ✦')});
      this.$('#again').addEventListener('click',()=>{const last=appState.connections[appState.connections.length-1];if(last?.next){appState.step3Origin={...last.next,emotion:this.currentFirst().emotion||'설렘',date:today()};localStorage.setItem(STEP2_KEY,JSON.stringify(appState.step3Origin))}this.applyFirstCard();this.resetForm();this.setMode('form');appState.currentScreen='step3';persist();updateNav();this.$('#next-url').focus();this.showToast('방금 연결한 영상에서 다음 가지를 시작해요.')});
      this.$('#finish').addEventListener('click',()=>{this.showToast('두 장면이 연결된 러브트리를 열어요.');setTimeout(()=>showScreen('growth'),350)});
      this.$('#back').addEventListener('click',()=>showScreen('step2-success'));
    }
  }

  class GrowthStage extends HTMLElement{
    connectedCallback(){if(this.shadowRoot)return;this.attachShadow({mode:'open'});this.render()}
    updateFromState(){this.render()}
    render(){const last=appState.connections[appState.connections.length-1]||{first:{},next:{}};const firstId=last.first.id||youtubeId(last.first.url);const nextId=last.next.id||youtubeId(last.next.url);this.shadowRoot.innerHTML=`<style>:host{display:block}*{box-sizing:border-box}.growth-screen{min-height:calc(100vh - 76px);padding:46px 24px 70px;background:radial-gradient(circle at 12% 18%,rgba(219,151,145,.20),transparent 27rem),radial-gradient(circle at 92% 80%,rgba(156,174,130,.17),transparent 28rem),linear-gradient(135deg,#f8f1e9,#fbf8f1 58%,#f1e8dc);font-family:var(--body);color:var(--ink)}.growth-shell{width:min(1000px,100%);margin:auto;text-align:center}.eyebrow{margin:0 0 15px;color:var(--deep);font:700 .62rem var(--latin);letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font:400 clamp(2.8rem,6vw,5.2rem)/1.08 var(--display);letter-spacing:-.085em}h1 span{display:block;color:var(--rose)}.intro{max-width:600px;margin:20px auto 30px;color:var(--muted);font-size:.83rem;line-height:1.8}.board{position:relative;min-height:430px;padding:26px;border:1px solid var(--line);border-radius:34px;background:rgba(255,253,248,.84);box-shadow:0 28px 80px rgba(75,51,42,.15);overflow:hidden;text-align:left}.board:before{content:"";position:absolute;left:50%;top:34px;bottom:44px;width:3px;border-radius:9px;background:linear-gradient(var(--rose),#d9bda4,var(--sage));transform:translateX(-50%)}.cards{position:relative;z-index:2;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:18px;min-height:330px}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 16px 35px rgba(75,51,42,.13)}.thumb{height:155px;background:linear-gradient(145deg,#dba6a2,#e8cfbf 48%,#a7b38e);background-size:cover;background-position:center;display:grid;place-items:center;color:white;font-size:1.5rem}.copy{padding:15px}.copy small{color:var(--deep);font:700 .55rem var(--latin)}.copy strong{display:block;margin-top:6px;font:400 1.1rem var(--display)}.copy p{margin:6px 0 0;color:var(--muted);font-size:.65rem;line-height:1.55}.arrow{display:grid;place-items:center;width:52px;height:52px;margin:auto;border-radius:50%;background:#e1e9dc;color:var(--sage-deep);font-size:1.2rem}.actions{display:flex;justify-content:center;gap:10px;margin-top:24px}.actions button{min-height:45px;padding:0 18px;border-radius:999px;font-weight:700}.again{border:1px solid rgba(89,107,76,.3);background:var(--white);color:var(--sage-deep)}.home{border:0;background:var(--rose);color:white}@media(max-width:560px){.growth-screen{min-height:calc(100vh - 66px);padding:30px 15px 50px}.cards{grid-template-columns:1fr;gap:12px}.board:before{left:50%;top:185px;bottom:185px}.arrow{transform:rotate(90deg)}.actions{display:grid}.actions button{width:100%}}</style><section class="growth-screen"><div class="growth-shell"><p class="eyebrow">04 · 러브트리 성장</p><h1>첫 가지가<br><span>다정하게 이어졌어요.</span></h1><p class="intro">처음 만든 영상과 다음 영상 사이에 이유와 마음이 생겼습니다. 이제 러브트리가 단순한 영상 목록이 아니라 좋아하게 된 경로를 보여줘요.</p><div class="board"><div class="cards"><article class="card"><div class="thumb" style="background-image:${firstId?`linear-gradient(180deg,rgba(255,245,233,.05),rgba(44,32,34,.28)),url(${thumb(firstId)})`:'none'}">${firstId?'':'✿'}</div><div class="copy"><small>01 · 첫 순간</small><strong>${escapeHtml(last.first.title||'처음 마음이 멈춘 장면')}</strong><p>${escapeHtml(last.first.note||'처음 마음이 머문 장면')}</p></div></article><span class="arrow">→</span><article class="card"><div class="thumb" style="background-image:${nextId?`linear-gradient(180deg,rgba(255,245,233,.05),rgba(44,32,34,.28)),url(${thumb(nextId)})`:'none'}">${nextId?'':'✿'}</div><div class="copy"><small>02 · 다음 영상</small><strong>${escapeHtml(last.next.title||'다음으로 찾아본 영상')}</strong><p>${escapeHtml(last.next.note||'두 장면 사이에 있었던 마음')}</p></div></article></div></div><div class="actions"><button class="again" id="growth-again" type="button">이 영상에서 또 이어보기</button><button class="home" id="growth-home" type="button">처음 화면으로</button></div></div></section>`;this.shadowRoot.querySelector('#growth-again').addEventListener('click',()=>showScreen('step3'));this.shadowRoot.querySelector('#growth-home').addEventListener('click',()=>showScreen('landing'))}
  }
  function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

  customElements.define('landing-stage',LandingStage);customElements.define('memory-stage',MemoryStage);customElements.define('connect-stage',ConnectStage);customElements.define('growth-stage',GrowthStage);
  const stageEls={landing:document.querySelector('#landing-stage'),step2:document.querySelector('#memory-stage'),step3:document.querySelector('#connect-stage'),growth:document.querySelector('#growth-stage')};
  function showScreen(screen){
    if(screen==='step2'&&!appState.firstMoment.saved){showGlobalToast('첫 순간을 먼저 심어 주세요.');return}
    if(screen==='step3'&&!appState.memory.saved){showGlobalToast('첫 마음 카드를 먼저 피워 주세요.');return}
    if(screen==='growth'&&!appState.connections.length){showGlobalToast('다음 순간을 하나 연결해 주세요.');return}
    appState.currentScreen=screen;persist();const stage=stageForScreen(screen);Object.entries(stageEls).forEach(([key,el])=>el.hidden=key!==stage);
    if(stage==='landing'){stageEls.landing.setMode(screen==='step1'?'step1':'landing');stageEls.landing.updateFromState()}
    if(stage==='step2'){stageEls.step2.updateFromState();stageEls.step2.setMode(screen==='step2-success'?'success':'form')}
    if(stage==='step3'){stageEls.step3.updateFromState();stageEls.step3.setMode(screen==='step3-success'?'success':'form')}
    if(stage==='growth')stageEls.growth.updateFromState();updateNav();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})
  }
  function updateNav(){
    const screen=appState.currentScreen;const current=screen==='step1'?1:screen.startsWith('step2')?2:screen.startsWith('step3')?3:screen==='growth'?4:0;
    document.querySelectorAll('.stage-button').forEach((button,index)=>{const n=index+1;const unlocked=n===1||(n===2&&appState.firstMoment.saved)||(n===3&&appState.memory.saved)||(n===4&&appState.connections.length);button.classList.toggle('locked',!unlocked);button.classList.toggle('active',current===n);button.classList.toggle('done',n<current||(n===3&&screen==='step3-success')||(n===4&&screen==='growth'));button.setAttribute('aria-disabled',String(!unlocked))});
    document.body.dataset.started=String(screen!=='landing'||appState.firstMoment.saved)
  }
  document.querySelectorAll('.stage-button').forEach(button=>button.addEventListener('click',()=>{const target=button.dataset.stage;if(target==='step1'){if(!appState.treeName){stageEls.landing.openModal();return}showScreen('step1')}else showScreen(target)}));
  document.querySelector('#brand-home').addEventListener('click',()=>showScreen('landing'));
  document.querySelector('#browse-action').addEventListener('click',()=>showGlobalToast('러브트리 둘러보기는 다음 제품 화면에서 이어집니다.'));
  document.querySelector('#login-action').addEventListener('click',()=>showGlobalToast('로그인은 실제 제품 구현 단계에서 연결됩니다.'));
  document.querySelector('#reset-action').addEventListener('click',()=>{if(!confirm('첫 여정에 입력한 내용을 지우고 처음부터 다시 시작할까요?'))return;localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(STEP2_KEY);localStorage.removeItem(STEP3_KEY);appState=defaultState();persist();stageEls.landing.updateFromState();stageEls.step2.updateFromState();stageEls.step3.updateFromState();showScreen('landing')});
  window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY){appState=loadState();showScreen(appState.currentScreen)}});
  persist();showScreen(appState.currentScreen);
})();
</script>
