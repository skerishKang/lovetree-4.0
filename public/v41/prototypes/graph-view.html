/* ---------- 규칙 (docs/GRAPH_VIEW_20261115.md §2) ---------- */
const KIND_LABEL = {artist:'가수', song:'노래', stage:'무대', member:'멤버', era:'활동기', emotion:'감정'};
const KIND_COLOR = {stage:'var(--lt-gold-deep)', song:'var(--lt-rose)', artist:'var(--lt-blue)', member:'var(--lt-violet)', era:'var(--lt-violet)', emotion:'var(--lt-rose-ink)'};
const PRIORITY = ['stage','song','artist']; /* 1차 소속: 무대 > 노래 > 가수 */

function parseTag(raw){
  const i = raw.indexOf(':');
  if(i < 0) return null;
  const label = raw.slice(0, i);
  const kind = Object.keys(KIND_LABEL).find(k => KIND_LABEL[k] === label);
  if(!kind) return null;
  return {kind, value: raw.slice(i+1), raw};
}
function parseDate(s){
  const m = /^(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})$/.exec(String(s||''));
  if(!m) return null;
  return Date.UTC(+m[1], +m[2]-1, +m[3]);
}
function hash01(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}
/* 묶음 모델: 꼬리표 → 허브·1차 소속·발자취 */
function buildModel(){
  const moments = MOMENTS.map(m => {
    const tags = (m.tags||[]).map(parseTag).filter(Boolean);
    let primary = null;
    for(const k of PRIORITY){ const hit = tags.find(t => t.kind === k); if(hit){ primary = hit; break; } }
    return {...m, tags, primary, time: parseDate(m.d)};
  });
  const hubMap = new Map();
  for(const m of moments){
    for(const t of m.tags){
      if(!PRIORITY.includes(t.kind)) continue; /* 멤버·활동기·감정은 허브가 아니라 상세 칩과 걸러 보기로 */
      const key = t.kind + ':' + t.value;
      if(!hubMap.has(key)) hubMap.set(key, {key, kind:t.kind, value:t.value, primaryIds:[], allIds:[]});
      hubMap.get(key).allIds.push(m.id);
    }
    if(m.primary){
      const key = m.primary.kind + ':' + m.primary.value;
      hubMap.get(key).primaryIds.push(m.id);
    }
  }
  const hubs = [...hubMap.values()].filter(h => h.allIds.length >= 2); /* 1개뿐인 꼬리표는 허브로 만들지 않는다 */
  hubs.sort((a,b) => b.primaryIds.length - a.primaryIds.length || PRIORITY.indexOf(a.kind) - PRIORITY.indexOf(b.kind) || a.value.localeCompare(b.value));
  return {moments, hubs};
}

/* ---------- 배치 (안2 묶음 원형, 결정론) ---------- */
const svg = document.getElementById('gsvg');
let MODEL = buildModel();
let selected = {type:'moment', id:'m01'};
let filterHub = null;
let trailOrder = [];
let visibleTrail = [];
let selectionMade = false;
let playTimer = null;

function layoutModel(W, H){
  const {moments, hubs} = MODEL;
  const narrow = W < 600;
  const s = narrow ? 1 : Math.max(.94, Math.min(1, W / 1040));
  const shelfH = narrow ? 54 : 62;
  const top = 22;
  const usableBottom = H - shelfH - (narrow ? 16 : 8);
  const dotR = (narrow ? 7 : 8.5) * s;
  hubs.forEach(h => {
    const n = h.primaryIds.length;
    const strength = Math.max(1, n);
    h.hr = (narrow ? 9 : 12) + Math.sqrt(strength) * (narrow ? 1.8 : 2);
    const orbitR = n > 0 ? Math.max(h.hr + dotR + (narrow ? 13 : 17), n * (dotR * 2 + 4) / (Math.PI * 2)) : 0;
    h.orbitR = orbitR;
    h.cr = n > 0 ? orbitR + dotR + 5 : h.hr + 8;
    h.color = KIND_COLOR[h.kind];
  });
  const maxC = Math.max(...hubs.map(h => h.cr), 0);
  const cx = W / 2, cy = (top + usableBottom) / 2 - (narrow ? 0 : 7);
  const rx = Math.max(0, Math.min(W * .36, W / 2 - maxC - 96));
  const ry = Math.max(0, Math.min((usableBottom - top) / 2 - maxC - 48, H * .32));
  const cols = 3, rows = Math.ceil(hubs.length / cols);
  const rowH = (usableBottom - top) / rows;
  hubs.forEach((h, i) => {
    if(narrow){
      const col = i % cols, row = Math.floor(i / cols);
      const labelH = 35;
      h.x = (col + .5) * W / cols;
      h.y = top + row * rowH + Math.max(0, (rowH - (h.cr * 2 + labelH)) / 2) + h.cr;
    } else {
      const a = -Math.PI / 2 + i * Math.PI * 2 / hubs.length;
      h.x = cx + Math.cos(a) * rx;
      h.y = cy + Math.sin(a) * ry;
    }
    const members = h.primaryIds.map(id => moments.find(m => m.id === id));
    members.forEach((m, j) => {
      const a = -Math.PI / 2 + j * Math.PI * 2 / members.length + hash01(m.id) * .12;
      m.x = h.x + Math.cos(a) * h.orbitR;
      m.y = h.y + Math.sin(a) * h.orbitR;
    });
  });
  const shelf = moments.filter(m => !m.primary).sort(byTime);
  const gap = narrow ? (W - 76) / Math.max(1, shelf.length - 1) : 54;
  const x0 = (W - gap * Math.max(0, shelf.length - 1)) / 2;
  shelf.forEach((m, i) => { m.x = x0 + i * gap; m.y = H - shelfH; });
  trailOrder = [...moments].sort(byTime);
  trailOrder.forEach((m, i) => { m.trailPrev = i > 0 ? trailOrder[i-1] : null; m.trailNext = i < trailOrder.length-1 ? trailOrder[i+1] : null; });
  MODEL.narrow = narrow;
  MODEL.W = W;
  MODEL.H = H;
  MODEL.s = s;
  MODEL.dotR = dotR;
  MODEL.shelfH = shelfH;
  MODEL.cx = cx;
  MODEL.cy = cy;
}
function byTime(a, b){
  const ta = a.time == null ? Infinity : a.time, tb = b.time == null ? Infinity : b.time;
  return ta - tb || a.id.localeCompare(b.id);
}
function trailPath(pts){
  if(pts.length < 2) return '';
  let d = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(i-1, 0)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(i+2, pts.length-1)];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += 'C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }
  return d;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent){
  const n = document.createElementNS(SVGNS, name);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function dimmed(hubKey){
  return filterHub !== null && filterHub !== hubKey;
}
function awake(g, action){
  g.addEventListener('click', action);
  g.addEventListener('keydown', event => {
    if(event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    const type = g.dataset.hub != null ? 'hub' : 'moment';
    const id = g.dataset[type];
    action();
    svg.querySelector('[data-' + type + '="' + CSS.escape(id) + '"]')?.focus({preventScroll:true});
  });
}
function refresh(){
  render();
  drawLegend();
  drawDetail();
}
function selectMoment(id){
  selectionMade = true;
  selected = {type:'moment', id};
  visibleTrail = trailOrder;
  filterHub = null;
  refresh();
}
function selectHub(key){
  const h = MODEL.hubs.find(item => item.key === key);
  if(!h) return;
  const ids = new Set(h.primaryIds.length > 0 ? h.primaryIds : h.allIds);
  selectionMade = true;
  selected = {type:'hub', key};
  visibleTrail = trailOrder.filter(m => ids.has(m.id));
  filterHub = key;
  refresh();
}
function hit(a, b){
  return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
}
function labelRect(name, sub){
  const a = name.getBBox(), b = sub.getBBox();
  return {x:Math.min(a.x, b.x) - 2, y:Math.min(a.y, b.y) - 2, width:Math.max(a.x + a.width, b.x + b.width) - Math.min(a.x, b.x) + 4, height:Math.max(a.y + a.height, b.y + b.height) - Math.min(a.y, b.y) + 4};
}
function textOnPoint(r, point, radius){
  const x = Math.max(r.x, Math.min(point.x, r.x + r.width));
  const y = Math.max(r.y, Math.min(point.y, r.y + r.height));
  return Math.hypot(point.x - x, point.y - y) < radius + 3;
}
function clearLabel(r, placed){
  const {moments, hubs, W, H, shelfH, dotR} = MODEL;
  if(r.x < 6 || r.y < 6 || r.x + r.width > W - 6 || r.y + r.height > H - shelfH - 6) return false;
  if(placed.some(other => hit(r, other))) return false;
  if(moments.some(m => m.x != null && textOnPoint(r, m, dotR + (m.imp ? 1.5 : 0)))) return false;
  return !hubs.some(h => textOnPoint(r, h, h.hr));
}
function placeHubLabel(h, name, sub, group, placed){
  const {W, narrow} = MODEL;
  const maxWidth = narrow ? Math.min(112, W / 3 - 10) : 148;
  while(name.getComputedTextLength() > maxWidth && name.textContent.length > 2){
    name.textContent = name.textContent.replace(/…?$/, '') + '…';
  }
  const sides = narrow ? ['bottom','top','right','left'] : (Math.abs(h.x - MODEL.cx) > Math.abs(h.y - MODEL.cy)
    ? [h.x < MODEL.cx ? 'left' : 'right', h.y < MODEL.cy ? 'top' : 'bottom', 'bottom','top']
    : [h.y < MODEL.cy ? 'top' : 'bottom', h.x < MODEL.cx ? 'left' : 'right', 'right','left']);
  for(const side of sides){
    let x = h.x, y = h.y, anchor = 'middle';
    if(side === 'bottom') y = h.y + h.cr + 16;
    if(side === 'top') y = h.y - h.cr - 34;
    if(side === 'left' || side === 'right'){
      x = h.x + (side === 'left' ? -1 : 1) * (h.cr + 13);
      y = h.y - 7;
      anchor = side === 'left' ? 'end' : 'start';
    }
    if(anchor === 'middle'){
      const width = Math.max(name.getComputedTextLength(), sub.getComputedTextLength());
      x = Math.max(width / 2 + 8, Math.min(x, W - width / 2 - 8));
    }
    name.setAttribute('x', x);
    name.setAttribute('y', y);
    name.setAttribute('text-anchor', anchor);
    sub.setAttribute('x', x);
    sub.setAttribute('y', y + 21);
    sub.setAttribute('text-anchor', anchor);
    const r = labelRect(name, sub);
    if(clearLabel(r, placed)) return r;
  }
  group.remove();
  return null;
}
function render(){
  const box = svg.parentElement.getBoundingClientRect();
  const W = Math.max(300, Math.round(box.width)), H = Math.max(360, Math.round(box.height));
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.replaceChildren();
  layoutModel(W, H);
  const {moments, hubs, narrow} = MODEL;

  /* 기본에는 묶음 안의 설명선만. 전체 시간 선은 고르거나 걸을 때만 그린다. */
  const spokeG = el('g', {class:'g-cluster-spokes'}, svg);
  for(const h of hubs){
    const related = h.primaryIds.length === 0 && (filterHub === h.key || (selected.type === 'hub' && selected.key === h.key) || (selected.type === 'moment' && selectionMade && h.allIds.includes(selected.id)));
    const ids = related ? h.allIds : h.primaryIds;
    for(const id of ids){
      const m = moments.find(x => x.id === id);
      el('line', {x1:h.x, y1:h.y, x2:m.x, y2:m.y, stroke:h.color, 'stroke-width':1, opacity:related ? .55 : .16, 'stroke-dasharray':related ? '3 4' : 'none'}, spokeG);
    }
  }

  const orderedTrail = visibleTrail.filter(m => m.x != null);
  const activeTrail = orderedTrail.length > 1;
  const selectedMoment = selectionMade && selected.type === 'moment' ? moments.find(m => m.id === selected.id) : null;
  const selectedHubKey = selected.type === 'hub' ? selected.key : selectedMoment?.primary ? selectedMoment.primary.kind + ':' + selectedMoment.primary.value : null;
  if(activeTrail){
    el('path', {class:'g-trail-path g-time-trail', d:trailPath(orderedTrail), fill:'none', stroke:'var(--lt-gold)', 'stroke-width':1.4, opacity:.78, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, svg);
  }

  const hubGroups = new Map();
  for(const h of hubs){
    const dim = dimmed(h.key);
    const chosen = selected.type === 'hub' && selected.key === h.key;
    const g = el('g', {tabindex:'0', role:'button', 'aria-label':KIND_LABEL[h.kind] + ' ' + h.value + ' · 순간 ' + (h.primaryIds.length || h.allIds.length) + '개', 'aria-pressed':chosen ? 'true' : 'false', opacity:dim ? .18 : activeTrail && selectedHubKey !== h.key ? .35 : 1}, svg);
    g.dataset.hub = h.key;
    hubGroups.set(h.key, g);
    el('title', {}, g).textContent = h.value + ' · 이 노래/묶음의 내 순간들';
    el('circle', {class:'g-hub-focus', cx:h.x, cy:h.y, r:h.cr, fill:'none', stroke:'none', opacity:0}, g);
    if(h.primaryIds.length > 0){
      el('circle', {cx:h.x, cy:h.y, r:h.cr, fill:'none', stroke:h.color, 'stroke-width':1, opacity:.26, 'stroke-dasharray':'2 5'}, g);
      el('circle', {cx:h.x, cy:h.y, r:h.orbitR, fill:'none', stroke:h.color, 'stroke-width':1, opacity:.18}, g);
    }
    el('circle', {cx:h.x, cy:h.y, r:h.hr, fill:h.color, opacity:.95, stroke:chosen ? 'var(--lt-pearl)' : 'none', 'stroke-width':chosen ? 2 : 0}, g);
    const labelG = el('g', {class:'g-hub-label'}, g);
    const name = el('text', {class:'g-hubname', style:'font-size:' + (narrow ? 12.5 : 14.5) + 'px'}, labelG);
    name.textContent = h.value;
    const sub = el('text', {class:'g-hubsub', style:'font-size:' + (narrow ? 11.5 : 12) + 'px'}, labelG);
    sub.textContent = KIND_LABEL[h.kind] + ' · ' + (h.primaryIds.length > 0 ? '순간 ' + h.primaryIds.length : '관련 ' + h.allIds.length);
    g.hubLabelParts = {name, sub, labelG};
    awake(g, () => selectHub(h.key));
  }

  const dotG = el('g', {class:'g-moment-dots'}, svg);
  for(const m of moments){
    const hub = m.primary ? hubs.find(h => h.kind + ':' + h.value === m.primary.kind + ':' + m.primary.value) : null;
    const color = hub ? hub.color : 'var(--lt-muted)';
    const chosenCollection = selected.type === 'hub' && hub && selected.key === hub.key;
    const dim = (filterHub !== null && !chosenCollection) || (activeTrail && selectedMoment && selected.id !== m.id);
    const r = MODEL.dotR + (m.imp ? 1.5 : 0);
    const chosen = selectionMade && selected.type === 'moment' && selected.id === m.id;
    const g = el('g', {tabindex:'0', role:'button', 'aria-label':'순간 ' + m.t + ' · ' + m.d, opacity:dim ? .14 : 1}, dotG);
    g.dataset.moment = m.id;
    if(chosen) g.setAttribute('aria-current', 'true');
    el('title', {}, g).textContent = m.t + ' · ' + m.d;
    el('circle', {class:'g-dot-focus', cx:m.x, cy:m.y, r:r + (chosen ? 5 : 3), fill:'none', stroke:'var(--lt-gold)', 'stroke-width':2, opacity:chosen ? 1 : 0}, g);
    el('circle', {cx:m.x, cy:m.y, r, fill:color, stroke:m.imp ? 'var(--lt-gold)' : 'var(--lt-stage)', 'stroke-width':m.imp ? 1.6 : 1.2}, g);
    if(!m.primary) el('circle', {cx:m.x, cy:m.y, r:r + 3, fill:'none', stroke:'var(--lt-muted)', 'stroke-width':1, opacity:.7}, g);
    awake(g, () => selectMoment(m.id));
  }

  const placed = [];
  for(const h of hubs){
    const group = hubGroups.get(h.key);
    if(!group || dimmed(h.key) && filterHub !== h.key) continue;
    const {name, sub, labelG} = group.hubLabelParts;
    const r = placeHubLabel(h, name, sub, labelG, placed);
    if(r) placed.push(r);
  }
}

/* ---------- 범례 ---------- */
function drawLegend(){
  const row = document.getElementById('legendRow');
  row.replaceChildren();
  const groups = new Map();
  for(const h of MODEL.hubs){
    if(!groups.has(h.kind)) groups.set(h.kind, []);
    groups.get(h.kind).push(h);
  }
  const kinds = [...groups.keys()].sort((a,b) => PRIORITY.indexOf(a) - PRIORITY.indexOf(b) || a.localeCompare(b));
  for(const kind of kinds){
    const wrap = document.createElement('div'); wrap.className = 'g-legend-group';
    const title = document.createElement('div'); title.className = 'g-legend-title';
    title.textContent = KIND_LABEL[kind] + ' ' + groups.get(kind).length;
    wrap.appendChild(title);
    for(const h of groups.get(kind)){
      const b = document.createElement('button'); b.type = 'button'; b.className = 'g-legend-item';
      const dot = document.createElement('i'); dot.style.background = KIND_COLOR[h.kind];
      const label = document.createElement('span'); label.textContent = h.value;
      const n = document.createElement('small'); n.textContent = String(h.primaryIds.length > 0 ? h.primaryIds.length : h.allIds.length);
      b.append(dot, label, n);
      b.addEventListener('click', () => { filterHub === h.key ? (filterHub = null, visibleTrail = [], refresh()) : selectHub(h.key); });
      wrap.appendChild(b);
    }
    row.appendChild(wrap);
  }
  if(filterHub !== null){
    const all = document.createElement('button'); all.type = 'button'; all.className = 'g-legend-all'; all.textContent = '전체 보기';
    all.addEventListener('click', () => { filterHub = null; render(); });
    row.appendChild(all);
  }
}

/* ---------- 상세 판 ---------- */
function chipEl(kindLabel, value, color){
  const c = document.createElement('span'); c.className = 'd-chip';
  const k = document.createElement('span'); k.className = 'chip-kind'; k.textContent = kindLabel;
  const v = document.createElement('b'); v.textContent = value;
  if(color) c.style.borderColor = color;
  c.append(k, v);
  return c;
}
function drawDetail(){
  const card = document.getElementById('detailCard');
  card.replaceChildren();
  if(selected.type === 'hub'){
    const h = MODEL.hubs.find(x => x.key === selected.key);
    if(!h) return;
    const kick = document.createElement('div'); kick.className = 'd-kicker'; kick.textContent = KIND_LABEL[h.kind] + ' 묶음';
    const h2 = document.createElement('h2'); h2.textContent = h.value;
    const date = document.createElement('div'); date.className = 'd-date';
    date.textContent = h.primaryIds.length > 0 ? '1차 소속 순간 ' + h.primaryIds.length + '개 · 관련 꼬리표 순간 ' + h.allIds.length + '개' : '묶음 없이 관련된 순간 ' + h.allIds.length + '개';
    const list = document.createElement('ul'); list.className = 'd-list';
    const ids = h.primaryIds.length > 0 ? h.primaryIds : h.allIds;
    for(const id of ids){
      const m = MODEL.moments.find(x => x.id === id);
      const li = document.createElement('li');
      const b = document.createElement('button'); b.type = 'button';
      const d = document.createElement('small'); d.textContent = m.d;
      const t = document.createElement('span'); t.textContent = m.t;
      b.append(d, t);
      b.addEventListener('click', () => selectMoment(m.id));
      li.appendChild(b); list.appendChild(li);
    }
    card.append(kick, h2, date, list);
    return;
  }
  const m = MODEL.moments.find(x => x.id === selected.id);
  if(!m) return;
  const kick = document.createElement('div'); kick.className = 'd-kicker'; kick.textContent = '순간 · 무대 날짜';
  const h2 = document.createElement('h2'); h2.textContent = m.t;
  const date = document.createElement('div'); date.className = 'd-date'; date.textContent = m.d;
  const chips = document.createElement('div'); chips.className = 'd-chips';
  const emo = document.createElement('span'); emo.className = 'd-chip emo'; emo.textContent = '감정 ' + m.e;
  chips.appendChild(emo);
  for(const t of m.tags) chips.appendChild(chipEl(KIND_LABEL[t.kind], t.value, KIND_COLOR[t.kind]));
  if(m.tags.length === 0){
    chips.appendChild(chipEl('꼬리표', '아직 없음', 'var(--lt-line)'));
  }
  const memo = document.createElement('p'); memo.className = 'd-memo';
  memo.textContent = m.why || '메모 없음';
  const nav = document.createElement('div'); nav.className = 'd-nav';
  for(const [label, mm] of [['발자취 이전', m.trailPrev], ['발자취 다음', m.trailNext]]){
    const b = document.createElement('button'); b.type = 'button';
    const small = document.createElement('small'); small.textContent = mm ? label : label + ' · 없음';
    const span = document.createElement('span'); span.textContent = mm ? mm.t : '—';
    b.append(small, span);
    if(mm) b.addEventListener('click', () => selectMoment(mm.id));
    nav.appendChild(b);
  }
  card.append(kick, h2, date, chips, memo, nav);
}

/* ---------- 상단·테마·재생 ---------- */
document.getElementById('mapTab').addEventListener('click', () => {
  document.getElementById('switchNote').hidden = false;
});
const themeBtn = document.getElementById('themeBtn');
function applyTheme(theme){
  document.documentElement.dataset.ltTheme = theme;
  themeBtn.textContent = theme === 'garden' ? '밤 보기' : '정원 보기';
  render();
}
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.ltTheme === 'garden' ? 'night' : 'garden');
});
const urlTheme = new URLSearchParams(location.search).get('theme');
if(urlTheme === 'garden' || urlTheme === 'night') applyTheme(urlTheme);

const playBtn = document.getElementById('playBtn');
playBtn.setAttribute('aria-pressed', 'false');
function stopWalk(){
  if(playTimer){ clearInterval(playTimer); playTimer = null; }
  playBtn.dataset.on = 'false';
  playBtn.setAttribute('aria-pressed', 'false');
  playBtn.textContent = '▶ 발자취 걷기 (시간 순서)';
}
playBtn.addEventListener('click', () => {
  if(playTimer){ stopWalk(); return; }
  let i = 0;
  filterHub = null;
  visibleTrail = trailOrder;
  selectionMade = true;
  playBtn.dataset.on = 'true';
  playBtn.setAttribute('aria-pressed', 'true');
  playBtn.textContent = '■ 걷기 멈추기';
  const step = () => {
    if(i >= trailOrder.length){ stopWalk(); return; }
    visibleTrail = trailOrder.slice(0, i + 1);
    selected = {type:'moment', id:trailOrder[i].id};
    i += 1;
    refresh();
  };
  step();
  playTimer = setInterval(step, 550);
});

/* 꼬리표 없는 순간 선반 안내 */
function drawShelf(){
  const untagged = MODEL.moments.filter(m => !m.primary);
  document.getElementById('shelfLabel').textContent = untagged.length > 0 ? '꼬리표 없는 순간 ' + untagged.length : '';
  document.getElementById('gShelf').style.display = untagged.length > 0 ? 'flex' : 'none';
}

/* 빈 트리(순간 1개일 때 안내 문구 규칙 확인용 — 이 시안은 항상 40순간이다) */
function drawEmptyNote(){
  const n = MODEL.moments.length;
  const empty = document.getElementById('gEmpty');
  if(n === 1){ empty.hidden = false; empty.textContent = '순간이 하나예요. 다음 순간을 남기면 흐름이 보여요.'; }
  else { empty.hidden = true; }
}

let lastW = 0, lastH = 0;
function onResize(){
  const box = svg.parentElement.getBoundingClientRect();
  const w = Math.round(box.width), h = Math.round(box.height);
  if(Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
  lastW = w;
  lastH = h;
  refresh();
  drawShelf();
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(svg.parentElement);
document.fonts.ready.then(refresh);

render(); drawLegend(); drawDetail(); drawShelf(); drawEmptyNote();
lastW = Math.round(svg.parentElement.getBoundingClientRect().width);
lastH = Math.round(svg.parentElement.getBoundingClientRect().height);
</script>
</body>
</html>
