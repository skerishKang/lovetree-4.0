/* ---------- 규칙 (docs/GRAPH_VIEW_20261115.md §2) ----------
   허브(큰 점)는 방향 문서 기준 노래·멤버·무대. 가수도 같은 방식의 허브가 되되 한 단계 작은 점 —
   묶음 장소가 없는 가수-만 순간(프로필·포토)을 두기 위해. 확장은 KIND 절에 한 줄. */
const KIND_LABEL = {song:'노래', member:'멤버', stage:'무대', artist:'가수', era:'활동기', emotion:'감정'};
const KIND_COLOR = {stage:'var(--lt-gold-deep)', song:'var(--lt-rose)', member:'var(--lt-violet)', artist:'var(--lt-blue)', era:'var(--lt-violet)', emotion:'var(--lt-rose-ink)'};
const KIND_OWN = {song:'이 노래의 내 순간들', member:'이 멤버의 내 순간들', stage:'이 무대의 내 순간들', artist:'이 가수의 내 순간들'};
const PRIORITY = ['stage','song','member','artist']; /* 1차 소속: 무대 > 노래 > 멤버 > 가수 */
const HUB_KINDS = ['stage','song','member','artist'];

function parseTag(raw){
  const i = raw.indexOf(':');
  if(i < 0) return null;
  const label = raw.slice(0, i);
  const kind = Object.keys(KIND_LABEL).find(k => KIND_LABEL[k] === label);
  if(!kind) return null;
  return {kind, value: raw.slice(i+1), raw};
}
function parseDate(s){
  const m = /^(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})$/.exec(String(s||''));
  if(!m) return null;
  return Date.UTC(+m[1], +m[2]-1, +m[3]);
}
function hash01(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}
const GOLDEN = 137.508 * Math.PI / 180;
function textWidth(text, fs){
  /* 한글은 글자 크기만큼, 나머지는 0.6배쯤 — 정확한 폭 대신 여유 있게 잡는 추정 */
  let wpx = 0;
  for(const ch of String(text)) wpx += /[\u3130-\uD79D]/.test(ch) ? fs : fs * 0.62;
  return wpx;
}
function byTime(a, b){
  /* 같은 날은 '내 순서'(보드 #619 B와 같은 순서 필드)를 쓴다 — 시안 데이터에는 내 순서가 없어 만든 순서(id)로 대신한다 */
  const ta = a.time == null ? Infinity : a.time, tb = b.time == null ? Infinity : b.time;
  return ta - tb || a.id.localeCompare(b.id);
}

/* 묶음 모델: 꼬리표 → 허브·1차 소속·발자취 */
function buildModel(){
  const moments = MOMENTS.map(m => {
    const tags = (m.tags||[]).map(parseTag).filter(Boolean);
    let primary = null;
    for(const k of PRIORITY){ const hit = tags.find(t => t.kind === k); if(hit){ primary = hit; break; } }
    return {...m, tags, primary, time: parseDate(m.d)};
  });
  const hubMap = new Map();
  for(const m of moments){
    for(const t of m.tags){
      if(!HUB_KINDS.includes(t.kind)) continue;
      const key = t.kind + ':' + t.value;
      if(!hubMap.has(key)) hubMap.set(key, {key, kind:t.kind, value:t.value, primaryIds:[], allIds:[]});
      hubMap.get(key).allIds.push(m.id);
    }
    if(m.primary){
      const key = m.primary.kind + ':' + m.primary.value;
      hubMap.get(key).primaryIds.push(m.id);
    }
  }
  const hubs = [...hubMap.values()].filter(h => h.allIds.length >= 2); /* 1개뿐인 꼬리표는 허브로 만들지 않는다 */
  hubs.sort((a,b) => b.primaryIds.length - a.primaryIds.length || PRIORITY.indexOf(a.kind) - PRIORITY.indexOf(b.kind) || a.value.localeCompare(b.value));
  /* 발자취: 전체 순간을 시간 순서로(같은 날은 내 순서) */
  const trailOrder = [...moments].sort(byTime);
  trailOrder.forEach((m, i) => { m.trailPrev = i > 0 ? trailOrder[i-1] : null; m.trailNext = i < trailOrder.length-1 ? trailOrder[i+1] : null; });
  return {moments, hubs, trailOrder};
}

/* ---------- 배치 (안2 묶음 원형, 결정론) — 허브 주위 고리에 순간을 시간 순서로 붙인다 ---------- */
const svg = document.getElementById('gsvg');
let MODEL = buildModel();
let selected = {type:'moment', id:'m01'};
let filterHub = null;
let playIndex = -1; /* 발자취 걷기 진행 위치(-1 = 꺼짐) */

function layoutModel(W, H){
  const {moments, hubs} = MODEL;
  const narrow = W < 860;
  const s = narrow ? Math.max(0.78, Math.min(1, W / 900)) : Math.max(0.9, Math.min(1, W / 1240));
  const shelfH = narrow ? 40 : 52;
  const dotR = m => (m.imp ? 12 : 10) * (narrow ? 0.92 : 1) * s;
  const hubR = h => {
    const base = Math.min(30 * s, Math.max((10 + 2 * h.primaryIds.length) * s, 12 * s));
    return h.kind === 'artist' ? base * 0.85 : base; /* 가수는 한 단계 작은 점 */
  };
  /* 고리 반지름: 점들이 고리 위에 서로 붙지 않을 만큼 */
  const ringR = h => {
    const n = Math.max(h.primaryIds.length, 1);
    const mr = 10 * (narrow ? 0.92 : 1) * s, gap = 6 * s;
    return Math.max(hubR(h) + mr + 5 * s, (n * (2 * mr + gap)) / (2 * Math.PI) + 3 * s);
  };
  const maxC = Math.max(...hubs.map(ringR), 0);
  const maxR = Math.max(...hubs.map(hubR), 0);
  const top = narrow ? 12 : 20, usableBottom = H - shelfH - 4;
  const cx = W / 2, cy = (top + usableBottom) / 2;
  const horizPad = narrow ? Math.max(46, maxC + 4) : maxC + maxR + 56;
  const vertPad = narrow ? maxC + 30 : maxC + maxR + 30;
  const rx = Math.max(60, W / 2 - horizPad);
  const ry = Math.max(54, (usableBottom - top) / 2 - vertPad);

  hubs.forEach((h, i) => {
    const a = i * GOLDEN + 0.55;
    h.x = cx + Math.cos(a) * rx;
    h.y = cy + Math.sin(a) * ry * 0.84;
    h.color = KIND_COLOR[h.kind];
    h.cr = ringR(h); h.hr = hubR(h);
    const members = h.primaryIds.map(id => moments.find(m => m.id === id)).sort(byTime);
    const base = hash01(h.key) * 2 * Math.PI;
    members.forEach((m, j) => {
      const aa = base + (j / Math.max(members.length, 1)) * 2 * Math.PI;
      m.x = h.x + Math.cos(aa) * h.cr;
      m.y = h.y + Math.sin(aa) * h.cr;
    });
  });
  /* 꼬리표 없는 순간 선반: 시간 순서로 왼쪽부터. 점은 아래 안내 글줄 밴드 위에 놓는다 */
  const shelf = moments.filter(m => !m.primary).sort(byTime);
  const gap = narrow ? 44 : 56, x0 = narrow ? 22 : 96;
  shelf.forEach((m, i) => { m.x = x0 + i * gap; m.y = H - shelfH; });
  MODEL.narrow = narrow; MODEL.W = W; MODEL.H = H; MODEL.s = s; MODEL.cx = cx; MODEL.cy = cy; MODEL.dotR = dotR;
}
function trailD(pts){
  if(pts.length < 2) return '';
  let d = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(i-1, 0)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(i+2, pts.length-1)];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += 'C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }
  return d;
}

/* ---------- 그리기 ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent){
  const n = document.createElementNS(SVGNS, name);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function dimmed(hubKey){
  return filterHub !== null && filterHub !== hubKey;
}
function selectedMoment(){ return selected.type === 'moment' ? MODEL.moments.find(m => m.id === selected.id) : null; }
function selectedHub(){ return selected.type === 'hub' ? MODEL.hubs.find(h => h.key === selected.key) : null; }

function render(){
  const box = svg.parentElement.getBoundingClientRect();
  const W = Math.max(300, Math.round(box.width)), H = Math.max(360, Math.round(box.height));
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.replaceChildren();
  layoutModel(W, H);
  const {moments, hubs, trailOrder, narrow} = MODEL;
  const defs = el('defs', {}, svg);
  const selM = selectedMoment(), selH = selectedHub();

  /* 묶음 고리: 점들이 앉은 원 — '노래 하나 = 순간 한 덩어리'의 테두리 */
  const ringG = el('g', {}, svg);
  for(const h of hubs){
    if(h.primaryIds.length === 0) continue;
    el('circle', {cx:h.x, cy:h.y, r:h.cr, fill:'none', stroke:h.color, 'stroke-width': selH === h ? 2.4 : 1.2,
      opacity: dimmed(h.key) ? .08 : (selH === h ? .55 : .3)}, ringG);
  }
  /* 1차 소속이 없는 허브(예: 가수:RESCENE) — 점선으로 관련 순간과 이어 고아로 두지 않는다 */
  const spokeG = el('g', {}, svg);
  for(const h of hubs){
    if(h.primaryIds.length === 0){
      for(const id of h.allIds){
        const m = moments.find(x => x.id === id);
        el('line', {x1:h.x, y1:h.y, x2:m.x, y2:m.y, stroke:h.color, 'stroke-width':1.2, opacity: dimmed(h.key) ? .08 : .45, 'stroke-dasharray':'3 5'}, spokeG);
      }
    }
  }

  /* 발자취 줄 — 기본 화면에는 없다. 고른 순간(앞뒤 이음)·고른 묶음(그 묶음의 시간 흐름)·걷기(그동안의 길)만 그린다 */
  const trailG = el('g', {}, svg);
  if(selM){
    const seg = [selM.trailPrev, selM, selM.trailNext].filter(Boolean);
    if(seg.length >= 2){
      el('path', {d:trailD(seg), fill:'none', stroke:'var(--lt-gold)', 'stroke-width':2.6, opacity:.9, 'stroke-linecap':'round'}, trailG);
    }
    markDot(trailG, trailOrder[0], '처음');
    markDot(trailG, trailOrder[trailOrder.length-1], '지금');
  }
  if(selH && selH.primaryIds.length > 1){
    const members = selH.primaryIds.map(id => moments.find(m => m.id === id)).sort(byTime);
    el('path', {d:trailD(members), fill:'none', stroke:selH.color, 'stroke-width':2.2, opacity:.6, 'stroke-linecap':'round', 'stroke-dasharray':'1 0'}, trailG);
  }
  if(playIndex >= 0){
    const upto = trailOrder.slice(0, Math.max(playIndex + 1, 2));
    el('path', {d:trailD(trailOrder), fill:'none', stroke:'var(--lt-gold-line)', 'stroke-width':1.4, opacity:.3, 'stroke-linecap':'round'}, trailG);
    el('path', {d:trailD(upto), fill:'none', stroke:'var(--lt-gold)', 'stroke-width':2.6, opacity:.95, 'stroke-linecap':'round'}, trailG);
    markDot(trailG, trailOrder[0], '처음');
    markDot(trailG, trailOrder[Math.min(playIndex, trailOrder.length-1)], '지금');
  }

  /* 묶음 허브: 점 + 고리 바깥 정해진 자리의 이름(이름·종류·개수 한 줄) */
  const labelEls = [];
  for(const h of hubs){
    const dim = dimmed(h.key);
    const g = el('g', {tabindex:'0', role:'button', 'aria-label':KIND_LABEL[h.kind] + ' ' + h.value + ' · 순간 ' + h.primaryIds.length + '개', opacity: dim ? .14 : 1}, svg);
    g.dataset.hub = h.key;
    el('circle', {cx:h.x, cy:h.y, r:h.hr, fill:h.color, opacity:.95}, g);
    const ux = (h.x - MODEL.cx) / Math.max(Math.hypot(h.x - MODEL.cx, h.y - MODEL.cy), 1);
    const uy = (h.y - MODEL.cy) / Math.max(Math.hypot(h.x - MODEL.cx, h.y - MODEL.cy), 1);
    let lx, ly, anchor;
    if(narrow){ /* 좁은 무대: 이름은 고리 아래 가운데(아래로 밀린 이웃 고리와 겹치지 않게 여유를 남긴다) */
      lx = h.x; ly = h.y + h.cr + 15; anchor = 'middle';
    } else {
      lx = h.x + ux * (h.cr + 22); ly = h.y + uy * (h.cr + 24);
      anchor = ux > .45 ? 'start' : ux < -.45 ? 'end' : 'middle';
    }
    const fs = narrow ? 12.5 : 13.5;
    const subText = KIND_LABEL[h.kind] + ' ' + (h.primaryIds.length > 0 ? h.primaryIds.length : '관련 ' + h.allIds.length);
    const tw = textWidth(h.value, fs) + 6 + textWidth(subText, fs - 1.5);
    /* 이름이 화면 밖으로 나가면 안쪽을 향하게 뒤집는다 */
    if(anchor === 'start' && lx + tw > W - 6) anchor = 'end';
    else if(anchor === 'end' && lx - tw < 6) anchor = 'start';
    else if(anchor === 'middle'){
      if(lx + tw / 2 > W - 6) anchor = 'end';
      else if(lx - tw / 2 < 6) anchor = 'start';
    }
    if(anchor === 'start') lx = Math.min(lx, W - tw - 6);
    if(anchor === 'end') lx = Math.max(lx, tw + 6);
    if(anchor === 'middle') lx = Math.min(Math.max(lx, tw / 2 + 4), W - tw / 2 - 4);
    ly = Math.min(Math.max(ly, 16), H - 10);
    const name = el('text', {x:lx, y:ly, class:'g-hubname', 'text-anchor':anchor, style:'font-size:' + fs + 'px'}, g);
    const t1 = el('tspan', {}, name);
    t1.textContent = h.value;
    const t2 = el('tspan', {dx:'6px', style:'font-size:' + (fs - 1.5) + 'px;fill:var(--lt-muted)'}, name);
    t2.textContent = subText;
    labelEls.push({g, name, count: h.primaryIds.length, tw});
    g.addEventListener('click', () => { filterHub = null; playIndex = -1; selected = {type:'hub', key:h.key}; refresh(); });
  }
  /* 이름 겹침: 옮기고 → 그래도 겹치면 작은 묶음 이름을 숨긴다(범례에는 남는다) */
  const boxes = labelEls.map(x => ({x, r: x.name.getBoundingClientRect(), dy: 0}));
  for(let i = 0; i < boxes.length; i++){
    for(let j = i + 1; j < boxes.length; j++){
      const a = boxes[i], b = boxes[j];
      if(a.r.left < b.r.right && b.r.left < a.r.right && a.r.top < b.r.bottom && b.r.top < a.r.bottom){
        if(b.r.top >= a.r.top){ b.dy = a.dy + 17; } else { a.dy = b.dy + 17; }
      }
    }
  }
  for(const b of boxes.filter(x => x.dy)){
    b.x.name.setAttribute('y', (parseFloat(b.x.name.getAttribute('y')) + b.dy).toFixed(1));
  }
  const re = labelEls.map(x => x.name.getBoundingClientRect());
  for(let i = 0; i < re.length; i++){
    for(let j = i + 1; j < re.length; j++){
      if(re[i].width && re[j].width && re[i].left < re[j].right && re[j].left < re[i].right && re[i].top < re[j].bottom && re[j].top < re[i].bottom){
        const small = labelEls[i].count <= labelEls[j].count ? labelEls[i] : labelEls[j];
        small.name.style.display = 'none'; /* 범례에 이름이 남는다 */
      }
    }
  }

  /* 순간 점: 고리 위 큰 점 — 이미지가 있으면 썸네일 동그라미 */
  const dotG = el('g', {}, svg);
  let cid = 0;
  for(const m of moments){
    const hub = m.primary ? hubs.find(h => h.kind + ':' + h.value === m.primary.kind + ':' + m.primary.value) : null;
    const color = hub ? hub.color : 'var(--lt-muted)';
    const dim = m.primary ? dimmed(m.primary.kind + ':' + m.primary.value) : filterHub !== null;
    const isSel = selM === m;
    const r = MODEL.dotR(m) + (isSel ? 2.5 : 0);
    const g = el('g', {tabindex:'0', role:'button', 'aria-label':'순간 ' + m.t + ' · ' + m.d, opacity: dim ? .14 : 1}, dotG);
    g.dataset.moment = m.id;
    if(m.x == null) continue;
    if(THUMBS[m.id]){
      cid += 1;
      const cp = el('clipPath', {id:'clip' + cid}, defs);
      el('circle', {cx:m.x, cy:m.y, r:r}, cp);
      el('image', {href:THUMBS[m.id], x:m.x - r, y:m.y - r, width:r * 2, height:r * 2, 'clip-path':'url(#clip' + cid + ')', preserveAspectRatio:'xMidYMid slice'}, g);
      el('circle', {cx:m.x, cy:m.y, r:r, fill:'none', stroke:color, 'stroke-width': isSel ? 3 : 1.6, opacity: isSel ? 1 : .85}, g);
      if(m.imp) el('circle', {cx:m.x, cy:m.y, r:r + 3.5, fill:'none', stroke:'var(--lt-gold)', 'stroke-width':1.6, opacity:.9}, g);
    } else {
      el('circle', {cx:m.x, cy:m.y, r:r, fill:color, stroke: isSel ? 'var(--lt-gold)' : 'var(--lt-stage)', 'stroke-width': isSel ? 3 : 1.4}, g);
      if(m.imp) el('circle', {cx:m.x, cy:m.y, r:r + 3.5, fill:'none', stroke:'var(--lt-gold)', 'stroke-width':1.6, opacity:.9}, g);
    }
    g.addEventListener('click', () => { playIndex = -1; selected = {type:'moment', id:m.id}; refresh(); });
  }

  function markDot(parent, m, text){
    if(!m || m.x == null) return;
    /* 점 옆 정해진 자리 — 화면 가장자리에선 안쪽으로 뒤집는다(공중에 뜨거나 잘리지 않게) */
    const ux = (m.x - MODEL.cx) / Math.max(Math.hypot(m.x - MODEL.cx, m.y - MODEL.cy), 1);
    const tw = textWidth(text, 12.5);
    let anchor = ux >= 0 ? 'start' : 'end';
    let ax = ux >= 0 ? m.x + 15 : m.x - 15;
    if(anchor === 'start' && ax + tw > W - 4){ anchor = 'end'; ax = m.x - 15; }
    if(anchor === 'end' && ax - tw < 4){ anchor = 'start'; ax = m.x + 15; }
    ax = anchor === 'start' ? Math.min(ax, W - tw - 4) : Math.max(ax, tw + 4);
    let ay = m.y - 12;
    if(ay < 16) ay = m.y + 24;
    el('text', {x:ax, y:ay, class:'g-mark', 'text-anchor':anchor}, parent).textContent = text;
  }
}

/* ---------- 범례 ---------- */
function drawLegend(){
  const row = document.getElementById('legendRow');
  row.replaceChildren();
  const groups = new Map();
  for(const h of MODEL.hubs){
    if(!groups.has(h.kind)) groups.set(h.kind, []);
    groups.get(h.kind).push(h);
  }
  const kinds = [...groups.keys()].sort((a,b) => PRIORITY.indexOf(a) - PRIORITY.indexOf(b) || a.localeCompare(b));
  for(const kind of kinds){
    const wrap = document.createElement('div'); wrap.className = 'g-legend-group';
    const title = document.createElement('div'); title.className = 'g-legend-title';
    title.textContent = KIND_LABEL[kind] + ' ' + groups.get(kind).length;
    wrap.appendChild(title);
    for(const h of groups.get(kind)){
      const b = document.createElement('button'); b.type = 'button'; b.className = 'g-legend-item';
      const dot = document.createElement('i'); dot.style.background = KIND_COLOR[h.kind];
      const label = document.createElement('span'); label.textContent = h.value;
      const n = document.createElement('small'); n.textContent = String(h.primaryIds.length > 0 ? h.primaryIds.length : h.allIds.length);
      b.append(dot, label, n);
      b.addEventListener('click', () => { playIndex = -1; filterHub = filterHub === h.key ? null : h.key; refresh(); });
      wrap.appendChild(b);
    }
    row.appendChild(wrap);
  }
  if(filterHub !== null){
    const all = document.createElement('button'); all.type = 'button'; all.className = 'g-legend-all'; all.textContent = '전체 보기';
    all.addEventListener('click', () => { filterHub = null; refresh(); });
    row.appendChild(all);
  }
}

/* ---------- 상세 판 ---------- */
function chipEl(kindLabel, value, color){
  const c = document.createElement('span'); c.className = 'd-chip';
  const k = document.createElement('span'); k.className = 'chip-kind'; k.textContent = kindLabel;
  const v = document.createElement('b'); v.textContent = value;
  if(color) c.style.borderColor = color;
  c.append(k, v);
  return c;
}
function drawDetail(){
  const card = document.getElementById('detailCard');
  card.replaceChildren();
  if(selected.type === 'hub'){
    const h = selectedHub();
    if(!h) return;
    const kick = document.createElement('div'); kick.className = 'd-kicker'; kick.textContent = KIND_LABEL[h.kind] + ' 묶음';
    const h2 = document.createElement('h2'); h2.textContent = h.value;
    const date = document.createElement('div'); date.className = 'd-date';
    date.textContent = h.primaryIds.length > 0 ? '묶음 순간 ' + h.primaryIds.length + '개 · 관련 꼬리표 순간 ' + h.allIds.length + '개' : '묶음 없이 관련된 순간 ' + h.allIds.length + '개';
    card.append(kick, h2, date);
    if(h.primaryIds.length > 0){
      const listhead = document.createElement('div'); listhead.className = 'd-listhead';
      listhead.textContent = (KIND_OWN[h.kind] || '이 묶음의 내 순간들') + ' — 시간 순서';
      const list = document.createElement('ul'); list.className = 'd-list';
      for(const id of h.primaryIds){
        const m = MODEL.moments.find(x => x.id === id);
        const li = document.createElement('li');
        const b = document.createElement('button'); b.type = 'button';
        const d = document.createElement('small'); d.textContent = m.d;
        const t = document.createElement('span'); t.textContent = m.t;
        b.append(d, t);
        b.addEventListener('click', () => { playIndex = -1; selected = {type:'moment', id:m.id}; refresh(); });
        li.appendChild(b); list.appendChild(li);
      }
      card.append(listhead, list);
    }
    return;
  }
  const m = selectedMoment();
  if(!m) return;
  const kick = document.createElement('div'); kick.className = 'd-kicker'; kick.textContent = '순간 · 무대 날짜';
  const h2 = document.createElement('h2'); h2.textContent = m.t;
  const date = document.createElement('div'); date.className = 'd-date'; date.textContent = m.d;
  const chips = document.createElement('div'); chips.className = 'd-chips';
  const emo = document.createElement('span'); emo.className = 'd-chip emo'; emo.textContent = '감정 ' + m.e;
  chips.appendChild(emo);
  for(const t of m.tags) chips.appendChild(chipEl(KIND_LABEL[t.kind], t.value, KIND_COLOR[t.kind]));
  if(m.tags.length === 0){
    chips.appendChild(chipEl('꼬리표', '아직 없음', 'var(--lt-line)'));
  }
  const memo = document.createElement('p'); memo.className = 'd-memo';
  memo.textContent = m.why || '메모 없음';
  const nav = document.createElement('div'); nav.className = 'd-nav';
  for(const [label, mm] of [['발자취 이전', m.trailPrev], ['발자취 다음', m.trailNext]]){
    const b = document.createElement('button'); b.type = 'button';
    const small = document.createElement('small'); small.textContent = mm ? label : label + ' · 없음';
    const span = document.createElement('span'); span.textContent = mm ? mm.t : '—';
    b.append(small, span);
    if(mm) b.addEventListener('click', () => { playIndex = -1; selected = {type:'moment', id:mm.id}; refresh(); });
    nav.appendChild(b);
  }
  card.append(kick, h2, date, chips, memo, nav);
}

/* ---------- 상단·테마·재생 ---------- */
document.getElementById('mapTab').addEventListener('click', () => {
  document.getElementById('switchNote').hidden = false;
});
const themeBtn = document.getElementById('themeBtn');
function applyTheme(theme){
  document.documentElement.dataset.ltTheme = theme;
  themeBtn.textContent = theme === 'garden' ? '밤 보기' : '정원 보기';
  refresh();
}
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.ltTheme === 'garden' ? 'night' : 'garden');
});
const urlTheme = new URLSearchParams(location.search).get('theme');
if(urlTheme === 'garden' || urlTheme === 'night') applyTheme(urlTheme);

const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => {
  if(playIndex >= 0){
    playIndex = -1;
    playBtn.dataset.on = 'false'; playBtn.textContent = '▶ 발자취 걷기 (시간 순서)';
    refresh();
    return;
  }
  playIndex = 0;
  playBtn.dataset.on = 'true'; playBtn.textContent = '■ 걷기 멈추기';
  playTimer = setInterval(() => {
    playIndex += 1;
    if(playIndex >= MODEL.trailOrder.length){
      clearInterval(playTimer); playTimer = null;
      playIndex = -1;
      playBtn.dataset.on = 'false'; playBtn.textContent = '▶ 발자취 걷기 (시간 순서)';
    }
    refresh();
  }, 550);
});
let playTimer = null;

/* 꼬리표 없는 순간 선반 안내 */
function drawShelf(){
  const untagged = MODEL.moments.filter(m => !m.primary);
  document.getElementById('shelfLabel').textContent = untagged.length > 0 ? '꼬리표 없는 순간 ' + untagged.length : '';
  document.getElementById('gShelf').style.display = untagged.length > 0 ? 'flex' : 'none';
}
/* 빈 트리(순간 1개일 때 안내 문구 규칙 확인용 — 이 시안은 항상 40순간이다) */
function drawEmptyNote(){
  const n = MODEL.moments.length;
  const empty = document.getElementById('gEmpty');
  if(n === 1){ empty.hidden = false; empty.textContent = '순간이 하나예요. 다음 순간을 남기면 흐름이 보여요.'; }
  else { empty.hidden = true; }
}

function refresh(){
  render(); drawLegend(); drawDetail(); drawShelf();
}
let lastW = 0;
function onResize(){
  const w = Math.round(svg.parentElement.getBoundingClientRect().width);
  if(Math.abs(w - lastW) < 8) return;
  lastW = w;
  refresh(); drawEmptyNote();
}
window.addEventListener('resize', onResize);

refresh(); drawEmptyNote();
lastW = Math.round(svg.parentElement.getBoundingClientRect().width);

/* 수치 점검(?check=1): 가로 넘침·이름 상자 겹침·점과 이름 겹침·오른쪽 여유를 console로 찍는다 */
if(new URLSearchParams(location.search).get('check') === '1'){
  setTimeout(() => {
    const de = document.documentElement;
    const boxes = [...document.querySelectorAll('.g-hubname,.g-mark,.g-shelf-label,.g-shelf-hint')]
      .map(x => x.getBoundingClientRect()).filter(r => r.width > 0 && r.height > 0);
    let pairs = 0;
    for(let i = 0; i < boxes.length; i++)
      for(let j = i + 1; j < boxes.length; j++){
        const a = boxes[i], b = boxes[j];
        if(a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom) pairs++;
      }
    const dots = [...svg.querySelectorAll('circle')].filter(c => parseFloat(c.getAttribute('r') || '0') >= 8);
    let dotPairs = 0;
    for(const c of dots){
      const r = c.getBoundingClientRect();
      for(const b of boxes)
        if(r.left < b.right && b.left < r.right && r.top < b.bottom && b.top < r.bottom) dotPairs++;
    }
    const sRect = svg.getBoundingClientRect();
    let clip = 0;
    for(const t of svg.querySelectorAll('text')){
      const r = t.getBoundingClientRect();
      if(r.width > 0 && (r.right > sRect.right + 1 || r.left < sRect.left - 1)) clip++;
    }
    let slack = 9999;
    for(const x of document.body.querySelectorAll('*')){
      if(x.children.length > 0) continue;
      const r = x.getBoundingClientRect();
      if(r.width > 0 && r.height > 0) slack = Math.min(slack, de.clientWidth - r.right);
    }
    console.log('GRAPH_CHECK ' + JSON.stringify({
      w: de.clientWidth, overflowX: Math.max(0, de.scrollWidth - de.clientWidth), labelBoxPairs: pairs,
      dotLabelPairs: dotPairs, svgClipCount: clip, minRightSlack: Math.round(slack),
      labelRights: [...document.querySelectorAll('.g-hubname')].map(x => Math.round(x.getBoundingClientRect().right)).sort((a,b) => b-a).slice(0, 3)
    }));
  }, 800);
}
</script>
