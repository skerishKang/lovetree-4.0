<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>러브트리 · 첫 여정</title>
<link rel="stylesheet" href="/v41/identity.css">
<style>
/* 첫 여정 — 4.1 무대(iframe) 안에서 열린다. 색은 identity.css의 --lt-* 토큰만 쓴다. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--lt-stage);color:var(--lt-pearl)}
body{font-family:var(--lt-ui);background:radial-gradient(ellipse at 18% 0,var(--lt-stage-2),var(--lt-stage) 62%);word-break:keep-all}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.journey{max-width:1180px;margin:0 auto;padding:clamp(16px,2.4vw,34px) clamp(14px,2.6vw,36px) 56px}
.journey-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;margin-bottom:clamp(14px,2vw,26px)}
.steps{list-style:none;display:flex;gap:4px;margin:0;padding:0;flex:1;min-width:0}
.steps li{display:flex;align-items:center;gap:7px;min-width:0;padding:7px 11px;border:1px solid var(--lt-line);border-radius:var(--lt-r-pill);color:var(--lt-muted);font-size:12px;letter-spacing:.02em;white-space:nowrap}
.steps li b{font-weight:700;letter-spacing:.12em;font-size:11px;color:var(--lt-muted)}
.steps li.done{color:var(--lt-pearl);border-color:var(--lt-gold-line)}
.steps li.done b{color:var(--lt-gold)}
.steps li[aria-current=step]{color:var(--lt-pearl);border-color:var(--lt-gold-line);background:var(--lt-glass);box-shadow:inset 0 0 0 1px var(--lt-gold-line)}
.steps li[aria-current=step] b{color:var(--lt-gold)}
.steps li.step-link{cursor:pointer}
.close{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--lt-line);border-radius:50%;background:var(--lt-glass);font-size:22px;line-height:1;display:grid;place-items:center}
.close:hover{border-color:var(--lt-gold-line)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,3.2vw,48px);align-items:start}
.copy{min-width:0}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:var(--lt-track);color:var(--lt-rose);text-transform:uppercase}
h1{margin:0;font-size:clamp(28px,4.4vw,54px);font-weight:650;letter-spacing:-.055em;line-height:1.08;word-break:keep-all}
h1 em{font-style:normal;color:var(--lt-rose)}
.lead{margin:16px 0 0;max-width:44ch;color:var(--lt-muted);font-size:15px;line-height:1.85;word-break:keep-all}
.restore{margin:20px 0 0;padding:14px 16px;border:1px solid var(--lt-gold-line);border-radius:var(--lt-r-card);background:var(--lt-glass)}
.restore p{margin:0 0 10px;font-size:13px;line-height:1.7;color:var(--lt-pearl)}
.restore .row{display:flex;flex-wrap:wrap;gap:8px}
.form{margin-top:clamp(18px,2.4vw,28px);display:grid;gap:16px}
.pane{display:grid;gap:16px;min-width:0}
.pane[hidden]{display:none}
.field{display:grid;gap:7px;min-width:0}
.field>span{font-size:13px;color:var(--lt-pearl)}
.field>small{font-size:12px;color:var(--lt-muted);line-height:1.6}
.field input,.field textarea,.field select{width:100%;min-width:0;min-height:46px;padding:11px 13px;border:1px solid var(--lt-line);border-radius:var(--lt-r-card);background:var(--lt-glass-strong);color:var(--lt-pearl);font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.field textarea{resize:vertical;min-height:96px}
.field input::placeholder,.field textarea::placeholder{color:var(--lt-muted)}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--lt-gold);outline-offset:2px;border-color:var(--lt-gold-line)}
.field input[type=date]{color-scheme:dark}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 15px;border:1px solid var(--lt-line);border-radius:var(--lt-r-pill);background:var(--lt-glass);font-size:14px;color:var(--lt-pearl)}
.chip[aria-pressed=true]{border-color:var(--lt-gold-line);color:var(--lt-gold);box-shadow:inset 0 0 0 1px var(--lt-gold-line)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.primary{min-height:48px;padding:12px 22px;border:0;border-radius:var(--lt-r-pill);background:var(--lt-rose);color:var(--lt-stage);font-size:15px;font-weight:650;letter-spacing:-.01em}
.primary:hover{background:var(--lt-rose-ink);color:var(--lt-pearl)}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{min-height:48px;padding:11px 18px;border:1px solid var(--lt-line);border-radius:var(--lt-r-pill);background:var(--lt-glass);color:var(--lt-pearl);font-size:14px}
.ghost:hover{border-color:var(--lt-gold-line)}
.hint{margin:0;font-size:12px;color:var(--lt-muted);line-height:1.7}
.error{margin:14px 0 0;min-height:20px;font-size:13px;line-height:1.7;color:var(--lt-rose)}
.error:empty{display:none}
.grow{min-width:0;padding:clamp(14px,2vw,22px);border:1px solid var(--lt-gold-line);border-radius:var(--lt-r-panel);background:var(--lt-glass);box-shadow:inset 0 0 0 1px var(--lt-gold-line)}
.grow-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grow-top span{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--lt-gold);text-transform:uppercase}
.grow-top small{font-size:11px;color:var(--lt-muted)}
.grow-stage{display:grid;gap:10px;min-height:250px;align-content:center}
.seed{display:grid;place-items:center;gap:8px;min-height:190px;border:1px dashed var(--lt-line);border-radius:var(--lt-r-card);color:var(--lt-muted);text-align:center;padding:20px}
.seed b{font-size:26px;color:var(--lt-gold);font-weight:400}
.seed p{margin:0;font-size:13px;line-height:1.7;max-width:26ch}
.moment-card{position:relative;min-width:0;padding:14px;border:1px solid var(--lt-line);border-radius:var(--lt-r-card);background:var(--lt-glass-strong);overflow:hidden}
.moment-card.first{border-color:var(--lt-gold-line)}
.moment-card.bloom{animation:lt-bloom 1.1s ease-out 1}
.moment-card .no{position:absolute;right:12px;top:10px;font-size:10px;letter-spacing:.14em;color:var(--lt-gold)}
.moment-card .kicker{display:block;margin:0 0 4px;font-size:10px;letter-spacing:.14em;color:var(--lt-rose);text-transform:uppercase}
.moment-card strong{display:block;font-size:16px;line-height:1.5;letter-spacing:-.02em;overflow-wrap:anywhere}
.moment-card p{margin:6px 0 0;font-size:12.5px;line-height:1.7;color:var(--lt-muted);overflow-wrap:anywhere}
.moment-card .meta{margin-top:8px;font-size:11px;color:var(--lt-gold);letter-spacing:.02em}
.media-host{margin:8px 0 10px;min-width:0}
.media-host .lt-media{margin:0}
.seed-mark{display:grid;place-items:center;min-height:74px;border-radius:10px;background:var(--lt-glass);color:var(--lt-gold);font-size:22px}
.branch{display:grid;place-items:center;color:var(--lt-gold);font-size:18px;letter-spacing:.2em}
.slot{display:grid;place-items:center;min-height:74px;border:1px dashed var(--lt-line);border-radius:var(--lt-r-card);color:var(--lt-muted);font-size:12px;text-align:center;padding:12px}
.badge{margin-top:10px;padding:9px 12px;border:1px solid var(--lt-gold-line);border-radius:var(--lt-r-pill);font-size:12px;color:var(--lt-gold);text-align:center;letter-spacing:.02em}
.grow-note{margin:14px 0 0;font-size:12px;line-height:1.7;color:var(--lt-muted)}
@keyframes lt-bloom{0%{opacity:.35}45%{opacity:1;box-shadow:0 0 0 1px var(--lt-gold-line),0 0 32px var(--lt-gold-glow)}100%{opacity:1;box-shadow:none}}
@keyframes lt-fade{from{opacity:0}to{opacity:1}}
.pane,.grow-stage{animation:lt-fade .32s ease}
@media (prefers-reduced-motion:reduce){.pane,.grow-stage,.moment-card.bloom{animation:none}}
@media (max-width:900px){
 .grid{grid-template-columns:minmax(0,1fr)}
 .grow{order:2}
 .lead{max-width:none;font-size:14px}
}
@media (max-width:620px){
 .journey{padding:12px 12px 40px}
 .steps{gap:3px}
 .steps li{padding:6px 8px}
 .steps li span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 .steps li b{font-size:11px}
 .close{width:44px;height:44px}
 .actions{display:grid;grid-template-columns:1fr;gap:8px}
 .primary,.ghost{width:100%}
 .chip{padding:9px 12px}
}
</style>
</head>
<body>
<main class="journey" id="journey">
  <header class="journey-head">
    <ol class="steps" id="steps" aria-label="첫 여정 단계">
      <li data-step="0"><b>00</b><span>트리 이름</span></li>
      <li data-step="1"><b>01</b><span>첫 순간</span></li>
      <li data-step="2"><b>02</b><span>마음 남기기</span></li>
      <li data-step="3"><b>03</b><span>다음 영상 잇기</span></li>
      <li data-step="4"><b>04</b><span>성장</span></li>
    </ol>
    <button class="close" id="close" type="button" aria-label="첫 여정 닫기">×</button>
  </header>
  <div class="grid">
    <section class="copy" aria-live="polite">
      <p class="eyebrow" id="eyebrow">00 · 트리 이름</p>
      <h1 id="headline">어떤 러브트리를<br><em>처음 심어볼까요?</em></h1>
      <p class="lead" id="lead">좋아하는 대상을 적으면 그 이름으로 첫 트리가 시작돼요.</p>
      <div class="restore" id="restore" hidden>
        <p id="restore-question"></p>
        <div class="row">
          <button class="primary" type="button" id="restore-yes">이어서 쓰기</button>
          <button class="ghost" type="button" id="restore-no">새로 시작</button>
        </div>
      </div>
      <form class="form" id="form" novalidate>
        <div class="pane" data-pane="0">
          <label class="field"><span>좋아하는 대상</span><small>트리 이름이 됩니다. 예: 그날의 무대, 우리가 좋아한 노래</small>
            <input id="subject" name="subject" maxlength="60" autocomplete="off" placeholder="좋아하는 대상을 적어 주세요" required>
          </label>
        </div>
        <div class="pane" data-pane="1" hidden>
          <label class="field"><span>첫 순간의 링크 또는 사진</span><small>https://로 시작하는 주소. YouTube·사진·영상 링크를 그대로 붙여 넣어요.</small>
            <input id="url" name="url" type="url" inputmode="url" maxlength="2048" autocomplete="off" placeholder="https://">
          </label>
          <div class="media-host" id="url-preview"></div>
          <label class="field"><span>마음 한마디 · 선택</span><small>비워 두면 링크에서 제목을 만들어요.</small>
            <textarea id="note" name="note" maxlength="500" rows="3" placeholder="지금 기억하고 싶은 마음부터 짧게 적어 보세요."></textarea>
          </label>
        </div>
        <div class="pane" data-pane="2" hidden>
          <div class="field"><span>그때 가장 가까웠던 감정</span><small>하나를 골라 주세요.</small>
            <div class="chips" id="emotions" role="group" aria-label="감정 선택"></div>
          </div>
          <label class="field"><span>기억할 시점</span><small>이 마음을 발견한 날. 나중에 바꿀 수 있어요.</small>
            <input id="date" name="date" type="date">
          </label>
          <label class="field"><span>이 장면이 특별했던 이유 · 선택</span><small>정답은 없어요. 마음 한마디보다 이 이유를 먼저 남겨요.</small>
            <textarea id="reason" name="reason" maxlength="500" rows="3" placeholder="예: 우연히 보게 됐는데, 하루 종일 이 표정과 말투가 생각났어."></textarea>
          </label>
        </div>
        <div class="pane" data-pane="3" hidden>
          <label class="field"><span>다음으로 찾아본 링크</span><small>첫 순간에서 이어지는 다음 영상·사진 주소.</small>
            <input id="next-url" name="nextUrl" type="url" inputmode="url" maxlength="2048" autocomplete="off" placeholder="https://">
          </label>
          <div class="media-host" id="next-preview"></div>
          <label class="field"><span>왜 이 순간으로 이어졌나요?</span><small>연결 이유로 저장돼요. 예: 댓글을 따라 찾아봤어요</small>
            <input id="next-reason" name="nextReason" maxlength="100" autocomplete="off" placeholder="이어진 이유를 한 문장으로">
          </label>
        </div>
        <div class="pane" data-pane="4" hidden>
          <p class="hint" id="finish-note">첫 순간과 다음 순간이 한 트리로 이어졌어요. 이제 기억책에서 다시 볼 수 있어요.</p>
        </div>
        <div class="actions">
          <button class="primary" type="submit" id="primary">첫 순간 심기 →</button>
          <button class="ghost" type="button" id="skip" hidden>나중에 잇기</button>
          <button class="ghost" type="button" id="back" hidden>← 이전</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>
    <aside class="grow" aria-label="자라는 러브트리">
      <div class="grow-top"><span id="grow-kicker">첫 여정</span><small id="grow-count">0 / 2 순간</small></div>
      <div class="grow-stage" id="grow-stage" aria-live="polite"></div>
      <p class="grow-note" id="grow-note">좋아하는 대상 하나로 시작해요. 다음 순간은 나중에 이어 붙일 수 있어요.</p>
    </aside>
  </div>
</main>
<script src="/v41/media-preview.js"></script>
<script type="module">
import {
  JOURNEY_EMOTIONS, JOURNEY_LAST_STEP, emptyJourneyDraft, journeyPreviewTitle, journeyRestoreQuestion,
  journeyStepProblem, nextJourneyStep, previousJourneyStep,
  readJourneyDraft, writeJourneyDraft, clearJourneyDraft, normalizeJourneyDraft,
  journeyRouteHash, parseJourneyRoute,
} from '/v41/first-journey.mjs';

const embedded = window.parent && window.parent !== window;
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const storage = (() => { try { return window.localStorage; } catch { return null; } })();

const COPY = {
  0: {eyebrow: '00 · 트리 이름', headline: '어떤 러브트리를<br><em>처음 심어볼까요?</em>', lead: '좋아하는 대상을 적으면 그 이름으로 첫 트리가 시작돼요. 좋아하는 대상 하나면 충분해요.'},
  1: {eyebrow: '01 · 처음 발견', headline: '마음이 처음 멈춘<br><em>그 순간을 심어볼까요?</em>', lead: '발견한 콘텐츠의 링크를 먼저 남겨 주세요. 링크와 함께 그때의 마음을 기록하면 러브트리의 첫 뿌리가 됩니다.'},
  2: {eyebrow: '02 · 마음을 잎으로 남기는 시간', headline: '첫 가지가<br><em>살며시 돋았어요.</em><br>그때의 마음도 적어볼까요?', lead: '콘텐츠가 러브트리의 첫 뿌리라면, 그 장면에서 느낀 마음은 첫 잎이 됩니다. 기억하고 싶은 시점과 한 문장을 함께 남겨 주세요.'},
  3: {eyebrow: '03 · 첫 가지를 이어가는 시간', headline: '첫 마음이<br><em>다음 장면을 찾아갔어요.</em>', lead: '첫 순간을 본 뒤 무엇을 더 찾아봤는지 남겨 주세요. 댓글을 따라갔든, 추천을 받았든 그 경로가 러브트리의 첫 가지가 됩니다.'},
  4: {eyebrow: '04 · 러브트리 성장', headline: '첫 가지가<br><em>다정하게 이어졌어요.</em>', lead: '처음 만든 순간과 다음 순간 사이에 이유와 마음이 생겼습니다. 이제 러브트리가 단순한 목록이 아니라 좋아하게 된 경로를 보여줘요.'},
};
const BLOOM = {eyebrow: '02 · 첫 마음 카드', headline: '첫 마음 카드가<br><em>조용히 피어났어요.</em>', lead: '처음 발견한 장면과 그때의 마음이 한 장의 카드로 연결됐습니다. 이제 여기에서 다음 가지가 자라기 시작해요.'};
const CONNECTED = {eyebrow: '03 · 첫 가지', headline: '첫 가지가<br><em>다정하게 이어졌어요.</em>', lead: '두 순간이 이유와 함께 이어졌어요. 이제 러브트리가 좋아하게 된 경로를 보여줍니다.'};
const ROOTED = {eyebrow: '04 · 러브트리 성장', headline: '첫 순간이<br><em>단단하게 뿌리내렸어요.</em>', lead: '첫 순간이 트리에 남았어요. 다음 장면은 나중에 순간 추가로 이어 붙일 수 있어요.'};

const state = {
  draft: emptyJourneyDraft(),
  step: 0,
  phase: 'form',
  pending: false,
  saved: {treeId: '', momentId: ''},
};
let ready = false;

const SAMPLE = {
  subject: '그날의 무대',
  url: 'https://www.youtube.com/watch?v=nqofkzQD19E',
  note: '우연히 보게 됐는데 하루 종일 이 장면이 생각났어.',
  emotion: '설렘',
  date: '2026-11-07',
  reason: '다시 봐도 그 표정이 오래 남아서',
  nextUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
  nextReason: '댓글을 따라 찾아봤어요',
};
// 단독 미리보기에서 단계별로 실제 화면과 같은 양의 입력을 채운다.
function sampleForStep(step, phase) {
  if (step <= 0) return emptyJourneyDraft({clock: new Date('2026-11-07T00:00:00Z')});
  const draft = emptyJourneyDraft({subject: SAMPLE.subject, clock: new Date('2026-11-07T00:00:00Z')});
  draft.url = SAMPLE.url;
  if (step === 1) return draft;
  draft.note = SAMPLE.note;
  draft.reason = SAMPLE.reason;
  draft.emotion = SAMPLE.emotion;
  draft.date = SAMPLE.date;
  if (step === 2) return draft;
  draft.nextUrl = phase === 'skipped' ? '' : SAMPLE.nextUrl;
  draft.nextReason = SAMPLE.nextReason;
  draft.skipped = phase === 'skipped';
  return draft;
}

function snapshotDraft() {
  return normalizeJourneyDraft({...state.draft, step: state.step, savedTreeId: state.saved.treeId, savedMomentId: state.saved.momentId});
}

function persistDraft() {
  return writeJourneyDraft(storage, snapshotDraft());
}

function post(message) {
  if (embedded) window.parent.postMessage(message, location.origin);
}

// 단계 기록: 셸 안에서는 셸이 #journey/NN을 남기고 화면은 단계만 알려 준다.
// 단독 미리보기에서는 이 화면이 같은 해시 규칙을 직접 기록해 뒤로가기를 검수할 수 있게 한다.
function reportStep() {
  if (!embedded) return;
  post({type: 'lt41-journey-step', step: state.step});
}
function syncHistory(mode = 'push') {
  if (embedded) return;
  const hash = journeyRouteHash(state.step);
  if (location.hash === hash) return;
  const depth = (Number(history.state?.lt41Journey) || 0) + (mode === 'push' ? 1 : 0);
  history[mode === 'replace' ? 'replaceState' : 'pushState']({lt41Journey: depth}, '', hash);
}

function setError(message = '') {
  $('error').textContent = message;
}

function scrollTop() {
  window.scrollTo({top: 0, behavior: 'auto'});
}

/* ---------- render ---------- */

function renderSteps() {
  for (const item of $('steps').children) {
    const step = Number(item.dataset.step);
    item.classList.toggle('done', step < state.step);
    item.classList.toggle('step-link', step < state.step);
    if (step === state.step) item.setAttribute('aria-current', 'step');
    else item.removeAttribute('aria-current');
  }
  document.body.dataset.step = String(state.step);
  document.body.dataset.phase = state.phase;
}

function renderCopy() {
  const copy = state.phase === 'bloom' ? BLOOM : state.phase === 'connected' ? CONNECTED : state.step === 4 && state.draft.skipped ? ROOTED : COPY[state.step];
  $('eyebrow').textContent = copy.eyebrow;
  $('headline').innerHTML = copy.headline;
  $('lead').textContent = copy.lead;
  for (const pane of document.querySelectorAll('[data-pane]')) pane.hidden = Number(pane.dataset.pane) !== state.step || state.phase !== 'form';
  if (state.step === 4) $('finish-note').textContent = state.saved.momentId && state.draft.skipped
    ? '첫 순간이 트리에 뿌리내렸어요. 다음 순간은 나중에 순간 추가로 이어 붙일 수 있어요.'
    : '첫 순간과 다음 순간이 한 트리로 이어졌어요. 이제 기억책에서 다시 볼 수 있어요.';
}

function primaryLabel() {
  if (state.phase === 'bloom') return '다음 가지 이어가기 →';
  if (state.phase === 'connected') return '러브트리 성장 보기 →';
  return ['첫 순간 심기 →', '마음 남기기 →', '첫 마음 카드 피우기 →', '두 순간 가지로 잇기 →', '내 러브트리 보기 →'][state.step];
}

function renderActions() {
  const primary = $('primary');
  primary.textContent = state.pending ? '저장하고 있어요…' : primaryLabel();
  primary.disabled = state.pending;
  $('skip').hidden = !(state.step === 3 && state.phase === 'form');
  const canGoBack = state.step > 0 && state.phase === 'form' && !state.saved.treeId;
  $('back').hidden = !canGoBack;
  $('form').elements.subject.disabled = !!state.saved.treeId;
}

function card({no, kicker, title, note, meta = '', url = '', bloom = false}) {
  const article = document.createElement('article');
  article.className = 'moment-card' + (no === '01' ? ' first' : '') + (bloom ? ' bloom' : '');
  const index = document.createElement('span');
  index.className = 'no';
  index.textContent = no;
  const head = document.createElement('span');
  head.className = 'kicker';
  head.textContent = kicker;
  const name = document.createElement('strong');
  name.textContent = title;
  article.append(index, head);
  if (url) {
    const host = document.createElement('div');
    host.className = 'media-host';
    host.innerHTML = window.LTMedia?.markup(url, title) || '';
    if (!host.innerHTML.trim()) {
      const mark = document.createElement('span');
      mark.className = 'seed-mark';
      mark.textContent = '✦';
      host.append(mark);
    }
    article.append(host);
  }
  article.append(name);
  if (note) {
    const body = document.createElement('p');
    body.textContent = note;
    article.append(body);
  }
  if (meta) {
    const small = document.createElement('p');
    small.className = 'meta';
    small.textContent = meta;
    article.append(small);
  }
  return article;
}

function slot(text) {
  const div = document.createElement('div');
  div.className = 'slot';
  div.textContent = text;
  return div;
}

function renderGrow() {
  const stage = $('grow-stage');
  stage.replaceChildren();
  const draft = state.draft;
  const subject = draft.subject.trim();
  const firstTitle = journeyPreviewTitle(draft);
  const firstNote = draft.reason.trim() || draft.note.trim();
  const hasFirst = draft.url.trim() !== '';
  const hasNext = draft.nextUrl.trim() !== '';
  const bloom = state.phase === 'bloom';
  const connected = state.phase === 'connected' || state.step === 4;
  $('grow-kicker').textContent = state.step === 0 ? '아직 심지 않은 씨앗' : subject || '나의 첫 러브트리';
  $('grow-count').textContent = `${connected && hasNext ? 2 : hasFirst ? 1 : 0} / 2 순간`;

  if (!hasFirst) {
    const seed = document.createElement('div');
    seed.className = 'seed';
    const mark = document.createElement('b');
    mark.textContent = '✦';
    const line = document.createElement('p');
    line.textContent = subject ? `“${subject}”의 첫 순간을 기다리고 있어요.` : '좋아하는 대상을 적으면 여기에 첫 카드가 자라요.';
    seed.append(mark, line);
    stage.append(seed);
    $('grow-note').textContent = '좋아하는 대상 하나로 시작해요. 다음 순간은 나중에 이어 붙일 수 있어요.';
    return;
  }

  const meta = [draft.emotion, draft.date].filter(Boolean).join(' · ');
  stage.append(card({no: '01', kicker: '첫 순간', title: firstTitle, note: firstNote, meta: connected ? meta : '', url: draft.url, bloom}));
  if (bloom) {
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = '첫 마음 카드가 피어났어요 ✦';
    stage.append(badge);
  }
  if (hasNext || state.step >= 3) {
    const branch = document.createElement('span');
    branch.className = 'branch';
    branch.textContent = '↓';
    branch.setAttribute('aria-hidden', 'true');
    stage.append(branch);
  }
  if (hasNext) {
    stage.append(card({
      no: '02', kicker: '다음 순간', title: journeyPreviewTitle({...draft, url: draft.nextUrl, note: '', reason: ''}),
      note: draft.nextReason, meta: connected ? '이어진 이유 · ' + (draft.nextReason || '아직 남기지 않음') : '', url: draft.nextUrl,
    }));
    if (connected && !draft.skipped) {
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = '두 순간이 다정하게 이어졌어요 ✦';
      stage.append(badge);
    }
  } else if (state.step >= 3) {
    stage.append(slot(draft.skipped ? '나중에 이을 자리 · 순간 추가로 이어 붙일 수 있어요' : '다음 링크를 넣으면 이 자리에 다음 순간이 자라요'));
  }
  $('grow-note').textContent = state.step === 4
    ? '한 장면에서 다음 장면으로, 좋아하게 된 경로가 보여요.'
    : '카드 한 장이 다음 카드로 이어지면, 그 경로가 러브트리가 돼요.';
}

function render() {
  renderSteps();
  renderCopy();
  renderActions();
  renderGrow();
  if (!ready) return;
  if (embedded) reportStep();
  else syncHistory();
}

// 뒤로가기·앞으로가기로 들어온 단계는 입력값을 그대로 두고 그 단계만 다시 보여 준다.
function goToStep(value) {
  readForm();
  state.phase = 'form';
  state.step = Math.min(JOURNEY_LAST_STEP, Math.max(0, Number.parseInt(value, 10) || 0));
  setError('');
  persistDraft();
  render();
  scrollTop();
  focusStep();
}

/* ---------- form binding ---------- */

function buildEmotions() {
  const host = $('emotions');
  for (const emotion of JOURNEY_EMOTIONS) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'chip';
    button.dataset.emotion = emotion;
    button.textContent = emotion;
    button.setAttribute('aria-pressed', String(state.draft.emotion === emotion));
    button.onclick = () => {
      state.draft.emotion = emotion;
      for (const chip of host.children) chip.setAttribute('aria-pressed', String(chip === button));
      setError('');
      persistDraft();
      renderGrow();
    };
    host.append(button);
  }
}

function fillForm() {
  const form = $('form');
  form.elements.subject.value = state.draft.subject;
  form.elements.url.value = state.draft.url;
  form.elements.note.value = state.draft.note;
  form.elements.date.value = state.draft.date;
  form.elements.reason.value = state.draft.reason;
  form.elements.nextUrl.value = state.draft.nextUrl;
  form.elements.nextReason.value = state.draft.nextReason;
  for (const chip of $('emotions').children) chip.setAttribute('aria-pressed', String(chip.dataset.emotion === state.draft.emotion));
  renderMedia();
}

function readForm() {
  const form = $('form');
  state.draft.subject = form.elements.subject.value;
  state.draft.url = form.elements.url.value;
  state.draft.note = form.elements.note.value;
  state.draft.date = form.elements.date.value;
  state.draft.reason = form.elements.reason.value;
  state.draft.nextUrl = form.elements.nextUrl.value;
  state.draft.nextReason = form.elements.nextReason.value;
}

function renderMedia() {
  const preview = $('url-preview');
  const url = state.draft.url.trim();
  preview.replaceChildren();
  if (url && window.LTMedia) preview.innerHTML = window.LTMedia.markup(url, journeyPreviewTitle(state.draft));
  const next = $('next-preview');
  const nextUrl = state.draft.nextUrl.trim();
  next.replaceChildren();
  if (nextUrl && window.LTMedia) next.innerHTML = window.LTMedia.markup(nextUrl, journeyPreviewTitle({...state.draft, url: nextUrl}));
}

for (const field of ['subject', 'url', 'note', 'date', 'reason', 'nextUrl', 'nextReason']) {
  const element = document.querySelector(`[name="${field}"]`);
  element.addEventListener('input', () => {
    readForm();
    setError('');
    persistDraft();
    if (field === 'url' || field === 'note' || field === 'nextUrl') renderMedia();
    renderGrow();
  });
}

/* ---------- save ---------- */

function applyResult(result) {
  state.pending = false;
  if (!result?.ok) {
    setError(result?.message || '저장하지 못했어요. 다시 시도해 주세요.');
    renderActions();
    return false;
  }
  state.saved = {treeId: result.treeId || state.saved.treeId, momentId: result.firstMomentId || state.saved.momentId};
  persistDraft();
  return true;
}

function requestSave() {
  if (state.pending) return;
  state.pending = true;
  setError('');
  renderActions();
  const draft = snapshotDraft();
  if (!embedded) {
    setTimeout(() => {
      const treeId = state.saved.treeId || 'preview-tree';
      const momentId = state.saved.momentId || 'preview-moment';
      if (state.step === 2) {
        state.saved = {treeId, momentId};
        persistDraft();
        state.phase = 'bloom';
      } else {
        state.saved = {treeId, momentId};
        state.draft.skipped = draft.skipped;
        persistDraft();
        state.phase = 'connected';
      }
      state.pending = false;
      render();
      scrollTop();
    }, 0);
    return;
  }
  post({type: 'lt41-journey-save', draft});
}

window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== window.parent) return;
  if (event.data?.type === 'lt41-journey-goto') { goToStep(event.data.step); return; }
  if (event.data?.type !== 'lt41-journey-result') return;
  if (!applyResult(event.data)) return;
  state.phase = state.step === 2 ? 'bloom' : 'connected';
  render();
  scrollTop();
});

/* ---------- step flow ---------- */

$('form').addEventListener('submit', event => {
  event.preventDefault();
  if (state.pending) return;
  readForm();
  if (state.phase === 'bloom') { state.phase = 'form'; state.step = 3; persistDraft(); render(); scrollTop(); return; }
  if (state.phase === 'connected') { state.phase = 'form'; state.step = 4; persistDraft(); render(); scrollTop(); return; }
  if (state.step === 2 || state.step === 3) {
    const problem = journeyStepProblem(state.step, state.draft);
    if (problem) { setError(problem); return; }
    requestSave();
    return;
  }
  if (state.step === 4) {
    if (embedded) post({type: 'lt41-journey-open-book', treeId: state.saved.treeId, firstMomentId: state.saved.momentId});
    clearJourneyDraft(storage);
    return;
  }
  const problem = journeyStepProblem(state.step, state.draft);
  if (problem) { setError(problem); return; }
  state.step = nextJourneyStep(state.step);
  persistDraft();
  render();
  scrollTop();
  focusStep();
});

$('back').onclick = () => {
  if (state.saved.treeId) return;
  readForm();
  state.step = previousJourneyStep(state.step);
  setError('');
  persistDraft();
  render();
  scrollTop();
  focusStep();
};

$('skip').onclick = () => {
  state.draft.skipped = true;
  setError('');
  state.step = 4;
  persistDraft();
  render();
  scrollTop();
};

// 단계 탭도 같은 기록 규칙을 따른다. 이미 지나온 단계로만 돌아가고, 그 기록을 새로 남긴다.
$('steps').addEventListener('click', event => {
  const item = event.target.closest('li[data-step]');
  if (!item || state.pending || state.phase !== 'form') return;
  const step = Number(item.dataset.step);
  if (step >= state.step) return;
  goToStep(step);
});

$('close').onclick = () => {
  readForm();
  persistDraft();
  if (embedded) { post({type: 'lt41-journey-close'}); return; }
  // 단독 미리보기에서는 닫기가 곷 첫 화면으로 돌아간다(단계 기록은 뒤로가기용으로 남긴다).
  location.assign('/v41/');
};

function focusStep() {
  const target = {0: $('subject'), 1: $('url'), 2: $('reason'), 3: $('next-url'), 4: $('primary')}[state.step];
  queueMicrotask(() => target?.focus());
}

/* ---------- start ---------- */

function startFresh(subject = '') {
  state.draft = emptyJourneyDraft({subject});
  state.saved = {treeId: '', momentId: ''};
  state.phase = 'form';
  state.step = 0;
  $('restore').hidden = true;
  fillForm();
  render();
}

function restoreDraft(draft) {
  state.draft = normalizeJourneyDraft(draft);
  state.saved = {treeId: state.draft.savedTreeId, momentId: state.draft.savedMomentId};
  state.phase = 'form';
  state.step = state.saved.treeId ? Math.max(3, state.draft.step) : state.draft.step;
  $('restore').hidden = true;
  fillForm();
  render();
}

window.addEventListener('popstate', () => {
  if (embedded) return;
  const route = parseJourneyRoute(location.hash);
  if (route) goToStep(route.step);
});

function boot() {
  buildEmotions();
  fillForm();
  render();
  const seeded = params.get('subject') || '';
  if (embedded) {
    const stored = readJourneyDraft(storage);
    // 새로고침·직접 주소: #journey/NN의 단계로 열고, 임시 보관값이 없으면 00으로 간다.
    const routeStep = Number.parseInt(params.get('step') || '', 10);
    if (Number.isFinite(routeStep)) {
      if (stored) restoreDraft(stored);
      else startFresh(seeded);
      state.step = stored
        ? Math.min(JOURNEY_LAST_STEP, Math.max(state.saved.treeId ? 3 : 0, Math.min(JOURNEY_LAST_STEP, Math.max(0, routeStep))))
        : 0;
      persistDraft();
      render();
      focusStep();
      return;
    }
    if (stored && journeyRestoreQuestion(stored)) {
      $('restore-question').textContent = journeyRestoreQuestion(stored);
      $('restore').hidden = false;
      $('restore-yes').onclick = () => restoreDraft(stored);
      $('restore-no').onclick = () => { clearJourneyDraft(storage); startFresh(seeded); };
      if (seeded) { state.draft.subject = seeded; fillForm(); render(); }
      return;
    }
    startFresh(seeded);
    return;
  }
  // 저장소 밖 단독 미리보기: #journey/NN 또는 ?step=NN으로 단계 화면을 연다.
  const hashRoute = parseJourneyRoute(location.hash);
  const step = hashRoute ? hashRoute.step : Number.parseInt(params.get('step') || '', 10);
  if (hashRoute && !readJourneyDraft(storage)) {
    // 임시 보관값이 없으면 #journey/NN이어도 00부터 시작한다.
    startFresh(seeded);
    render();
    return;
  }
  if (Number.isFinite(step)) {
    const phase = params.get('phase') || 'form';
    const stored = readJourneyDraft(storage);
    const draft = normalizeJourneyDraft(stored || sampleForStep(step, phase));
    if (!stored) {
      draft.savedTreeId = step >= 2 ? 'preview-tree' : '';
      draft.savedMomentId = step >= 2 ? 'preview-moment' : '';
    }
    state.draft = draft;
    state.saved = {treeId: draft.savedTreeId, momentId: draft.savedMomentId};
    state.step = Math.min(4, Math.max(0, step));
    state.phase = stored ? 'form' : ['bloom', 'connected'].includes(phase) ? phase : 'form';
    fillForm();
    render();
    return;
  }
  startFresh(seeded);
}

boot();
if (!embedded) {
  if (parseJourneyRoute(location.hash)) syncHistory('replace');
  else history.replaceState({lt41Journey: 0}, '', '#journey/00');
}
ready = true;
reportStep();

// 닫기·새로고침 때도 입력을 잃지 않는다.
window.addEventListener('pagehide', () => { try { readForm(); persistDraft(); } catch {} });
</script>
</body>
</html>
