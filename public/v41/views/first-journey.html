<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>러브트리 · 첫 여정</title>
<link rel="stylesheet" href="/v41/identity.css">
<script>
/* 정원 테마 2단계: 셸이 연 iframe은 셸이 정한 테마 속성을 그대로 받아 첫 그리기 전에 맞춘다.
   셸 밖 단독 미리보기에서만 저장된 테마를 직접 읽는다(그 외에는 화면이 테마를 정하지 않는다). */
try{
  var ltHostTheme=window.parent!==window?window.parent.document.documentElement.getAttribute('data-lt-theme'):null;
  if(!ltHostTheme&&window.parent===window)ltHostTheme=localStorage.getItem('lt41.theme')==='garden'?'garden':null;
  if(ltHostTheme)document.documentElement.setAttribute('data-lt-theme',ltHostTheme);
}catch(e){}
</script>
<style>
/* 첫 여정 — 4.1 무대(iframe) 안에서 열린다. 색은 identity.css의 --lt-* 토큰만 쓴다. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--lt-stage);color:var(--lt-pearl)}
body{font-family:var(--lt-ui);background:radial-gradient(ellipse at 18% 0,var(--lt-stage-2),var(--lt-stage) 62%);word-break:keep-all}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.journey{max-width:1180px;margin:0 auto;padding:clamp(16px,2.4vw,34px) clamp(14px,2.6vw,36px) 56px}
.journey-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;margin-bottom:clamp(14px,2vw,26px)}
.steps{list-style:none;display:flex;gap:4px;margin:0;padding:0;flex:1;min-width:0}
.steps li{display:flex;align-items:center;gap:7px;min-width:0;padding:7px 11px;border:1px solid var(--lt-line);border-radius:var(--lt-r-pill);color:var(--lt-muted);font-size:12px;letter-spacing:.02em;white-space:nowrap}
.steps li b{font-weight:700;letter-spacing:.12em;font-size:11px;color:var(--lt-muted)}
.steps li.done{color:var(--lt-pearl);border-color:var(--lt-gold-line)}
.steps li.done b{color:var(--lt-gold)}
.steps li[aria-current=step]{color:var(--lt-pearl);border-color:var(--lt-gold-line);background:var(--lt-glass);box-shadow:inset 0 0 0 1px var(--lt-gold-line)}
.steps li[aria-current=step] b{color:var(--lt-gold)}
.steps li.step-link{cursor:pointer}
.close{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--lt-line);border-radius:50%;background:var(--lt-glass);font-size:22px;line-height:1;display:grid;place-items:center}
.close:hover{border-color:var(--lt-gold-line)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,3.2vw,48px);align-items:start}
.copy{min-width:0}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:var(--lt-track);color:var(--lt-muted);text-transform:uppercase}
h1{margin:0;font-size:clamp(28px,4.4vw,54px);font-weight:650;letter-spacing:-.055em;line-height:1.08;word-break:keep-all}
h1 em{font-style:normal;color:var(--lt-muted)}
.lead{margin:16px 0 0;max-width:44ch;color:var(--lt-muted);font-size:15px;line-height:1.85;word-break:keep-all}
.restore{margin:20px 0 0;padding:14px 16px;border:1px solid var(--lt-gold-line);border-radius:var(--lt-r-card);background:var(--lt-glass)}
.restore p{margin:0 0 10px;font-size:13px;line-height:1.7;color:var(--lt-pearl)}
.restore .row{display:flex;flex-wrap:wrap;gap:8px}
.form{margin-top:clamp(18px,2.4vw,28px);display:grid;gap:16px}
.pane{display:grid;gap:16px;min-width:0}
.pane[hidden]{display:none}
.field{display:grid;gap:7px;min-width:0}
.field>span{font-size:13px;color:var(--lt-pearl)}
.field>small{font-size:12px;color:var(--lt-muted);line-height:1.6}
.field input,.field textarea,.field select{width:100%;min-width:0;min-height:46px;padding:11px 13px;border:1px solid var(--lt-line);border-radius:var(--lt-r-card);background:var(--lt-glass-strong);color:var(--lt-pearl);font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.field textarea{resize:vertical;min-height:96px}
.field input::placeholder,.field textarea::placeholder{color:var(--lt-muted)}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--lt-gold);outline-offset:2px;border-color:var(--lt-gold-line)}
.field input[type=date]{color-scheme:dark}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 15px;border:1px solid var(--lt-line);border-radius:var(--lt-r-pill);background:var(--lt-glass);font-size:14px;color:var(--lt-pearl)}
.chip[aria-pressed=true]{border-color:var(--lt-gold-line);color:var(--lt-gold);box-shadow:inset 0 0 0 1px var(--lt-gold-line)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.primary{min-height:48px;padding:12px 22px;border:0;border-radius:var(--lt-r-pill);background:var(--lt-primary);color:var(--lt-primary-ink);font-size:15px;font-weight:650;letter-spacing:-.01em}
.primary:hover{background:var(--lt-pearl);color:var(--lt-primary-ink)}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{min-height:48px;padding:11px 18px;border:1px solid var(--lt-line);border-radius:var(--lt-r-pill);background:var(--lt-glass);color:var(--lt-pearl);font-size:14px}
.ghost:hover{border-color:var(--lt-gold-line)}
.hint{margin:0;font-size:12px;color:var(--lt-muted);line-height:1.7}
.error{margin:14px 0 0;min-height:20px;font-size:13px;line-height:1.7;color:var(--lt-pearl)}
.error:empty{display:none}
.grow{min-width:0;padding:clamp(14px,2vw,22px);border:1px solid var(--lt-gold-line);border-radius:var(--lt-r-panel);background:var(--lt-glass);box-shadow:inset 0 0 0 1px var(--lt-gold-line)}
.grow-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grow-top span{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--lt-gold);text-transform:uppercase}
.grow-top small{font-size:11px;color:var(--lt-muted)}
.grow-stage{display:grid;gap:10px;min-height:250px;align-content:center}
.seed{display:grid;place-items:center;gap:8px;min-height:190px;border:1px dashed var(--lt-line);border-radius:var(--lt-r-card);color:var(--lt-muted);text-align:center;padding:20px}
.seed b{font-size:26px;color:var(--lt-gold);font-weight:400}
.seed p{margin:0;font-size:13px;line-height:1.7;max-width:26ch}
.moment-card{position:relative;min-width:0;padding:14px;border:1px solid var(--lt-line);border-radius:var(--lt-r-card);background:var(--lt-glass-strong);overflow:hidden}
.moment-card.first{border-color:var(--lt-gold-line)}
.moment-card.bloom{animation:lt-bloom 1.1s ease-out 1}
.moment-card .no{position:absolute;right:12px;top:10px;font-size:10px;letter-spacing:.14em;color:var(--lt-gold)}
.moment-card .kicker{display:block;margin:0 0 4px;font-size:10px;letter-spacing:.14em;color:var(--lt-muted);text-transform:uppercase}
.moment-card strong{display:block;font-size:16px;line-height:1.5;letter-spacing:-.02em;overflow-wrap:anywhere}
.moment-card p{margin:6px 0 0;font-size:12.5px;line-height:1.7;color:var(--lt-muted);overflow-wrap:anywhere}
.moment-card .meta{margin-top:8px;font-size:11px;color:var(--lt-gold);letter-spacing:.02em}
.media-host{margin:8px 0 10px;min-width:0}
.media-host .lt-media{margin:0}
.seed-mark{display:grid;place-items:center;min-height:74px;border-radius:10px;background:var(--lt-glass);color:var(--lt-gold);font-size:22px}
.branch{display:grid;place-items:center;color:var(--lt-gold);font-size:18px;letter-spacing:.2em}
.slot{display:grid;place-items:center;min-height:74px;border:1px dashed var(--lt-line);border-radius:var(--lt-r-card);color:var(--lt-muted);font-size:12px;text-align:center;padding:12px}
.badge{margin-top:10px;padding:9px 12px;border:1px solid var(--lt-gold-line);border-radius:var(--lt-r-pill);font-size:12px;color:var(--lt-gold);text-align:center;letter-spacing:.02em}
.grow-note{margin:14px 0 0;font-size:12px;line-height:1.7;color:var(--lt-muted)}
@keyframes lt-bloom{0%{opacity:.35}45%{opacity:1;box-shadow:0 0 0 1px var(--lt-gold-line),0 0 32px var(--lt-gold-glow)}100%{opacity:1;box-shadow:none}}
@keyframes lt-fade{from{opacity:0}to{opacity:1}}
.pane,.grow-stage{animation:lt-fade .32s ease}
@media (prefers-reduced-motion:reduce){.pane,.grow-stage,.moment-card.bloom{animation:none}}
@media (max-width:900px){
 .grid{grid-template-columns:minmax(0,1fr)}
 .grow{order:2}
 .lead{max-width:none;font-size:14px}
}
@media (max-width:620px){
 .journey{padding:12px 12px 40px}
 .steps{gap:3px}
 .steps li{padding:6px 8px}
 .steps li span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 .steps li b{font-size:11px}
 .close{width:44px;height:44px}
 .actions{display:grid;grid-template-columns:1fr;gap:8px}
 .primary,.ghost{width:100%}
 .chip{padding:9px 12px}
}
/* 밤(A) 첫 여정: 첫 화면 중앙 버튼과 같은 진주색 주 버튼·어두운 보조 알약. 모양·색 모두 --lt-* 토큰만 쓴다.
   정원은 아래 정원 블록이 같은 속성을 덮으므로 이 블록의 영향을 받지 않는다. */
html:not([data-lt-theme=garden]) .primary{min-height:44px;padding:10px 12px;border:1px solid var(--lt-primary);border-radius:var(--lt-r-pill);background:var(--lt-primary);color:var(--lt-primary-ink);font-size:14px;font-weight:400;letter-spacing:.02em}
html:not([data-lt-theme=garden]) .primary:hover{background:var(--lt-pearl);border-color:var(--lt-pearl);color:var(--lt-primary-ink)}
html:not([data-lt-theme=garden]) .ghost{min-height:44px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--lt-pearl) 16%,transparent);border-radius:var(--lt-r-pill);background:color-mix(in srgb,var(--lt-stage-2) 30%,transparent);color:var(--lt-pearl);font-size:14px;letter-spacing:.02em}
html:not([data-lt-theme=garden]) .ghost:hover{border-color:color-mix(in srgb,var(--lt-pearl) 44%,transparent);background:color-mix(in srgb,var(--lt-pearl) 9%,transparent)}

/* 정원 테마(2단계): 셸이 data-lt-theme=garden 을 넘길 때만 켜진다. 색은 identity.css 정원 토큰만 쓴다. */
html[data-lt-theme=garden]{color-scheme:light}
html[data-lt-theme=garden] body{background:radial-gradient(ellipse at 18% 0,var(--lt-stage-2),var(--lt-stage) 62%)}
html[data-lt-theme=garden] h1{font-family:'Gowun Batang',var(--lt-reading);font-weight:700;letter-spacing:-.02em}
html[data-lt-theme=garden] h1 em,html[data-lt-theme=garden] .eyebrow,html[data-lt-theme=garden] .moment-card .kicker{color:var(--lt-rose-ink)}
html[data-lt-theme=garden] .error{color:var(--lt-rose-ink)}
html[data-lt-theme=garden] .grow,html[data-lt-theme=garden] .restore,html[data-lt-theme=garden] .moment-card{border-color:var(--lt-gold-deep);box-shadow:var(--lt-garden-shadow)}
html[data-lt-theme=garden] .seed,html[data-lt-theme=garden] .slot{border-color:var(--lt-line-paper)}
html[data-lt-theme=garden] .primary{background:var(--lt-primary);color:var(--lt-primary-ink)}
html[data-lt-theme=garden] .primary:hover{background:var(--lt-gold-deep);color:var(--lt-primary-ink)}
html[data-lt-theme=garden] .field input[type=date]{color-scheme:light}
</style>
</head>
<body>
<main class="journey" id="journey">
  <header class="journey-head">
    <ol class="steps" id="steps" aria-label="첫 여정 단계">
      <li data-step="0"><b>00</b><span>트리 이름</span></li>
      <li data-step="1"><b>01</b><span>첫 순간</span></li>
      <li data-step="2"><b>02</b><span>마음 남기기</span></li>
      <li data-step="3"><b>03</b><span>다음 영상 잇기</span></li>
      <li data-step="4"><b>04</b><span>성장</span></li>
    </ol>
    <button class="close" id="close" type="button" aria-label="첫 여정 닫기">×</button>
  </header>
  <div class="grid">
    <section class="copy" aria-live="polite">
      <p class="eyebrow" id="eyebrow">00 · 트리 이름</p>
      <h1 id="headline">어떤 러브트리를<br><em>처음 심어볼까요?</em></h1>
      <p class="lead" id="lead">좋아하는 대상을 적으면 그 이름으로 첫 트리가 시작돼요.</p>
      <div class="restore" id="restore" hidden>
        <p id="restore-question"></p>
        <div class="row">
          <button class="primary" type="button" id="restore-yes">이어서 쓰기</button>
          <button class="ghost" type="button" id="restore-no">새로 시작</button>
        </div>
      </div>
      <form class="form" id="form" novalidate>
        <div class="pane" data-pane="0">
          <label class="field"><span>좋아하는 대상</span><small>트리 이름이 됩니다. 예: 그날의 무대, 우리가 좋아한 노래</small>
            <input id="subject" name="subject" maxlength="60" autocomplete="off" placeholder="좋아하는 대상을 적어 주세요" required>
          </label>
        </div>
        <div class="pane" data-pane="1" hidden>
          <label class="field"><span>첫 순간의 링크 또는 사진</span><small>https://로 시작하는 주소. YouTube·사진·영상 링크를 그대로 붙여 넣어요.</small>
            <input id="url" name="url" type="url" inputmode="url" maxlength="2048" autocomplete="off" placeholder="https://">
          </label>
          <div class="media-host" id="url-preview"></div>
          <label class="field"><span>마음 한마디 · 선택</span><small>비워 두면 링크에서 제목을 만들어요.</small>
            <textarea id="note" name="note" maxlength="500" rows="3" placeholder="지금 기억하고 싶은 마음부터 짧게 적어 보세요."></textarea>
          </label>
        </div>
        <div class="pane" data-pane="2" hidden>
          <div class="field"><span>그때 가장 가까웠던 감정</span><small>하나를 골라 주세요.</small>
            <div class="chips" id="emotions" role="group" aria-label="감정 선택"></div>
          </div>
          <label class="field"><span>기억할 시점</span><small>이 마음을 발견한 날. 나중에 바꿀 수 있어요.</small>
            <input id="date" name="date" type="date">
          </label>
          <label class="field"><span>이 장면이 특별했던 이유 · 선택</span><small>정답은 없어요. 마음 한마디보다 이 이유를 먼저 남겨요.</small>
            <textarea id="reason" name="reason" maxlength="500" rows="3" placeholder="예: 우연히 보게 됐는데, 하루 종일 이 표정과 말투가 생각났어."></textarea>
          </label>
        </div>
        <div class="pane" data-pane="3" hidden>
          <label class="field"><span>다음으로 찾아본 링크</span><small>첫 순간에서 이어지는 다음 영상·사진 주소.</small>
            <input id="next-url" name="nextUrl" type="url" inputmode="url" maxlength="2048" autocomplete="off" placeholder="https://">
          </label>
          <div class="media-host" id="next-preview"></div>
          <label class="field"><span>왜 이 순간으로 이어졌나요?</span><small>연결 이유로 저장돼요. 예: 댓글을 따라 찾아봤어요</small>
            <input id="next-reason" name="nextReason" maxlength="100" autocomplete="off" placeholder="이어진 이유를 한 문장으로">
          </label>
        </div>
        <div class="pane" data-pane="4" hidden>
          <p class="hint" id="finish-note">첫 순간과 다음 순간이 한 트리로 이어졌어요. 이제 책에서 다시 볼 수 있어요.</p>
        </div>
        <div class="actions">
          <button class="primary" type="submit" id="primary">첫 순간 심기 →</button>
          <button class="ghost" type="button" id="skip" hidden>나중에 잇기</button>
          <button class="ghost" type="button" id="back" hidden>← 이전</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>
    <aside class="grow" aria-label="자라는 러브트리">
      <div class="grow-top"><span id="grow-kicker">첫 여정</span><small id="grow-count">0 / 2 순간</small></div>
      <div class="grow-stage" id="grow-stage" aria-live="polite"></div>
      <p class="grow-note" id="grow-note">좋아하는 대상 하나로 시작해요. 다음 순간은 나중에 이어 붙일 수 있어요.</p>
    </aside>
  </div>
</main>
<script src="/v41/media-preview.js"></script>
<script type="module">
import {createJourneyPage} from '/v41/views/journey/journey-page.mjs';
createJourneyPage();
</script>
</body>
</html>
