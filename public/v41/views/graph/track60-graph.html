<!doctype html>
<html lang="ko" data-v41-screen="graph">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>러브트리 4.1 · 그래프 보기</title><!-- modulepreload:start (tools/v41-modulepreload.mjs가 만든다) --><link rel="modulepreload" href="/v41/graph-model.mjs"><link rel="modulepreload" href="/v41/header-state.mjs"><link rel="modulepreload" href="/v41/same-stage.mjs"><link rel="modulepreload" href="/v41/tags.mjs"><link rel="modulepreload" href="/v41/views/graph/graph.js"><link rel="modulepreload" href="/v41/youtube-id.mjs"><!-- modulepreload:end -->
<link rel="stylesheet" href="/v41/views/graph/graph.css">
<link rel="stylesheet" href="/v41/identity.css">
</head>
<body>
<div class="g-frame">
 <div class="g-head">
  <div class="g-brand"><b>러브트리</b><small>그래프</small></div>
  <span class="g-badge" id="gBadge"></span>
  <span class="g-head-spacer"></span>
  <!-- 2026-11-16 대표 결정: 그래프 보기는 지도 안의 보기 하나 — 지도와 같은 모양의 보기 고르기를 머리줄에 둔다.
       그물형·동심원형을 고르면 지도 보기 저장 키(lt41.network.view — network.js의 VIEW_KEY)에 넣고
       기존 lt41-navigate 한 길로 지도로 돌아간다. 그래프가 눌린 상태가 이 화면의 현재 보기다. -->
  <span class="view-switch g-view-switch" role="group" aria-label="보기 방식 고르기"><button type="button" class="pill switch" id="gViewNet" aria-pressed="false">그물형</button><button type="button" class="pill switch" id="gViewConc" aria-pressed="false">동심원형</button><button type="button" class="pill switch" id="gViewGraph" aria-pressed="true">그래프</button></span>
 </div>
 <div class="g-body">
  <div class="g-stagewrap">
   <svg id="gsvg" role="group" aria-label="꼬리표로 묶은 그래프 보기"></svg>
   <div class="g-shelf" id="gShelf"><span class="g-shelf-label" id="shelfLabel"></span><button type="button" class="g-shelf-hint" id="shelfHint">꼬리표 한 번에 제안받기</button></div>
   <div class="g-empty" id="gEmpty" hidden></div>
  </div>
  <aside class="g-rail">
   <div class="g-card"><h3>묶음 (꼬리표 허브)</h3><div class="g-legend-row" id="legendRow"></div></div>
   <div class="g-card g-detail" id="detailCard"></div>
   <button type="button" class="g-walk" id="walkBtn">▶ 발자취 걷기 (시간 순서)</button>
  </aside>
 </div>
</div>
<script type="module" src="/v41/views/graph/graph.js"></script>
</body>
</html>
