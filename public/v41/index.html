<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>러브트리 4.1 · 읽기 연결 개발본</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:#17131c;color:#eee}header{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}h1{font-size:18px;margin:0}button,select,input{font:inherit;min-height:44px}button,select{border:1px solid #655468;border-radius:8px;padding:8px 14px;background:#2a2230;color:white;cursor:pointer}button[aria-current=true]{background:#f3e7e9;color:#302634}nav button{flex:0 0 auto;white-space:nowrap}nav{display:flex;gap:8px;overflow:auto;padding:10px 16px}p{margin:8px 16px}#status{color:#e8c6da}iframe{display:block;width:100%;height:calc(100dvh - 245px);min-height:500px;border:0}aside{padding:12px 16px;background:#302634}aside button{margin:4px}#empty{padding:60px 20px;text-align:center}a{color:#e8c6da}</style>
<header><h1>LOVETREE 4.1</h1><a href="/auth/login?next=/v41/">로그인</a><button id="server">내 서버 기록 읽기</button><button id="logout">로그아웃</button><span>읽기 연결 개발본 · 서버 쓰기 미지원</span><label>JSON 읽기 <input id="file" type="file" accept=".json,application/json"></label><select id="trees" aria-label="트리 선택" disabled></select><button id="sample">격리 샘플</button><button id="clear">비우기</button></header>
<p>선택한 파일은 메모리에서만 읽습니다. 회원 기록을 서버에 전송하거나 저장하지 않습니다.</p><nav aria-label="화면 선택"><button data-view="src064-orbit.html">첫 화면</button><button data-view="track32-bookshelf.html">책장</button><button data-view="track59-sketchbook.html">기억책</button><button data-view="track58-pinboard.html">보드</button><button data-view="track56-network.html">관계망</button></nav>
<p id="status" role="status">트리를 불러오세요.</p><aside id="connections" aria-label="선택한 순간의 모든 연결"></aside><div id="empty">4.0 형식의 기록 JSON 또는 격리 샘플을 열어 보세요.</div><iframe id="view" title="4.1 화면" hidden></iframe>
<script type="module">
import {workspaceModel} from './workspace-model.mjs';
import {createWorkspaceApi} from './api.mjs';
import {createServerReader} from './server-reader.mjs';
const $=id=>document.getElementById(id);let model=null,current='src064-orbit.html';window.LT41=null;
function edges(){const c=window.LT41;$('connections').replaceChildren();if(!c)return;$('status').textContent=`${c.tree.title} · ${c.tree.moments.find(m=>m.id===c.momentId)?.title||''} · 읽기 전용`;for(const e of c.tree.edges.filter(e=>e.from===c.momentId||e.to===c.momentId)){const id=e.from===c.momentId?e.to:e.from,m=c.tree.moments.find(m=>m.id===id),b=document.createElement('button');b.textContent=`${e.kind==='related'?'관련':e.from===c.momentId?'자식':'부모'} · ${m.title}`;b.onclick=()=>{c.momentId=id;show(current)};$('connections').append(b)}}
function show(file){if(!window.LT41)return;current=file;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===file)));$('view').hidden=false;$('empty').hidden=true;$('view').src='views/'+file;edges()}
function choose(id){const tree=model.trees.find(t=>t.id===id);window.LT41=tree?{tree,momentId:tree.moments.find(m=>m.parentId===null).id}:null;if(tree)show(current);else{$('view').hidden=true;$('view').src='about:blank';$('empty').hidden=false;edges();$('status').textContent='기록 없음'}}
function load(input){const next=workspaceModel(input);model=next;$('trees').replaceChildren();for(const t of model.trees){const o=document.createElement('option');o.value=t.id;o.textContent=t.title;$('trees').append(o)}$('trees').disabled=!model.trees.length;choose(model.trees[0]?.id)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('trees').onchange=()=>choose($('trees').value);$('clear').onclick=()=>{reader.cancel();load({revision:0,state:{version:1,trees:[]}});$('file').value='';$('connections').replaceChildren()};
const reader=createServerReader({api:createWorkspaceApi(),onClear:()=>load({revision:0,state:{version:1,trees:[]}}),onDocument:load,onStatus:text=>$('status').textContent=text});$('server').onclick=()=>reader.read();$('logout').onclick=()=>reader.logout();
$('file').onchange=async()=>{reader.cancel();try{const f=$('file').files[0];if(!f)return;if(f.size>4194304)throw Error('4MiB 이하 파일만 읽습니다.');const d=JSON.parse(await f.text());load(d.state?d:{revision:0,state:d})}catch(e){$('status').textContent='불러오기 실패: '+e.message}};
$('sample').onclick=()=>{reader.cancel();const time='2026-10-31T00:00:00Z';load({revision:0,state:{version:1,trees:[{id:'sample',subject:'격리 샘플',title:'처음의 마음',createdAt:time,updatedAt:time,moments:['root','a','b','c'].map((id,i)=>({id,parentId:i?'root':null,links:id==='a'?['b']:id==='b'?['a']:[],title:i?'기억 '+i:'첫 순간',note:'운영 기록과 무관한 읽기 검증용 샘플입니다.',date:'2026-10-31',emotion:'설렘',relation:i?'처음의 마음에서 이어짐':'',url:'',createdAt:time}))}]}})};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('view').contentWindow)return;if(e.data?.type==='lt41-navigate'&&[...document.querySelectorAll('[data-view]')].some(b=>b.dataset.view===e.data.view))show(e.data.view);if(e.data?.type==='lt-selection'||e.data?.type==='lt41-choose')edges()});
$('view').onload=()=>{const d=$('view').contentDocument;if(!d)return;d.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;let file;if(b.matches('[data-action="tree"],[data-menu="tree"]'))file='track32-bookshelf.html';if(b.matches('#storyBook,[data-menu="book"]'))file='track59-sketchbook.html';if(current==='track56-network.html'&&b.id==='openMoment')file='track59-sketchbook.html';if(file){e.preventDefault();e.stopImmediatePropagation();show(file)}},true)};
</script></html>
