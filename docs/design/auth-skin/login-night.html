<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveTree에 로그인 · 밤</title><link rel="stylesheet" href="auth-skin.css"></head>
<body class="night">
<div class="stage">
<img class="orbit o1" src="assets/card-1.webp" alt="" width="240" height="316">
<img class="orbit o2" src="assets/card-2.webp" alt="" width="240" height="316">
<img class="orbit o3" src="assets/card-3.webp" alt="" width="240" height="316">
<a class="brand" href="#"><span>LoveTree</span><small>4.1</small></a>
<main class="auth-card" aria-labelledby="login-title">
<p class="eyebrow">PADIEM 계정</p>
<h1 id="login-title">LoveTree에 로그인</h1>
<p class="lead">PADIEM 계정으로 Chat 등 다른 서비스도 함께 쓸 수 있어요.</p>
<a class="btn secondary" href="#google"><span class="g">G</span>Google로 계속</a>
<div class="divider"><span>또는 이메일로</span></div>
<form onsubmit="return false">
<label class="field">이메일<input type="email" name="email" autocomplete="username" required></label>
<label class="field">비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
<p class="error" role="alert">이메일 또는 비밀번호를 확인해 주세요.</p>
<button class="btn primary submit" type="submit">이메일로 로그인</button>
</form>
<a class="alt-link" href="signup-night.html">이메일로 회원가입</a>
</main>
<p class="foot">LoveTree 4.1 · PADIEM</p>
</div>
</body></html>
