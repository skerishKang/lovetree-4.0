<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveTree 회원가입 · 정원</title><link rel="stylesheet" href="auth-skin.css"></head>
<body class="garden">
<div class="stage">
<img class="orbit o1" src="assets/card-1.webp" alt="" width="240" height="316">
<img class="orbit o2" src="assets/card-2.webp" alt="" width="240" height="316">
<img class="orbit o3" src="assets/card-3.webp" alt="" width="240" height="316">
<a class="brand" href="#"><span>LoveTree</span><small>4.1</small></a>
<main class="auth-card" aria-labelledby="signup-title">
<p class="eyebrow">PADIEM 계정</p>
<h1 id="signup-title">이메일로 회원가입</h1>
<p class="lead">PADIEM 계정 하나로 LoveTree와 Chat을 함께 써요.</p>
<form onsubmit="return false">
<label class="field">이름 <small>선택</small><input type="text" name="name" autocomplete="name"></label>
<label class="field">이메일<input type="email" name="email" autocomplete="username" required></label>
<label class="field">비밀번호<input type="password" name="password" autocomplete="new-password" required></label>
<p class="error" role="alert">이미 가입된 이메일이에요.</p>
<button class="btn primary submit" type="submit">회원가입</button>
</form>
<a class="alt-link" href="login-garden.html">이메일로 로그인</a>
</main>
<p class="foot">LoveTree 4.1 · PADIEM</p>
</div>
</body></html>
