name: 매일 밤 화면 속도·흔들림 측정

# 2026-11-24: PR 화면 시험에서 뺀 속도·흔들림 측정을 main에서 매일 밤 잰다. 기준값은 PR 때와 같다.
# 비교 기준은 약 하루 전 main 커밋이다(그 사이 들어온 변경 전체를 한 번에 잰다).
# 빨강이면 같은 제목의 열린 이슈에 댓글을 달고, 없으면 새 이슈를 연다.
on:
  schedule:
    - cron: '13 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-screen-perf
  cancel-in-progress: false

jobs:
  base:
    name: 비교 기준 커밋 찾기
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        run: |
          sha=$(git rev-list -1 --before='25 hours ago' HEAD)
          [ -n "$sha" ] || sha=$(git rev-parse HEAD~1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "비교 기준 $sha" >> "$GITHUB_STEP_SUMMARY"

  screen-header-first-paint:
    name: 화면 시험 — 첫 머리줄 인증·CLS (#1026)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 첫 머리줄 실제 렌더링 40조건 검사
        env:
          LT_HEADER_FLASH_FULL: '1'
        run: |
          npm ci --no-audit --no-fund
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          npm run build
          node --test tests/v41-header-first-paint-1026.test.mjs

  screen-orbit:
    needs: base
    name: 화면 시험 — 첫 화면 궤도(#1086)
    # 2026-11-23: 기준 빌드 두 벌이 드는 #1086 비교를 첫 화면 잡에서 떼어 따로 돌린다(첫 화면 잡 12분 안에 끝나게).
    # 2026-11-22: 호스트 실행기 대기(동시 3개 안팎)를 피해 같은 저장소 PR은 CGI 자체 실행기에서 돈다(보드 잡과 같은 식).
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      # 같은 CGI 컴퓨터의 자체 실행기 여러 개가 홈의 npm 캐시를 함께 쓰면 동시에 받다가 깨진다
      # (2026-11-24: EINTEGRITY·ENOENT로 시험 전에 실패). 자체 실행기에서는 실행기마다 캐시 폴더를 따로 둔다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            # 자체 실행기: 이 버전 Chromium이 있으면 받지 않고 끝난다(시스템 라이브러리는 미리 깔림, sudo 없음).
            npx playwright install chromium
          elif ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - name: 첫 화면 빌드
        run: npx vite build > /dev/null
      # 실제 하드웨어 성능 판정과 별개로 같은 헤드리스 환경의 기준 브랜치와 회귀를 비교한다.
      # 쌓임·깊이 대조 기준(기존 DOM 마지막 커밋, #1221 직전)은 고정 커밋이라 빌드 결과를 캐시해 잡 시간을 늘리지 않는다.
      - name: 첫 화면 궤도 기존 DOM 기준 빌드 캐시(#1086)
        id: orbit-dom-cache
        uses: actions/cache@v4
        with:
          path: .orbit-dom-dist
          key: orbit-dom-dist-d9c3bfc5837366e525ed7d13b780769ce9392034
      - name: 첫 화면 궤도 헤드리스 회귀 방지(#1086, 건너뜀=실패)
        env:
          LT_ORBIT1086_REQUIRE: '1'
          BASE_SHA: ${{ needs.base.outputs.sha }}
          DOM_SHA: d9c3bfc5837366e525ed7d13b780769ce9392034
          DOM_CACHED: ${{ steps.orbit-dom-cache.outputs.cache-hit }}
        run: |
          # 쌓임·깊이 대조는 기존 DOM 궤도가 기준이어야 한다. #1221 병합 뒤에는 기준 브랜치도 그림판이라
          # 같은 그림판끼리 비교가 되므로, 기존 DOM 마지막 커밋(#1221 직전)을 고정 기준으로 쓴다.
          # 성능 회귀 비교는 지금처럼 기준 브랜치와 한다. 캐시가 없으면 두 기준을 동시에 빌드한다.
          build_at() { dir=$(mktemp -d "$RUNNER_TEMP/orbit-$2.XXXXXX"); git archive "$1" | tar -x -C "$dir"; npm ci --prefix "$dir" > /dev/null && npm run build --prefix "$dir" > /dev/null && echo "$dir" > "$RUNNER_TEMP/orbit-$2.path"; }
          build_at "$BASE_SHA" main & main_pid=$!
          if [ "$DOM_CACHED" != "true" ] || [ ! -f .orbit-dom-dist/v41/home.html ]; then
            build_at "$DOM_SHA" dom
            rm -rf .orbit-dom-dist && cp -r "$(cat "$RUNNER_TEMP/orbit-dom.path")/dist" .orbit-dom-dist
          fi
          wait "$main_pid"
          baseline=$(cat "$RUNNER_TEMP/orbit-main.path")
          LT_ORBIT1086_MAIN_DIST="$PWD/.orbit-dom-dist" node --test --test-concurrency=1 tests/v41-orbit-webgl-1086.test.mjs
          LT_ORBIT1086_MAIN_DIST="$baseline/dist" node --test --test-concurrency=1 tests/v41-orbit-1086-perf.test.mjs

  screen-perf-misc:
    name: 첫 화면 끌기 성능·보드 CLS (#586·#1026)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비·빌드
        run: |
          npm ci --no-audit --no-fund
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then echo "캐시된 Chromium 사용"; else npx playwright install --with-deps chromium; fi
          npx vite build > /dev/null
      # #586: 첫 화면 끌기 성능 — 매 프레임 z-index 쓰기를 밴드로 줄이고, 끄는 동안 hover 모양 고정,
      # 패럴랙스 rect 캐시, 첫 화면 문서의 스타일시트 수 축소를 실제 화면에서 잠근다. 건너뜀=실패.
      - name: 첫 화면 끌기 성능 계약 시험(#586, 건너뜀=실패)
        env:
          LT_ORBIT586_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-orbit-586-perf.test.mjs
          echo "첫 화면 끌기 성능 계약 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: 보드 그림 지연 도착 CLS 시험(#1026, 건너뜀=실패)
        env:
          LT_BOARD_582_REQUIRE: '1'
        run: node --test --test-concurrency=1 --test-name-pattern='그림 지연 도착에도' tests/v41-board-pinboard-582.test.mjs

  report:
    name: 빨강이면 이슈로 남기기
    runs-on: ubuntu-latest
    needs: [screen-header-first-paint, screen-orbit, screen-perf-misc]
    if: failure()
    steps:
      - name: 이슈 열기 또는 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          title='매일 밤 화면 속도·흔들림 측정 빨강'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[]|select(.value.result!="success")|"- \(.key): \(.value.result)"')
          body=$(printf '%s 측정이 기준을 넘었다.\n\n%s\n\n실행 기록: %s\n' "$(date -u +%F)" "$failed" "$RUN_URL")
          num=$(gh issue list --state open --search "in:title $title" --json number,title --jq ".[]|select(.title==\"$title\")|.number" | head -1)
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
