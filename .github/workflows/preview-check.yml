      # 실제 화면에서 잰다. 서재 여백 수치는 고정하지 않는다(#972 여백 수정과 겹치지 않게).
      # 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 서재·날짜 표시 동작 시험(건너뜀=실패 — #970)
