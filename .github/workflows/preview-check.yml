      # #996: 로고 첫 화면 복귀(#782)·빠른 재전환 빈 무대(#996) 시험을 CI에서 실제로 돌린다.
      # 첫 화면은 vite 번들이라 먼저 build 한다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
