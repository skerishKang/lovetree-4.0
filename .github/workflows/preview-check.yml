name: 미리보기 검사

# 원칙 8(머지 전 PR 미리보기 postdeploy) 자동 실행. 로그아웃 검사만 하므로 비밀값이 필요 없다.
on:
  pull_request:
    # ready_for_review: 초안에서 준비 완료로 바꾸면 화면 시험이 돈다.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: preview-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 이슈 947 뒤 사줄: 서버·문서만 바뀐 PR에서도 화면 잡이 6~8분씩 돈다. 맨 앞 작은 잡이 바뀐 파일로
  # '화면 바뀜'을 가리고(화면 범위 밖이 명확한 파일만 있을 때만 거짓 — 애매하면 바뀜), 화면 잡들은 needs로
  # 받아 안 바뀌었으면 시험 단계를 건너뛰고 '건너뜀(화면 변경 없음)' 요약을 남기고 성공으로 끝낸다.
  # 필수 검사 이름 '미리보기 postdeploy(로그아웃)'은 그대로다 — 잡을 통째로 건너뛰지 않으므로 검사 이름이 유지된다.
  screen-changes:
    name: 화면 바뀜 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      # 지도는 추후 개발(11-22 대표 결정). 지도 대비·부채꼴 시험은 지도 파일이 바뀐 PR에서만 돈다.
      map_changed: ${{ steps.diff.outputs.map_changed }}
      # 2026-11-24: 한 화면 안에서만 바뀐 PR은 그 화면 잡만 고른다(all이면 전부). tools/ci/screen-changes.mjs 참고.
      jobs: ${{ steps.diff.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 바뀐 파일로 화면 바뀜을 가린다
        id: diff
        run: |
          # 2026-11-23: 초안 PR(추후 개발)은 화면 시험을 건너뛴다 — 미리보기 배포는 그대로 돌아 주소로 확인할 수 있다.
          # 병합하기로 정해 '준비 완료'로 바꾸면 ready_for_review로 다시 돌며 그때 화면 시험을 모두 한다.
          if [ '${{ github.event.pull_request.draft }}' = 'true' ]; then
            echo "초안 PR — 화면 시험 건너뜀(준비 완료로 바꾸면 돈다)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "map_changed=false" >> "$GITHUB_OUTPUT"; echo "jobs=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --name-only "$base...$head" > /tmp/changed-files.txt 2>/dev/null || { echo "diff 실패 — 바뀜으로 둔다"; echo "changed=true" >> "$GITHUB_OUTPUT"; echo "map_changed=true" >> "$GITHUB_OUTPUT"; echo "jobs=all" >> "$GITHUB_OUTPUT"; exit 0; }
          # 판정은 tools/ci/screen-changes.mjs가 한다. 화면 시험 목록은 이 워크플로의 화면 잡 구간에서
          # 자동으로 뽑는다(손으로 따로 적지 않는다) — 시험 파일은 화면 잡이 실제로 실행하는 파일과
          # 그 helpers가 바뀌었을 때만 화면 바뀜이다(이슈 947 — #958 같은 시험 정리 PR도 다 돌던 것을 줄인다).
          node tools/ci/screen-changes.mjs /tmp/changed-files.txt

  # 2026-11-14: 화면 시험이 한 잡에 줄지어 18분 걸리던 것을 잡 여러 개로 나눠 동시에 돌린다.
  # 필수 검사 이름 '미리보기 postdeploy(로그아웃)'은 맨 아래 모음 잡이 그대로 쓴다 — 아래 잡이 하나라도
  # 실패·취소되면 모음 잡도 실패한다. 새 화면 시험은 가장 짧은 잡에 단계로 붙인다(각 잡 소요는 요약에 적힌다).
  screen-board:
    name: 화면 시험 — 보드·접근성·날짜
    # 2026-11-22: 호스트 실행기 대기를 줄이려 같은 저장소 PR이고 저장소 변수가 켜져 있으면 CGI 자체 실행기에서 돈다.
    # 포크 PR이나 변수가 꺼진 경우에는 호스트에서 그대로 돈다(ci.yml check 잡과 같은 식).
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.full_name == github.repository && vars.USE_CGI_RUNNER == '1') && '["self-hosted","Linux","X64","cgi"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    needs: screen-changes
    if: needs.screen-changes.outputs.changed == 'true' && (needs.screen-changes.outputs.jobs == 'all' || needs.screen-changes.outputs.jobs == '' || contains(format(',{0},', needs.screen-changes.outputs.jobs), ',screen-board,'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true
      # 같은 CGI 컴퓨터의 자체 실행기 여러 개가 홈의 npm 캐시를 함께 쓰면 동시에 받다가 깨진다
      # (2026-11-24: EINTEGRITY·ENOENT로 시험 전에 실패). 자체 실행기에서는 실행기마다 캐시 폴더를 따로 둔다.
      - name: 실행기별 npm 캐시 폴더(자체 실행기)
        if: runner.environment == 'self-hosted'
        run: echo "npm_config_cache=$HOME/.npm-runner-$RUNNER_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 자체 실행기는 홈 폴더에 Chromium이 그대로 남으므로 Actions 캐시를 쓰지 않는다.
      # (2026-11-22: 시험 5분 뒤 591MB 캐시 올리기에 CGI 회선으로 9분이 더 걸렸다.)
      - uses: actions/cache@v4
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            # 자체 실행기는 홈 캐시에 다른 버전의 Chromium이 있을 수 있어 폴더 유무로 판단하지 않는다.
            # install은 이 버전 Chromium이 이미 있으면 받지 않고 끝난다. 시스템 라이브러리는 미리 깔아 두었다(sudo 없음).
            npx playwright install chromium
          elif ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      # #504: 화면 대비 시험을 CI에서 실제로 돌린다(check 잡엔 크롬이 없어 건너뛰던 것).
      # 크롬을 캐시로 이미 준비하는 이 잡에서 돌리는 쪽이 check 잡(ubuntu+windows 둘 다 설치)보다 필수 검사 시간이 덜 늘어난다.
      # LT_BOARD_CONTRAST_REQUIRE=1 — 건너뜀을 실패로 본다(조용히 지나가지 않게).
      - name: 보드 카드 대비 시험(CI에서 실제로, 건너뜀=실패 — #504)
        env:
          LT_BOARD_CONTRAST_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-card-contrast.test.mjs
          echo "보드 카드 대비 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #520·#521: 읽기 전용 보드의 '＋ 순간 꽂기' 숨김·'읽기 전용' 표시 겹침을 실제 화면에서 잰다.
      # 건너뜀=실패 — 위 대비 시험과 같은 이유(크롬이 이미 준비된 이 잡에서 돈다).
      - name: 보드 읽기 전용·겹침 시험(390·1440 × 밤·정원 × 판, 건너뜀=실패 — #520·#521)
        env:
          LT_BOARD_CONTRAST_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-readonly-520-521.test.mjs
          echo "보드 읽기 전용·겹침 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #536: 넓은 화면 판 채움·별 모양 펼침·기억한 자리 판 규칙·머리줄 [종이|밤]·읽기 전용 표시를 실제 화면에서 잰다.
      - name: 보드 넓은 화면·머리줄 판 전환 시험(건너뜀=실패 — #536)
        env:
          LT_BOARD_WIDE_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-wide-view-536.test.mjs
          echo "보드 넓은 화면·머리줄 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #553: 썸네일이 실린 긴 YouTube 카드가 줄 간격(420px)을 넘어 위아래 카드와 겹치던 것 —
      # 줄 간격을 카드 종류별 최대 높이에 맞추고, 그린 뒤 실제 높이로 열 안 겹침을 벌린다.
      # 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 보드 YouTube 카드 겹침 시험(건너뜀=실패 — #553)
        env:
          LT_BOARD_YT_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-yt-overlap-553.test.mjs
          echo "보드 YouTube 겹침 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #601: 핀보드 2차 — 옛 자리 무시·배치 모드 전환·카드 간소화·상세 재구성·줌 단추·말풍선을
      # 실제 화면에서 잰다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 보드 핀보드 2차 시험(건너뜀=실패 — #601)
        env:
          LT_BOARD_601_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-board-pinboard2-601.test.mjs
          echo "보드 핀보드 2차 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #619-5: 쌓기 배치 — 열마다 차곡차곡 쌓고, 폭이 바뀌면 칸 수만 바뀌어 순서는 같아야 한다.
      # 모델 + 실제 화면(390·1440·1980)을 잰다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 보드 쌓기 배치 시험(건너뜀=실패 — #619-5)
        env:
          LT_BOARD_STACK_619_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-board-stack-619.test.mjs
          echo "보드 쌓기 배치 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #619-6: 내 배치 = 끌어서 끼워 넣기 + 순서(순위) 저장. 저장 경로는 서버 문서 PUT 그대로(y에 순위) — 서버·DB 변경 없음.
      # 모델 + 실제 화면(순서 저장 트리·끼워 넣기 저장·390 순서 유지·옛 x·y 트리 세로 한 줄 방지)을 잰다.
      - name: 보드 순서 끼워 넣기 시험(건너뜀=실패 — #619-6)
        env:
          LT_BOARD_ORDER_619_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-board-order-619.test.mjs
          echo "보드 순서 끼워 넣기 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #514: 남은 접근성 항목(moderate 이하)을 실제 화면에서 잰다 — 확대 막기·랜드마크·제목 단계·
      # 모바일 선택 줄 top. axe-core·Chromium이 필요한 실행형 시험이라 크롬이 준비된 이 잡에서 돈다.
      - name: 남은 접근성 항목 시험(#514, 건너뜀=실패)
        env:
          LT_A11Y514_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test tests/v41-a11y-514-remaining.test.mjs
          echo "남은 접근성 항목 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #547: 새벽에 남긴 순간이 하루 전 날짜로 찍히던 문제 — '오늘'은 기기의 지역 날짜다.
      # 시간대 경계(Asia/Seoul 00:30·08:59·09:00·23:59, America/Los_Angeles)를 고정해 서버·브라우저 양쪽에서
      # 기본 날짜를 확인한다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 지역 날짜(오늘) 시험(시간대 경계, 건너뜀=실패 — #547)
        env:
          LT_LOCAL_DATE_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-local-date-547.test.mjs
          echo "지역 날짜 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 11-14 점검: 핀보드(#582)·상세 다음/이전 단추(#583) 화면 시험이 CI 어디에도 연결되지 않아 조용히 건너뛰어졌다.
      - name: 핀보드·상세 단추 시험(건너뜀=실패 — #582·#583)
        env:
          LT_BOARD_582_REQUIRE: '1'
          LT_BOARD_583_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 --test-skip-pattern='그림 지연 도착에도' tests/v41-board-pinboard-582.test.mjs tests/v41-board-cursor-detail.test.mjs
          echo "핀보드·상세 단추 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #952: 보드 머리 트리 제목(#417)·판 테마 드롭(#467) 화면 시험도 이 잡에서 돈다 — 건너뜀=실패.
      - name: 보드 트리 제목·판 테마 시험(건너뜀=실패 — #417·#467)
        env:
          LT_BOARD_417_REQUIRE: '1'
          LT_BOARD_467_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-board-map-tree-title.test.mjs tests/v41-board-theme-flow.test.mjs
          echo "보드 트리 제목·판 테마 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #1295: 트리 보기 뒤로 가기 시험(건너뜀=실패) — 화면 시험은 이 잡에서만 돌아야 한다.
      - name: 트리 보기 뒤로 가기 시험(건너뜀=실패 — #1295)
        env:
          LT_TREE_777_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-tree-layout-777.test.mjs
          echo "트리 보기 뒤로 가기 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #608: 보드 순간 수정 창에서 날짜를 바꾸는 시험 — 책과 같은 규칙·경로, 날짜순 재배치·내 배치 유지.
      # 크롬이 필요한 실행형 시험이라 이 잡에서 돈다. 건너뜀=실패.
      - name: 보드 날짜 수정 시험(건너뜀=실패 — #608)
        env:
          LT_BOARD_608_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-board-date-edit-608.test.mjs
          echo "보드 날짜 수정 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # B-04: CI에서 한 번도 돌지 않던 시험 연결(건너뜀=실패).
      - name: 보드 범례·바닥 링크 시험(건너뜀=실패 — #932·#937·#850)
        env:
          LT_932_937_REQUIRE: '1'
          LT_BOTTOM_LINKS_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test --test-concurrency=1 tests/v41-932-937-board-legend.test.mjs tests/v41-bottom-links-850.test.mjs
