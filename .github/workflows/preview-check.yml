          node --test --test-concurrency=1 tests/v41-explore-moments-1025.test.mjs tests/v41-1286-moments.test.mjs
          echo "둘러보기 순간 보기 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # #631: 의견 보내기 창 — 1440×900 에서 스크롤 없이 들어오고, 체크 상자와 글자가 같은 줄이며,
      # 보낸 뒤 제목·주 단추·안내가 바뀌는지 수치로 잰다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 의견 보내기 창 배치·보낸 뒤 화면 시험(건너뜀=실패 — #631)
        env:
