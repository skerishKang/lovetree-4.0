name: 미리보기 검사

# 원칙 8(머지 전 PR 미리보기 postdeploy) 자동 실행. 로그아웃 검사만 하므로 비밀값이 필요 없다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: preview-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 2026-11-14: 화면 시험이 한 잡에 줄지어 18분 걸리던 것을 잡 여러 개로 나눠 동시에 돌린다.
  # 필수 검사 이름 '미리보기 postdeploy(로그아웃)'은 맨 아래 모음 잡이 그대로 쓴다 — 아래 잡이 하나라도
  # 실패·취소되면 모음 잡도 실패한다. 새 화면 시험은 가장 짧은 잡에 단계로 붙인다(각 잡 소요는 요약에 적힌다).
  screen-board:
    name: 화면 시험 — 보드·접근성·날짜
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      # #504: 화면 대비 시험을 CI에서 실제로 돌린다(check 잡엔 크롬이 없어 건너뛰던 것).
      # 크롬을 캐시로 이미 준비하는 이 잡에서 돌리는 쪽이 check 잡(ubuntu+windows 둘 다 설치)보다 필수 검사 시간이 덜 늘어난다.
      # LT_BOARD_CONTRAST_REQUIRE=1 — 건너뜀을 실패로 본다(조용히 지나가지 않게).
      - name: 보드 카드 대비 시험(CI에서 실제로, 건너뜀=실패 — #504)
        env:
          LT_BOARD_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-card-contrast.test.mjs
          echo "보드 카드 대비 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #520·#521: 읽기 전용 보드의 '＋ 순간 꽂기' 숨김·'읽기 전용' 표시 겹침을 실제 화면에서 잰다.
      # 건너뜀=실패 — 위 대비 시험과 같은 이유(크롬이 이미 준비된 이 잡에서 돈다).
      - name: 보드 읽기 전용·겹침 시험(390·1440 × 밤·정원 × 판, 건너뜀=실패 — #520·#521)
        env:
          LT_BOARD_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-readonly-520-521.test.mjs
          echo "보드 읽기 전용·겹침 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #536: 넓은 화면 판 채움·별 모양 펼침·기억한 자리 판 규칙·머리줄 [종이|밤]·읽기 전용 표시를 실제 화면에서 잰다.
      - name: 보드 넓은 화면·머리줄 판 전환 시험(건너뜀=실패 — #536)
        env:
          LT_BOARD_WIDE_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-wide-view-536.test.mjs
          echo "보드 넓은 화면·머리줄 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #553: 썸네일이 실린 긴 YouTube 카드가 줄 간격(420px)을 넘어 위아래 카드와 겹치던 것 —
      # 줄 간격을 카드 종류별 최대 높이에 맞추고, 그린 뒤 실제 높이로 열 안 겹침을 벌린다.
      # 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 보드 YouTube 카드 겹침 시험(건너뜀=실패 — #553)
        env:
          LT_BOARD_YT_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-yt-overlap-553.test.mjs
          echo "보드 YouTube 겹침 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #514: 남은 접근성 항목(moderate 이하)을 실제 화면에서 잰다 — 확대 막기·랜드마크·제목 단계·
      # 모바일 선택 줄 top. axe-core·Chromium이 필요한 실행형 시험이라 크롬이 준비된 이 잡에서 돈다.
      - name: 남은 접근성 항목 시험(#514, 건너뜀=실패)
        env:
          LT_A11Y514_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-a11y-514-remaining.test.mjs
          echo "남은 접근성 항목 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #547: 새벽에 남긴 순간이 하루 전 날짜로 찍히던 문제 — '오늘'은 기기의 지역 날짜다.
      # 시간대 경계(Asia/Seoul 00:30·08:59·09:00·23:59, America/Los_Angeles)를 고정해 서버·브라우저 양쪽에서
      # 기본 날짜를 확인한다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 지역 날짜(오늘) 시험(시간대 경계, 건너뜀=실패 — #547)
        env:
          LT_LOCAL_DATE_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-local-date-547.test.mjs
          echo "지역 날짜 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

  screen-home-book:
    name: 화면 시험 — 첫 화면·책
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      # #535: 첫 화면 카드의 '떠 있음'(이동 폭·동작 줄이기), 카드끼리 겹친 면적, 가운데 단추 세 자리,
      # 끄는 동안의 레이어 승격·관성을 실제 화면에서 잰다. 첫 화면은 vite 번들이라 먼저 build 한다.
      - name: 첫 화면 떠 있음·겹침 시험(#535, 건너뜀=실패)
        env:
          LT_ORBIT535_REQUIRE: '1'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test tests/v41-orbit-535-float-overlap.test.mjs
          echo "첫 화면 떠 있음·겹침 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #537: 책의 한 장 보기가 순간 하나씩 넘어가는지, 넓은 화면에서 두 장 책의 한 쪽 크기·같은 높이로
      # 나오는지, 390 휴대폰 모양이 그대로인지를 실제 화면에서 잰다. 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 책 한 장 보기 시험(1440·390 순간 하나씩, 건너뜀=실패 — #537)
        env:
          LT_BOOK_SINGLE_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-book-single-537.test.mjs
          echo "책 한 장 보기 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      - name: 책 YouTube 재생·두 장 모드 시험(건너뜀=실패 — 이슈 584)
        env:
          LT_BOOK_584_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-book-play-584.test.mjs
          echo "책 재생·두 장 모드 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

  screen-map-a:
    name: 화면 시험 — 지도 대비
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - name: 지도 실제 대비 시험(건너뜀=실패)
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          # #529: 이름표 대비는 실제로 그려진 한글 글자를 잰다. 실행기에 한글 글꼴이 없으면 준비한다(있으면 건너뜀).
          if ! fc-list :lang=ko | grep -q .; then
            echo "한글 글꼴 없음 — fonts-noto-cjk 설치"
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개 · 대표 $(fc-match 'sans-serif:lang=ko' | head -1)"
          # 시험 안에서 조합(크기×테마×판 8개)을 둘씩 동시에 돌린다(지도 잡 시간 단축 — 픽셀 해석이
          # 렌더러 프로세스별로 나뉜다). 판 흐름 시험은 지도 도구 줄 잡으로 옮겼다(지도 잡이 3분 안에 들도록).
          # #583 부채꼴·'이 순간 열기' 시험(약 10초)은 대비 시험과 나란히 돌린다 — 실행기 코어 4개에
          # 대비 시험 워커 2개 + 이 시험 브라우저 1개가 함께 도는다. 잡이 2분 안에 들도록 순서로 쌓지 않는다.
          node --test --test-concurrency=1 tests/v41-map-contrast.test.mjs > /tmp/map-contrast.log 2>&1 & p1=$!
          LT_MAP_FAN_REQUIRE=1 node --test --test-concurrency=1 tests/v41-map-fan-open.test.mjs > /tmp/map-fan.log 2>&1 & p2=$!
          wait $p1; r1=$?; wait $p2; r2=$?
          # 실패하면 원인을 그대로 보인다(#529 흔들림 진단 출력 유지).
          if [ $r1 -ne 0 ]; then echo '— 지도 대비 시험 출력 —'; tail -60 /tmp/map-contrast.log; fi
          if [ $r2 -ne 0 ]; then echo '— 지도 부채꼴·열기 시험 출력 —'; cat /tmp/map-fan.log; fi
          [ $r1 -eq 0 ] && [ $r2 -eq 0 ] || exit 1
          echo "지도 실제 대비·부채꼴 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

  screen-map-b:
    name: 화면 시험 — 지도 도구 줄·판 흐름·책 이동
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - name: 지도 도구 줄·책 이동 시험(#517·#518, 건너뜀=실패)
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          # #529: 이름표 대비는 실제로 그려진 한글 글자를 잰다. 실행기에 한글 글꼴이 없으면 준비한다(있으면 건너뜀).
          if ! fc-list :lang=ko | grep -q .; then
            echo "한글 글꼴 없음 — fonts-noto-cjk 설치"
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개 · 대표 $(fc-match 'sans-serif:lang=ko' | head -1)"
          # #517·#518: 390·360 지도 도구 줄 넘침·겹침과 상세 '기억책에서 보기'의 책 이동을 실제 화면에서 잰다.
          node --test --test-concurrency=1 tests/v41-network-toolbar-517.test.mjs tests/v41-map-open-book-518.test.mjs
          echo "지도 도구 줄·책 이동 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 지도 판 흐름(설정·저장 복원·두 보기·누르기·유휴 0)은 지도 대비 잡에서 여기로 옮겼다(지도 잡 시간 단축).
      # 브라우저 준비·한글 글꼴은 같은 잡의 앞 단계에서 이미 끝난 것을 쓴다.
      - name: 지도 판 흐름 시험(건너뜀=실패)
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-map-theme-flow.test.mjs
          echo "지도 판 흐름 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 이슈 548: 화면마다 기준선(부수 글자 12px·본문·안내·단추 13px)에 못 미치는 글자가 0개인지 실제 크롬으로 잰다.
      # 가장 짧은 화면 시험 잡에 단계로 붙인다(각 잡 소요는 요약에 적힌다). 첫 화면이 vite 번들이라 먼저 build 한다.
      # 지도 판 흐름(약 75초)과 함께 이 잡은 약 3분 — 여전히 가장 짧은 화면 시험 잡이다.
      - name: 화면 글자 기준선 시험(이슈 548, 건너뜀=실패)
        env:
          LT_FONT_FLOOR_REQUIRE: '1'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test tests/v41-font-floor-548.test.mjs
          echo "화면 글자 기준선 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

  screen-book-screen:
    name: 화면 시험 — 책 대비·초점
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      # 책 화면 시험들은 지금까지 크롬이 없는 check 잡에서 조용히 건너뛰어졌다(보드·지도와 같은 빈틈).
      # #515·#516 정원 책 이유 줄·보기 알약·페이지 수 대비, #522 좌우 페이지 번호 대비,
      # #519 닫힌 창 초점(inert)을 실제 화면에서 잰다. 세 시험 모두 글자색은 getComputedStyle로 읽고
      # 바탕은 스크린샷 픽셀로 재므로 한글 글꼴 설치가 필요 없다(2026-11-15 로컬 REQUIRE=1 통과).
      - name: 책 대비·초점 시험(#515·#516·#522·#519, 건너뜀=실패)
        env:
          LT_BOOK_CONTRAST_REQUIRE: '1'
          LT_BOOK_FOLIO_REQUIRE: '1'
          LT_BOOK_FOCUS_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-book-contrast-515-516.test.mjs tests/v41-book-folio-contrast-522.test.mjs tests/v41-book-closed-focus-519.test.mjs
          echo "책 대비·초점 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 보드·책 겹(패널)의 키보드 초점 계약(inert·초점 복귀)도 지금까지 check 잡에서만 건너뛰어졌다(#575와 같은 빈틈).
      # 브라우저 준비는 같은 잡의 앞 단계에서 이미 끝난 것을 쓴다(로컬 REQUIRE=1 10초).
      - name: 겹(패널) 초점 계약 시험(건너뜀=실패)
        env:
          LT_VIEW_A11Y_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-view-a11y-panel.test.mjs
          echo "겹 초점 계약 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 미리보기 배포 검사(postdeploy·겉모습 비교)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - name: 미리보기 주소 찾기
        id: preview
        run: node tools/postdeploy/preview-url.mjs "$GITHUB_REPOSITORY" "$PR_SHA" --wait 600
      # 겉모습 비교(알림용)는 화면 파일이 바뀐 PR에서만 돈다 — 문서·서버·시험만 바뀐 PR은 3~4분을 아낀다.
      - name: 화면 파일 바뀜 확인
        id: changes
        run: |
          BASE_SHA=$(git merge-base "$PR_SHA" origin/main)
          if git diff --name-only "$BASE_SHA" "$PR_SHA" | grep -Eq '^(public/|src/|index\.html$|vite\.config|package\.json$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "화면 파일 바뀜 — 겉모습 비교를 돈다"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"; echo "화면 파일 안 바뀜 — 겉모습 비교 건너뜀"
            echo "## 겉모습 비교 건너뜀 — 화면 파일(public/·src/ 등)이 바뀌지 않은 PR" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 기준 커밋 찾기(merge-base 배포본)
        if: steps.changes.outputs.ui == 'true'
        id: base
        run: |
          BASE_SHA=$(git merge-base "$PR_SHA" origin/main)
          echo "baseSha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "기준 커밋(merge-base): $BASE_SHA"
          node tools/postdeploy/preview-url.mjs "$GITHUB_REPOSITORY" "$BASE_SHA" --wait 240 --quiet > "$RUNNER_TEMP/base.log" 2>&1 || true
          BASE_URL=$(sed -n 's/.*preview=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/base.log" | head -1)
          if [ -n "$BASE_URL" ] && [ "$BASE_URL" != "(없음)" ]; then
            echo "baseUrl=$BASE_URL" >> "$GITHUB_OUTPUT"
            echo "baseLabel=기준 커밋 배포본" >> "$GITHUB_OUTPUT"
            echo "기준 주소: $BASE_URL"
          else
            echo "baseUrl=https://lovetree-4-0.pages.dev" >> "$GITHUB_OUTPUT"
            echo "baseLabel=운영(대체)" >> "$GITHUB_OUTPUT"
            echo "기준 커밋 배포 주소를 못 찾아 운영으로 대체: $(sed -n 's/.*reason=//p' "$RUNNER_TEMP/base.log" | head -1)"
          fi
      - name: 미리보기 배포 없음 — 건너뜀
        if: steps.preview.outputs.url == ''
        run: |
          echo "미리보기 검사를 건너뜁니다: ${{ steps.preview.outputs.reason }}"
          {
            echo "## 미리보기 검사 건너뜀"
            echo ""
            echo "- 이유: ${{ steps.preview.outputs.reason }}"
            echo "- 커밋: \`$PR_SHA\`"
            echo "- Cloudflare Pages 미리보기 배포가 없거나 주소를 확인할 수 없어 검사를 실행하지 않았습니다(실패 아님)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: postdeploy 로그아웃 검사
        if: steps.preview.outputs.url != ''
        id: run
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          set +e
          node tools/postdeploy/postdeploy.mjs "${{ steps.preview.outputs.url }}/v41/" \
            --profile "$RUNNER_TEMP/preview-profile" \
            --out "$RUNNER_TEMP/preview-out" \
            --timeout 45000 > "$RUNNER_TEMP/postdeploy.log" 2>&1
          status=$?
          echo "postdeploy 종료 코드=$status"
          tail -40 "$RUNNER_TEMP/postdeploy.log"
          cp -r "$RUNNER_TEMP/preview-out" ./preview-out 2>/dev/null || true
          echo "postdeploy 채점은 다음 단계(preview-gate)에서 한다(미리보기 Functions 503 예외)."
          exit 0
      - name: 판정(제품 결함 / 환경 문제 나눠 적기)
        if: steps.preview.outputs.url != ''
        run: |
          if [ ! -d ./preview-out ]; then echo "리포트 폴더가 없습니다"; exit 2; fi
          # #496: 준비 단계가 'cold'(기한 안에 404·503만)면 판정기가 환경 문제로 나눈다.
          node tools/postdeploy/preview-gate.mjs ./preview-out \
            --summary "$GITHUB_STEP_SUMMARY" \
            --readiness "${{ steps.preview.outputs.readiness || 'unknown' }}"
      # ---- 겉모습 비교(visual-baseline, 2026-11-08): 알림만 하고 실패로 만들지 않는다 ----
      - name: 기준 커밋 화면 캡처 — before
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        id: capture-before
        continue-on-error: true
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          start=$(date +%s)
          node tools/visual-baseline/visual-baseline.mjs capture \
            --base "${{ steps.base.outputs.baseUrl }}/v41/" --out visual-before > "$RUNNER_TEMP/before.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -5 "$RUNNER_TEMP/before.log" || true
      - name: 미리보기 화면 캡처 — after
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        id: capture-after
        continue-on-error: true
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          start=$(date +%s)
          node tools/visual-baseline/visual-baseline.mjs capture \
            --base "${{ steps.preview.outputs.url }}/v41/" --out visual-after > "$RUNNER_TEMP/after.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -5 "$RUNNER_TEMP/after.log" || true
      - name: 화면 비교(장별 차이 %)
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        id: compare
        continue-on-error: true
        run: |
          start=$(date +%s)
          set +e
          node tools/visual-baseline/visual-baseline.mjs compare \
            --before visual-before --after visual-after --out visual-diff --json visual-diff.json > "$RUNNER_TEMP/compare.log" 2>&1
          echo "기준 초과가 있어도 실패로 만들지 않습니다(종료 코드 $?)." >> "$RUNNER_TEMP/compare.log"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -12 "$RUNNER_TEMP/compare.log" || true
      - name: 겉모습 비교 요약 표
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        continue-on-error: true
        run: |
          if [ ! -f visual-diff.json ]; then
            {
              echo "## 겉모습 비교(visual-baseline) — 건너뜀"
              echo ""
              echo "- 이유: 캡처/비교 산출물이 없습니다(before=${{ steps.capture-before.outputs.status }} after=${{ steps.capture-after.outputs.status }})."
              echo "- 캡처 로그: \`$RUNNER_TEMP/before.log\`, \`$RUNNER_TEMP/after.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 기준이 운영 대체이면 차이에 다른 PR 변경이 섞였을 수 있음을 경고한다.
          if [ "${{ steps.base.outputs.baseLabel }}" = "운영(대체)" ]; then
            LAG_ARG="--lag 기준: 운영(대체) — 차이에 다른 PR 변경이 섞였을 수 있음"
          else
            LAG_ARG=""
          fi
          node tools/visual-baseline/visual-summary.mjs visual-diff.json \
            --before-url "${{ steps.base.outputs.baseUrl }}/v41/" \
            --after-url "${{ steps.preview.outputs.url }}/v41/" \
            --base-sha "${{ steps.base.outputs.baseSha }}" \
            --head-sha "$PR_SHA" \
            --base-label "${{ steps.base.outputs.baseLabel }}" \
            $LAG_ARG | head -40
          echo "- 소요: 캡처 before ${{ steps.capture-before.outputs.seconds }}초 · after ${{ steps.capture-after.outputs.seconds }}초 · 비교 ${{ steps.compare.outputs.seconds }}초" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.preview.outputs.url != ''
        with:
          name: preview-check-${{ github.event.pull_request.number }}
          path: |
            preview-out
            visual-before
            visual-after
            visual-diff
            visual-diff.json
          retention-days: 14

  preview:
    name: 미리보기 postdeploy(로그아웃)
    runs-on: ubuntu-latest
    if: always()
    needs: [screen-board, screen-home-book, screen-map-a, screen-map-b, screen-book-screen, deploy]
    steps:
      - name: 모든 화면 시험·배포 검사 결과 모으기
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{
              const needs=JSON.parse(t);let bad=0;
              for(const [k,v] of Object.entries(needs)){console.log(`${k}: ${v.result}`);if(v.result!=="success")bad++;}
              if(bad){console.error(`실패·취소된 잡 ${bad}개`);process.exit(1);}
            });'
