          r=0
          while kill -0 $pid 2>/dev/null; do
            sleep 30
            if ! kill -0 $pid 2>/dev/null; then break; fi
            last=$(grep -E '^(ok|not ok)' /tmp/screen-audit.log | tail -1)
            echo "…진행 중 $(( $(date +%s) - start ))초 — 마지막 완료: ${last:-아직 완료한 시험 없음}"
            echo "…진행 중 $(( $(date +%s) - start ))초 — 마지막 완료: ${last:-아직 완료한 시험 없음}" >> "$GITHUB_STEP_SUMMARY"
          done
          wait $pid || r=$?
          echo "화면 공통 검사기 shard c 종료 코드 $r · $(( $(date +%s) - start ))초"
          echo '— 화면 공통 검사기 실패 블록(전체) —'
          awk '/^not ok /{p=1} p{print} p&&/^  \.\.\./{p=0}' /tmp/screen-audit.log || true
          echo '— 화면 공통 검사기 출력(마지막 60줄) —'
          tail -60 /tmp/screen-audit.log || true
          echo "화면 공통 검사기 shard c $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
          exit $r
      - name: 화면 변경 없으면 건너뜀을 남긴다
        if: always()
        run: |
          if [ "${{ needs.screen-changes.outputs.changed }}" != "true" ]; then
            echo "건너뜀(화면 변경 없음)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
