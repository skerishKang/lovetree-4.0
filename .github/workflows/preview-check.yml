          # Upstream pinned revision: SHA-256 checked for both cached and downloaded copies.
          noto_font="$HOME/.fonts/NotoSansCJK-Regular.ttc"
          noto_sha256="b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a"
          if [ -f "$noto_font" ] && ! echo "$noto_sha256  $noto_font" | sha256sum --check --status; then
            rm -f "$noto_font"
          fi
          if [ ! -f "$noto_font" ]; then
            mkdir -p "$HOME/.fonts"
            if curl -fLsS --retry 2 --connect-timeout 10 --max-time 90 "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc" -o "$noto_font"; then
              if ! echo "$noto_sha256  $noto_font" | sha256sum --check --status; then
                echo "Noto CJK checksum mismatch; falling back to APT"
                rm -f "$noto_font"
              fi
            else
              rm -f "$noto_font"
            fi
          fi
          if [ -f "$HOME/.fonts/NotoSansCJK-Regular.ttc" ]; then
            echo "캐시된 한글 글꼴 사용($(ls "$HOME/.fonts" | wc -l)개 파일)"
          else
            echo "캐시된 한글 글꼴 없음 — fonts-noto-cjk 설치해 ~/.fonts에 쌓는다"
            sudo apt-get update -qq || true
            ok=0
            for i in 1 2 3; do
              if sudo timeout 150 apt-get install -y -qq --no-install-recommends fonts-noto-cjk; then ok=1; break; fi
              echo "apt-get install $i번째 시도 실패/멈춤 — 다시 시도"
              sleep 5
            done
            [ $ok -eq 1 ] || { echo "fonts-noto-cjk 설치 실패"; exit 1; }
            mkdir -p "$HOME/.fonts"
            sudo cp /usr/share/fonts/opentype/noto/*.tt* "$HOME/.fonts/" 2>/dev/null || sudo find /usr/share/fonts -name 'Noto*CJK*.ttc' -exec cp {} "$HOME/.fonts/" \; 2>/dev/null || true
            echo "쌓은 글꼴 파일 $(ls "$HOME/.fonts" | wc -l)개"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개 · 대표 $(fc-match 'sans-serif:lang=ko' | head -1)"
          echo "한글 글꼴 준비 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 지도는 추후 개발(11-22 대표 결정): 지도 파일이 안 바뀐 PR에서는 이 단계를 건너뛴다(같은 잡의 서재·순간 시험은 그대로 돈다).
      - name: 지도 실제 대비 시험(건너뜀=실패)
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true' && needs.screen-changes.outputs.map_changed == 'true'
        run: |
          start=$(date +%s)
          # #529: 이름표 대비는 실제로 그려진 한글 글자를 잰다 — 한글 글꼴은 앞의 '한글 글꼴 준비' 단계에서 둔다.
          # 시험 안에서 조합(크기×테마×판 8개)을 둘씩 동시에 돌린다(지도 잡 시간 단축 — 픽셀 해석이
          # 렌더러 프로세스별로 나뉜다). 판 흐름 시험은 지도 도구 줄 잡으로 옮겼다(지도 잡이 3분 안에 들도록).
          # #583 부채꼴·'이 순간 열기' 시험(약 10초)은 대비 시험과 나란히 돌린다 — 실행기 코어 4개에
          # 대비 시험 워커 2개 + 이 시험 브라우저 1개가 함께 도는다. 잡이 2분 안에 들도록 순서로 쌓지 않는다.
