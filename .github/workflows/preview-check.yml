        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        timeout-minutes: 8
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: fonts-noto-cjk-${{ runner.os }}-1
      # 이슈 947: apt-get이 가끔 10분 넘게 멈춘다(실측 — 지도 도구 줄 잡 10분 단계 초과). 매번 apt로 받지 않고
      # 글꼴 파일(~/.fonts)을 캐시에 두고, 캐시가 있으면 fc-cache만 한다. 없을 때만 설치해 캐시에 쌓는다.
      - name: 한글 글꼴 준비(캐시, 없으면 설치)
        if: needs.screen-changes.outputs.changed == 'true'
        timeout-minutes: 10
        run: |
          start=$(date +%s)
          # 두 갈래만 둔다(실행기마다 글꼴 구성이 달라 fc-list로 판단하면 캐시를 채울 기회를 놓친다 — 실측).
          # APT mirror delays must not prevent the same Noto CJK font from being installed.
          # Pin the upstream font revision; the APT path below remains as fallback.
          # Upstream pinned revision: SHA-256 checked for both cached and downloaded copies.
          noto_font="$HOME/.fonts/NotoSansCJK-Regular.ttc"
          noto_sha256="b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a"
          if [ -f "$noto_font" ] && ! echo "$noto_sha256  $noto_font" | sha256sum --check --status; then
            rm -f "$noto_font"
          fi
          if [ ! -f "$noto_font" ]; then
            mkdir -p "$HOME/.fonts"
            if curl -fLsS --retry 2 --connect-timeout 10 --max-time 90 "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc" -o "$noto_font"; then
              if ! echo "$noto_sha256  $noto_font" | sha256sum --check --status; then
                echo "Noto CJK checksum mismatch; falling back to APT"
                rm -f "$noto_font"
              fi
            else
              rm -f "$noto_font"
            fi
          fi
          if [ -f "$HOME/.fonts/NotoSansCJK-Regular.ttc" ]; then
            echo "캐시된 한글 글꼴 사용($(ls "$HOME/.fonts" | wc -l)개 파일)"
          else
            echo "캐시된 한글 글꼴 없음 — fonts-noto-cjk 설치해 ~/.fonts에 쌓는다"
            sudo apt-get update -qq || true
            ok=0
            for i in 1 2 3; do
              if sudo timeout 150 apt-get install -y -qq --no-install-recommends fonts-noto-cjk; then ok=1; break; fi
              echo "apt-get install $i번째 시도 실패/멈춤 — 다시 시도"
              sleep 5
            done
            [ $ok -eq 1 ] || { echo "fonts-noto-cjk 설치 실패"; exit 1; }
            mkdir -p "$HOME/.fonts"
            sudo cp /usr/share/fonts/opentype/noto/*.tt* "$HOME/.fonts/" 2>/dev/null || sudo find /usr/share/fonts -name 'Noto*CJK*.ttc' -exec cp {} "$HOME/.fonts/" \; 2>/dev/null || true
            echo "쌓은 글꼴 파일 $(ls "$HOME/.fonts" | wc -l)개"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개 · 대표 $(fc-match 'sans-serif:lang=ko' | head -1)"
          echo "한글 글꼴 준비 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: 지도 도구 줄·책 이동 시험(#517·#518, 건너뜀=실패)
        timeout-minutes: 10
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          # #529: 이름표 대비는 실제로 그려진 한글 글자를 잰다 — 한글 글꼴은 앞의 '한글 글꼴 준비' 단계에서 둔다.
          # #517·#518: 390·360 지도 도구 줄 넘침·겹침과 상세 '기억책에서 보기'의 책 이동을 실제 화면에서 잰다.
          # #601: 관계 지도 다듬기 시험(새 순간 기본 연결·점 이름표·묶음·두 보기 판 일치·이어진 선)을 나란히 돌린다
          # (지도 대비 잡의 나란히 돌리기와 같은 요령 — 종료 코드를 받아 두고 로그를 항상 출력한 뒤 판정한다).
          node --test --test-concurrency=1 tests/v41-network-toolbar-517.test.mjs tests/v41-map-open-book-518.test.mjs > /tmp/map-517.log 2>&1 & p1=$!
          LT_MAP_RELATIONS_REQUIRE=1 node --test --test-concurrency=1 tests/v41-map-relations-601.test.mjs > /tmp/map-relations.log 2>&1 & p2=$!
          r1=0; wait $p1 || r1=$?
          r2=0; wait $p2 || r2=$?
          echo "map-517 exit=$r1 · map-relations exit=$r2"
          echo '— 지도 도구 줄·책 이동 시험 출력(마지막 60줄) —'
          tail -60 /tmp/map-517.log || true
          echo '— 지도 관계 시험(#601) 출력 —'
          cat /tmp/map-relations.log || true
          [ $r1 -eq 0 ] && [ $r2 -eq 0 ] || exit 1
          echo "지도 도구 줄·책 이동 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 지도 판 흐름(설정·저장 복원·두 보기·누르기·유휴 0)은 지도 대비 잡에서 여기로 옮겼다(지도 잡 시간 단축).
      # 브라우저 준비·한글 글꼴은 같은 잡의 앞 단계에서 이미 끝난 것을 쓴다.
      - name: 지도 판 흐름 시험(건너뜀=실패)
        timeout-minutes: 6
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-map-theme-flow.test.mjs
          echo "지도 판 흐름 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # #996: 그래프 꼬리표 판(#842·#841) 시험을 CI에서 실제로 돌린다 — 빈 무대 수리 뒤 간헐 실패가
      # 사라졌는지 여기서 잰다. 첫 화면은 vite 번들이라 먼저 build 한다. 건너뜀=실패.
      - name: 그래프 꼬리표 판 시험(건너뜀=실패 — #842·#841·#996)
        timeout-minutes: 6
        env:
          LT_GRAPH_842_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test --test-concurrency=1 tests/v41-graph-842-841.test.mjs
          echo "그래프 꼬리표 판 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 이슈 548: 화면마다 기준선(부수 글자 12px·본문·안내·단추 13px)에 못 미치는 글자가 0개인지 실제 크롬으로 잰다.
      # 가장 짧은 화면 시험 잡에 단계로 붙인다(각 잡 소요는 요약에 적힌다). 첫 화면이 vite 번들이라 먼저 build 한다.
      # 지도 판 흐름(약 75초)과 함께 이 잡은 약 3분 — 여전히 가장 짧은 화면 시험 잡이다.
      - name: 화면 글자 기준선 시험(이슈 548, 건너뜀=실패)
        timeout-minutes: 6
        env:
          LT_FONT_FLOOR_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test tests/v41-font-floor-548.test.mjs
          echo "화면 글자 기준선 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 대표 요청 2026-11-16: 운영센터 상태 칩 한 모양(높이·한 줄·글자 폭)·이름('이슈 닫힘'/'고객에게: 고침')·
      # PR 번호('PR #637 · 제목')를 1440·390에서 숫자로 잰다(tests/admin-view.test.mjs — 관리자 세션·GitHub 읽기는 가짜).
      # 긴 화면 공통 검사기보다 앞에 둔다 — 공통 검사기가 흔들려 잡이 빨강이 될 때 이 단계가 가려지지 않게.
      - name: 운영센터 상태 칩 시험(건너뜀=실패)
        timeout-minutes: 6
        env:
          LT_ADMIN_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test tests/admin-view.test.mjs
          echo "운영센터 상태 칩 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # 이슈 657: 화면 공통 검사기 — 이슈마다 따로 짜 온 겹침·가려짐·가로 넘침·잘림·흔적 값·작은 글자 검사를
      # 주요 화면(첫 화면·책·보드·지도·둘러보기·의견 창·어떻게 쓰나요) 한 번에 잰다(390·1440 × 밤·정원).
      # 548과 같은 요령: 가장 짧은 화면 시험 잡에 단계로 붙인다. 첫 화면·책이 vite 번들이라 먼저 build 한다.
      # main에서 이미 나는 항목은 시험 파일 안 '알려진 문제' 목록(KNOWN, 이슈 번호 적음)으로 기록하고, 목록 밖의 새 실패만 빨강이다.
      # 이슈 947: 이 단계가 멈추면 출력 없이 잡 25분에 죽어 로그도 없었다(이슈 947 — 취소된 잡 2개의 step 기록으로
      # 이 단계가 멈춤을 확인). 시험 판정은 그대로 두고, ①단계 시간 제한(14분 — 넘으면 잡 전체가 아니라 이 단계가
      # 빨강이 되고 runner가 살아 로그가 남는다) ②출력을 로그 파일로 받고 30초마다 '진행 중 · 마지막 완료 시험'을
      # 에코해 멈춘 뒤에도 어느 시험까지 끝났는지 남긴다.
      # #1080: 화면 공통 검사기는 screen-audit-a/b/c 잡으로 옮겼다(이 잡의 시간 단축).
      - name: 화면 변경 없으면 건너뜀을 남긴다
        if: always()
        run: |
          if [ "${{ needs.screen-changes.outputs.changed }}" != "true" ]; then
            echo "건너뜀(화면 변경 없음)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  screen-book-screen:
    name: 화면 시험 — 책 대비·초점
    # 책 화면 잡은 글자 줄바꿈·페이지 넘침을 재므로 글꼴이 다른 CGI가 아니라 호스트에서 돈다(2026-11-22 CGI에서 넘침 실측이 달라 실패).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: screen-changes
    if: needs.screen-changes.outputs.changed == 'true' && (needs.screen-changes.outputs.jobs == 'all' || needs.screen-changes.outputs.jobs == '' || contains(format(',{0},', needs.screen-changes.outputs.jobs), ',screen-book-screen,'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            # 자체 실행기: 이 버전 Chromium이 있으면 받지 않고 끝난다(시스템 라이브러리는 미리 깔림, sudo 없음).
            npx playwright install chromium
          elif ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      # 책 화면 시험들은 지금까지 크롬이 없는 check 잡에서 조용히 건너뛰어졌다(보드·지도와 같은 빈틈).
      # #515·#516 정원 책 이유 줄·보기 알약·페이지 수 대비, #522 좌우 페이지 번호 대비,
      # #519 닫힌 창 초점(inert)을 실제 화면에서 잰다. 세 시험 모두 글자색은 getComputedStyle로 읽고
      # 바탕은 스크린샷 픽셀로 재므로 한글 글꼴 설치가 필요 없다(2026-11-15 로컬 REQUIRE=1 통과).
      - name: 책 대비·초점 시험(#515·#516·#522·#519, 건너뜀=실패)
        env:
          LT_BOOK_CONTRAST_REQUIRE: '1'
          LT_BOOK_FOLIO_REQUIRE: '1'
          LT_BOOK_FOCUS_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-book-contrast-515-516.test.mjs tests/v41-book-folio-contrast-522.test.mjs tests/v41-book-closed-focus-519.test.mjs
          echo "책 대비·초점 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 보드·책 겹(패널)의 키보드 초점 계약(inert·초점 복귀)도 지금까지 check 잡에서만 건너뛰어졌다(#575와 같은 빈틈).
      # 브라우저 준비는 같은 잡의 앞 단계에서 이미 끝난 것을 쓴다(로컬 REQUIRE=1 10초).
      - name: 겹(패널) 초점 계약 시험(건너뜀=실패)
        env:
          LT_VIEW_A11Y_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test tests/v41-view-a11y-panel.test.mjs
          echo "겹 초점 계약 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      # 11-14 점검: 첫 트리 안내 '알겠어요'(#549)·'이름 바꾸기'(#571) 화면 시험도 연결되지 않아 건너뛰어졌다.
      - name: 첫 트리 안내 시험(건너뜀=실패 — #549·#571)
        env:
          LT_TREE_TIPS_549_REQUIRE: '1'
          LT_TREE_RENAME_571_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          node --test --test-concurrency=1 tests/v41-tree-tips-549.test.mjs tests/v41-tree-rename-tips-571.test.mjs
          echo "첫 트리 안내 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # 이슈 970: 쓰기 창 탭(입력 유지·방향키·aria-selected), 모아둔 순간(목록·상세·초점 복귀),
      # 빈 화면(안내·단추·창 연결)을 실제 화면에서 잰다. 셋 다 가짜 작업장만 쓴다(운영 API·운영 계정 없음).
      # 새 화면 시험은 가장 짧은 잡에 붙인다(261119 실측: 이 잡 86초). 첫 화면 번들이 필요해 먼저 build한다. 건너뜀=실패.
      - name: 쓰기 창 탭·모아둔 순간·빈 화면 시험(건너뜀=실패 — 이슈 970)
        env:
          LT_970_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test --test-concurrency=1 tests/v41-write-tab-462.test.mjs tests/v41-inbox-display.test.mjs tests/v41-empty-tree-463.test.mjs
          echo "쓰기 창 탭·모아둔 순간·빈 화면 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # 이슈 970: 표지(제목 보임·안 잘림·고르면 반영·취소하면 그대로), 썸네일(영상·사진 화면 안 보임·
      # 불러오기 실패면 대체 표시·깨진 그림 아이콘 없음), 관리자 화면(비관리자 차단·관리자 목록)을 실제 화면에서 잰다.
      # 셋 다 가짜 데이터·가짜 응답만 쓴다(운영 API·운영 계정 없음). 새 화면 시험은 가장 짧은 잡에 붙인다.
      # 첫 화면 번들이 필요해 먼저 build한다. 건너뜀=실패.
      - name: 표지·썸네일·관리자 화면 시험(건너뜀=실패 — 이슈 970)
        env:
          LT_970_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test --test-concurrency=1 --test-name-pattern='^970' tests/v41-tree-rename-tips-571.test.mjs tests/v41-board-yt-overlap-553.test.mjs tests/admin-view.test.mjs
          echo "표지·썸네일·관리자 화면 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # B-04: 책 전체화면·작은 꼬리표 시험 연결(건너뜀=실패).
      - name: 책 전체화면·작은 꼬리표 시험(건너뜀=실패 — #833·#862)
        env:
          LT_TREETAG_REQUIRE: '1'
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test --test-concurrency=1 tests/v41-book-fullscreen-833.test.mjs tests/v41-tree-tag-small-862.test.mjs
          echo "책 전체화면·작은 꼬리표 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      - name: 화면 변경 없으면 건너뜀을 남긴다
        if: always()
        run: |
          if [ "${{ needs.screen-changes.outputs.changed }}" != "true" ]; then
            echo "건너뜀(화면 변경 없음)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    name: 미리보기 배포 검사(postdeploy·겉모습 비교)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - name: 미리보기 주소 찾기
        id: preview
        run: node tools/postdeploy/preview-url.mjs "$GITHUB_REPOSITORY" "$PR_SHA" --wait 600
      # 겉모습 비교(알림용)는 화면 파일이 바뀐 PR에서만 돈다 — 문서·서버·시험만 바뀐 PR은 3~4분을 아낀다.
      - name: 화면 파일 바뀜 확인
        id: changes
        run: |
          BASE_SHA=$(git merge-base "$PR_SHA" origin/main)
          if git diff --name-only "$BASE_SHA" "$PR_SHA" | grep -Eq '^(public/|src/|index\.html$|vite\.config|package\.json$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "화면 파일 바뀜 — 겉모습 비교를 돈다"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"; echo "화면 파일 안 바뀜 — 겉모습 비교 건너뜀"
            echo "## 겉모습 비교 건너뜀 — 화면 파일(public/·src/ 등)이 바뀌지 않은 PR" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 기준 커밋 찾기(merge-base 배포본)
        if: steps.changes.outputs.ui == 'true'
        id: base
        run: |
          BASE_SHA=$(git merge-base "$PR_SHA" origin/main)
          echo "baseSha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "기준 커밋(merge-base): $BASE_SHA"
          node tools/postdeploy/preview-url.mjs "$GITHUB_REPOSITORY" "$BASE_SHA" --wait 240 --quiet > "$RUNNER_TEMP/base.log" 2>&1 || true
          BASE_URL=$(sed -n 's/.*preview=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/base.log" | head -1)
          if [ -n "$BASE_URL" ] && [ "$BASE_URL" != "(없음)" ]; then
            echo "baseUrl=$BASE_URL" >> "$GITHUB_OUTPUT"
            echo "baseLabel=기준 커밋 배포본" >> "$GITHUB_OUTPUT"
            echo "기준 주소: $BASE_URL"
          else
            echo "baseUrl=https://lovetree-4-0.pages.dev" >> "$GITHUB_OUTPUT"
            echo "baseLabel=운영(대체)" >> "$GITHUB_OUTPUT"
            echo "기준 커밋 배포 주소를 못 찾아 운영으로 대체: $(sed -n 's/.*reason=//p' "$RUNNER_TEMP/base.log" | head -1)"
          fi
      - name: 미리보기 배포 없음 — 건너뜀
        if: steps.preview.outputs.url == ''
        run: |
          echo "미리보기 검사를 건너뜁니다: ${{ steps.preview.outputs.reason }}"
          {
            echo "## 미리보기 검사 건너뜀"
            echo ""
            echo "- 이유: ${{ steps.preview.outputs.reason }}"
            echo "- 커밋: \`$PR_SHA\`"
            echo "- Cloudflare Pages 미리보기 배포가 없거나 주소를 확인할 수 없어 검사를 실행하지 않았습니다(실패 아님)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: postdeploy 로그아웃 검사
        if: steps.preview.outputs.url != ''
        id: run
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          set +e
          node tools/postdeploy/postdeploy.mjs "${{ steps.preview.outputs.url }}/v41/" \
            --profile "$RUNNER_TEMP/preview-profile" \
            --out "$RUNNER_TEMP/preview-out" \
            --timeout 45000 > "$RUNNER_TEMP/postdeploy.log" 2>&1
          status=$?
          echo "postdeploy 종료 코드=$status"
          tail -40 "$RUNNER_TEMP/postdeploy.log"
          cp -r "$RUNNER_TEMP/preview-out" ./preview-out 2>/dev/null || true
          echo "postdeploy 채점은 다음 단계(preview-gate)에서 한다(미리보기 Functions 503 예외)."
          exit 0
      # #1054: 운영 루트 문서의 상대 자산이 <base> 덕분에 /v41/로 풀려 맞는 종류로 200인지 잰다.
      - name: 루트 주소 자산 종류 검사(#1054)
        if: steps.preview.outputs.url != ''
        run: node tools/postdeploy/root-assets.mjs "${{ steps.preview.outputs.url }}"
      - name: 판정(제품 결함 / 환경 문제 나눠 적기)
        if: steps.preview.outputs.url != ''
        run: |
          if [ ! -d ./preview-out ]; then echo "리포트 폴더가 없습니다"; exit 2; fi
          # #496: 준비 단계가 'cold'(기한 안에 404·503만)면 판정기가 환경 문제로 나눈다.
          node tools/postdeploy/preview-gate.mjs ./preview-out \
            --summary "$GITHUB_STEP_SUMMARY" \
            --readiness "${{ steps.preview.outputs.readiness || 'unknown' }}"
      # ---- 겉모습 비교(visual-baseline, 2026-11-08): 알림만 하고 실패로 만들지 않는다 ----
      - name: 기준 커밋 화면 캡처 — before
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        id: capture-before
        continue-on-error: true
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          # 캡처가 일부 실패해도 종료 코드·로그 끝줄을 남긴다(bash -e면 echo·tail 전에 끝나 원인이 안 보였다).
          set +e
          start=$(date +%s)
          # 2026-11-24: 단계 timeout-minutes로 끊으면 continue-on-error여도 잡 전체가 취소(빨강)된다.
          # 도구 안 상한(5분)에 더해 명령만 7분에서 끊어 단계는 종료 코드로 끝나게 한다(알림용 유지).
          timeout -k 15 420 node tools/visual-baseline/visual-baseline.mjs capture \
            --base "${{ steps.base.outputs.baseUrl }}/v41/" --out visual-before > "$RUNNER_TEMP/before.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -5 "$RUNNER_TEMP/before.log" || true
      - name: 미리보기 화면 캡처 — after
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        id: capture-after
        continue-on-error: true
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          # 캡처가 일부 실패해도 종료 코드·로그 끝줄을 남긴다(bash -e면 echo·tail 전에 끝나 원인이 안 보였다).
          set +e
          start=$(date +%s)
          # 2026-11-24: 단계 timeout-minutes로 끊으면 continue-on-error여도 잡 전체가 취소(빨강)된다.
          # 도구 안 상한(5분)에 더해 명령만 7분에서 끊어 단계는 종료 코드로 끝나게 한다(알림용 유지).
          timeout -k 15 420 node tools/visual-baseline/visual-baseline.mjs capture \
            --base "${{ steps.preview.outputs.url }}/v41/" --out visual-after > "$RUNNER_TEMP/after.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -5 "$RUNNER_TEMP/after.log" || true
      - name: 화면 비교(장별 차이 %)
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        id: compare
        continue-on-error: true
        run: |
          start=$(date +%s)
          set +e
          node tools/visual-baseline/visual-baseline.mjs compare \
            --before visual-before --after visual-after --out visual-diff --json visual-diff.json > "$RUNNER_TEMP/compare.log" 2>&1
          echo "기준 초과가 있어도 실패로 만들지 않습니다(종료 코드 $?)." >> "$RUNNER_TEMP/compare.log"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -12 "$RUNNER_TEMP/compare.log" || true
      - name: 겉모습 비교 요약 표
        if: steps.preview.outputs.url != '' && steps.changes.outputs.ui == 'true'
        continue-on-error: true
        run: |
          if [ ! -f visual-diff.json ]; then
            {
              echo "## 겉모습 비교(visual-baseline) — 건너뜀"
              echo ""
              echo "- 이유: 캡처/비교 산출물이 없습니다(before=${{ steps.capture-before.outputs.status }} after=${{ steps.capture-after.outputs.status }})."
              echo "- 캡처 로그: \`$RUNNER_TEMP/before.log\`, \`$RUNNER_TEMP/after.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 기준이 운영 대체이면 차이에 다른 PR 변경이 섞였을 수 있음을 경고한다.
          if [ "${{ steps.base.outputs.baseLabel }}" = "운영(대체)" ]; then
            LAG_ARG="--lag 기준: 운영(대체) — 차이에 다른 PR 변경이 섞였을 수 있음"
          else
            LAG_ARG=""
          fi
          node tools/visual-baseline/visual-summary.mjs visual-diff.json \
            --before-url "${{ steps.base.outputs.baseUrl }}/v41/" \
            --after-url "${{ steps.preview.outputs.url }}/v41/" \
            --base-sha "${{ steps.base.outputs.baseSha }}" \
            --head-sha "$PR_SHA" \
            --base-label "${{ steps.base.outputs.baseLabel }}" \
            $LAG_ARG | head -40
          echo "- 소요: 캡처 before ${{ steps.capture-before.outputs.seconds }}초 · after ${{ steps.capture-after.outputs.seconds }}초 · 비교 ${{ steps.compare.outputs.seconds }}초" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.preview.outputs.url != ''
        with:
          name: preview-check-${{ github.event.pull_request.number }}
          path: |
            preview-out
            visual-before
            visual-after
            visual-diff
            visual-diff.json
          retention-days: 14

  preview:
    name: 미리보기 postdeploy(로그아웃)
    runs-on: ubuntu-latest
    if: always()
    needs: [screen-changes, screen-board, screen-home, screen-book, screen-reload, screen-shell, screen-map-a, screen-map-b, screen-book-screen, screen-audit-a, screen-audit-b, screen-audit-c, deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
      - name: 모든 화면 시험·배포 검사 결과 모으기
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | node tools/ci/screen-results.mjs
