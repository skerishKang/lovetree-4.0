          # 종료 코드를 받아 두고 두 로그를 항상 출력한 뒤 마지막에 판정한다.
          r1=0; wait $p1 || r1=$?
          r2=0; wait $p2 || r2=$?
          echo "map-contrast exit=$r1 · map-fan exit=$r2"
          echo '— 지도 대비 시험 출력(마지막 60줄) —'
          tail -60 /tmp/map-contrast.log || true
          echo '— 지도 부채꼴·열기 시험 출력 —'
          cat /tmp/map-fan.log || true
          [ $r1 -eq 0 ] && [ $r2 -eq 0 ] || exit 1
          echo "지도 실제 대비·부채꼴 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

