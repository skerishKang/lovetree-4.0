          echo "미디어·담기 화면 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"

      # 이슈 970: 트리 드롭다운(닫힘 길·초점 복귀·키보드)과 인증 화면 시안(전환·빈 칸 안내·오류 자리)을
      # 실제 화면에서 본다. 드롭다운은 첫 화면 번들이 필요해 먼저 build하고, 인증 시안은 정적 파일(요청 0)이다.
      # 건너뜀=실패(크롬이 준비된 이 잡에서 돈다).
      - name: 둘러보기 순간 보기 시험(건너뜀=실패 — #1025)
        env:
