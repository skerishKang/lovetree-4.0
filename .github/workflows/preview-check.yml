  # #1026: 보통/느림 5화면 x 인증 2 x 너비 2 = 40조건의 첫 머리줄/CLS 회귀
  # 2026-11-24: 속도·흔들림 측정 시험(#1026 첫 머리줄 40조건·#1086 첫 화면 궤도·#586 끌기 성능·#1026 보드 CLS)은
  # 느린 실행기에서 기준을 살짝 넘어 PR마다 다시 돌리게 만들었다. 기준은 그대로 두고 PR이 아니라
  # main에서 매일 밤 잰다(nightly-screen-perf.yml). 밤에 빨강이면 이슈가 자동으로 열린다.
  screen-home:
    name: 화면 시험 — 첫 화면
    # 2026-11-22: 호스트 실행기 대기(동시 3개 안팎)를 피해 같은 저장소 PR은 CGI 자체 실행기에서 돈다(보드 잡과 같은 식).
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.full_name == github.repository && vars.USE_CGI_RUNNER == '1') && '["self-hosted","Linux","X64","cgi"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 12
    needs: screen-changes
    if: needs.screen-changes.outputs.changed == 'true' && (needs.screen-changes.outputs.jobs == 'all' || needs.screen-changes.outputs.jobs == '' || contains(format(',{0},', needs.screen-changes.outputs.jobs), ',screen-home,'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true
      # 같은 CGI 컴퓨터의 자체 실행기 여러 개가 홈의 npm 캐시를 함께 쓰면 동시에 받다가 깨진다
      # (2026-11-24: EINTEGRITY·ENOENT로 시험 전에 실패). 자체 실행기에서는 실행기마다 캐시 폴더를 따로 둔다.
      - name: 실행기별 npm 캐시 폴더(자체 실행기)
        if: runner.environment == 'self-hosted'
        run: echo "npm_config_cache=$HOME/.npm-runner-$RUNNER_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            # 자체 실행기: 이 버전 Chromium이 있으면 받지 않고 끝난다(시스템 라이브러리는 미리 깔림, sudo 없음).
            npx playwright install chromium
          elif ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - name: 첫 화면 떠 있음·겹침 시험(#535, 건너뜀=실패)
        env:
          LT_ORBIT535_REQUIRE: '1'
          LT_ORBIT535_DIAG_DIR: ./test-results/orbit535-diag
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          node --test tests/v41-orbit-535-float-overlap.test.mjs
          echo "첫 화면 떠 있음·겹침 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: 첫 화면 침범 진단 스크린샷(390 로그아웃)
        if: failure() && needs.screen-changes.outputs.changed == 'true'
