name: 미리보기 검사

# 원칙 8(머지 전 PR 미리보기 postdeploy) 자동 실행. 로그아웃 검사만 하므로 비밀값이 필요 없다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: preview-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: 미리보기 postdeploy(로그아웃)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        run: |
          # 모듈은 항상 설치한다(캐시는 브라우저 바이너리에만 걸린다). 캐시가 있어도 모듈이 없으면 실행이 안 된다.
          npm i --no-save --no-package-lock playwright@1.49.1
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      # #504: 화면 대비 시험을 CI에서 실제로 돌린다(check 잡엔 크롬이 없어 건너뛰던 것).
      # 크롬을 캐시로 이미 준비하는 이 잡에서 돌리는 쪽이 check 잡(ubuntu+windows 둘 다 설치)보다 필수 검사 시간이 덜 늘어난다.
      # LT_BOARD_CONTRAST_REQUIRE=1 — 건너뜀을 실패로 본다(조용히 지나가지 않게).
      - name: 보드 카드 대비 시험(CI에서 실제로, 건너뜀=실패 — #504)
        env:
          LT_BOARD_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          node --test tests/v41-board-card-contrast.test.mjs
          echo "보드 카드 대비 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: 지도 실제 대비·판 전환 시험(건너뜀=실패)
        env:
          LT_MAP_CONTRAST_REQUIRE: '1'
        run: |
          start=$(date +%s)
          # #529: 이름표 대비는 실제로 그려진 한글 글자를 잰다. 실행기에 한글 글꼴이 없으면 준비한다(있으면 건너뜀).
          if ! fc-list :lang=ko | grep -q .; then
            echo "한글 글꼴 없음 — fonts-noto-cjk 설치"
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개 · 대표 $(fc-match 'sans-serif:lang=ko' | head -1)"
          # 두 시험은 차례로 돌린다(브라우저 둘이 동시에 뜨면 느린 실행기에서 서로의 시간을 흔든다).
          node --test --test-concurrency=1 tests/v41-map-contrast.test.mjs tests/v41-map-theme-flow.test.mjs
          echo "지도 실제 대비·판 전환 시험 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: 미리보기 주소 찾기
        id: preview
        run: node tools/postdeploy/preview-url.mjs "$GITHUB_REPOSITORY" "$PR_SHA" --wait 600
      - name: 기준 커밋 찾기(merge-base 배포본)
        id: base
        run: |
          BASE_SHA=$(git merge-base "$PR_SHA" origin/main)
          echo "baseSha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "기준 커밋(merge-base): $BASE_SHA"
          node tools/postdeploy/preview-url.mjs "$GITHUB_REPOSITORY" "$BASE_SHA" --wait 240 --quiet > "$RUNNER_TEMP/base.log" 2>&1 || true
          BASE_URL=$(sed -n 's/.*preview=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/base.log" | head -1)
          if [ -n "$BASE_URL" ] && [ "$BASE_URL" != "(없음)" ]; then
            echo "baseUrl=$BASE_URL" >> "$GITHUB_OUTPUT"
            echo "baseLabel=기준 커밋 배포본" >> "$GITHUB_OUTPUT"
            echo "기준 주소: $BASE_URL"
          else
            echo "baseUrl=https://lovetree-4-0.pages.dev" >> "$GITHUB_OUTPUT"
            echo "baseLabel=운영(대체)" >> "$GITHUB_OUTPUT"
            echo "기준 커밋 배포 주소를 못 찾아 운영으로 대체: $(sed -n 's/.*reason=//p' "$RUNNER_TEMP/base.log" | head -1)"
          fi
      - name: 미리보기 배포 없음 — 건너뜀
        if: steps.preview.outputs.url == ''
        run: |
          echo "미리보기 검사를 건너뜁니다: ${{ steps.preview.outputs.reason }}"
          {
            echo "## 미리보기 검사 건너뜀"
            echo ""
            echo "- 이유: ${{ steps.preview.outputs.reason }}"
            echo "- 커밋: \`$PR_SHA\`"
            echo "- Cloudflare Pages 미리보기 배포가 없거나 주소를 확인할 수 없어 검사를 실행하지 않았습니다(실패 아님)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: postdeploy 로그아웃 검사
        if: steps.preview.outputs.url != ''
        id: run
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          set +e
          node tools/postdeploy/postdeploy.mjs "${{ steps.preview.outputs.url }}/v41/" \
            --profile "$RUNNER_TEMP/preview-profile" \
            --out "$RUNNER_TEMP/preview-out" \
            --timeout 45000 > "$RUNNER_TEMP/postdeploy.log" 2>&1
          status=$?
          echo "postdeploy 종료 코드=$status"
          tail -40 "$RUNNER_TEMP/postdeploy.log"
          cp -r "$RUNNER_TEMP/preview-out" ./preview-out 2>/dev/null || true
          echo "postdeploy 채점은 다음 단계(preview-gate)에서 한다(미리보기 Functions 503 예외)."
          exit 0
      - name: 판정(제품 결함 / 환경 문제 나눠 적기)
        if: steps.preview.outputs.url != ''
        run: |
          if [ ! -d ./preview-out ]; then echo "리포트 폴더가 없습니다"; exit 2; fi
          # #496: 준비 단계가 'cold'(기한 안에 404·503만)면 판정기가 환경 문제로 나눈다.
          node tools/postdeploy/preview-gate.mjs ./preview-out \
            --summary "$GITHUB_STEP_SUMMARY" \
            --readiness "${{ steps.preview.outputs.readiness || 'unknown' }}"
      # ---- 겉모습 비교(visual-baseline, 2026-11-08): 알림만 하고 실패로 만들지 않는다 ----
      - name: 기준 커밋 화면 캡처 — before
        if: steps.preview.outputs.url != ''
        id: capture-before
        continue-on-error: true
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          start=$(date +%s)
          node tools/visual-baseline/visual-baseline.mjs capture \
            --base "${{ steps.base.outputs.baseUrl }}/v41/" --out visual-before > "$RUNNER_TEMP/before.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -5 "$RUNNER_TEMP/before.log" || true
      - name: 미리보기 화면 캡처 — after
        if: steps.preview.outputs.url != ''
        id: capture-after
        continue-on-error: true
        env:
          LOVETREE_POSTDEPLOY_BROWSER: chromium
        run: |
          start=$(date +%s)
          node tools/visual-baseline/visual-baseline.mjs capture \
            --base "${{ steps.preview.outputs.url }}/v41/" --out visual-after > "$RUNNER_TEMP/after.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -5 "$RUNNER_TEMP/after.log" || true
      - name: 화면 비교(장별 차이 %)
        if: steps.preview.outputs.url != ''
        id: compare
        continue-on-error: true
        run: |
          start=$(date +%s)
          set +e
          node tools/visual-baseline/visual-baseline.mjs compare \
            --before visual-before --after visual-after --out visual-diff --json visual-diff.json > "$RUNNER_TEMP/compare.log" 2>&1
          echo "기준 초과가 있어도 실패로 만들지 않습니다(종료 코드 $?)." >> "$RUNNER_TEMP/compare.log"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          tail -12 "$RUNNER_TEMP/compare.log" || true
      - name: 겉모습 비교 요약 표
        if: steps.preview.outputs.url != ''
        continue-on-error: true
        run: |
          if [ ! -f visual-diff.json ]; then
            {
              echo "## 겉모습 비교(visual-baseline) — 건너뜀"
              echo ""
              echo "- 이유: 캡처/비교 산출물이 없습니다(before=${{ steps.capture-before.outputs.status }} after=${{ steps.capture-after.outputs.status }})."
              echo "- 캡처 로그: \`$RUNNER_TEMP/before.log\`, \`$RUNNER_TEMP/after.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 기준이 운영 대체이면 차이에 다른 PR 변경이 섞였을 수 있음을 경고한다.
          if [ "${{ steps.base.outputs.baseLabel }}" = "운영(대체)" ]; then
            LAG_ARG="--lag 기준: 운영(대체) — 차이에 다른 PR 변경이 섞였을 수 있음"
          else
            LAG_ARG=""
          fi
          node tools/visual-baseline/visual-summary.mjs visual-diff.json \
            --before-url "${{ steps.base.outputs.baseUrl }}/v41/" \
            --after-url "${{ steps.preview.outputs.url }}/v41/" \
            --base-sha "${{ steps.base.outputs.baseSha }}" \
            --head-sha "$PR_SHA" \
            --base-label "${{ steps.base.outputs.baseLabel }}" \
            $LAG_ARG | head -40
          echo "- 소요: 캡처 before ${{ steps.capture-before.outputs.seconds }}초 · after ${{ steps.capture-after.outputs.seconds }}초 · 비교 ${{ steps.compare.outputs.seconds }}초" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.preview.outputs.url != ''
        with:
          name: preview-check-${{ github.event.pull_request.number }}
          path: |
            preview-out
            visual-before
            visual-after
            visual-diff
            visual-diff.json
          retention-days: 14
