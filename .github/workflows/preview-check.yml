  screen-audit-a:
    name: 화면 공통 검사기 a/3(#657)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: screen-changes
    if: needs.screen-changes.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 브라우저 준비(Playwright Chromium, 캐시)
        id: browser
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          npm i --no-save --no-package-lock playwright@$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          if ls "$HOME/.cache/ms-playwright" 2>/dev/null | grep -q chromium; then
            echo "캐시된 Chromium 사용"
          else
            npx playwright install --with-deps chromium
          fi
          node -e "import('playwright-core').then(()=>console.log('playwright-core 확인')).catch(e=>{console.error(e.message);process.exit(1)})"
      - uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: fonts-noto-cjk-${{ runner.os }}-1
      - name: 한글 글꼴 준비(캐시, 없으면 설치)
        if: needs.screen-changes.outputs.changed == 'true'
        timeout-minutes: 10
        run: |
          start=$(date +%s)
          # APT mirror delays must not prevent the same Noto CJK font from being installed.
          # Pin the upstream font revision; the APT path below remains as fallback.
          # Upstream pinned revision: SHA-256 checked for both cached and downloaded copies.
          noto_font="$HOME/.fonts/NotoSansCJK-Regular.ttc"
          noto_sha256="b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a"
          if [ -f "$noto_font" ] && ! echo "$noto_sha256  $noto_font" | sha256sum --check --status; then
            rm -f "$noto_font"
          fi
          if [ ! -f "$noto_font" ]; then
            mkdir -p "$HOME/.fonts"
            if curl -fLsS --retry 2 --connect-timeout 10 --max-time 90 "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc" -o "$noto_font"; then
              if ! echo "$noto_sha256  $noto_font" | sha256sum --check --status; then
                echo "Noto CJK checksum mismatch; falling back to APT"
                rm -f "$noto_font"
              fi
            else
              rm -f "$noto_font"
            fi
          fi
          if [ -f "$HOME/.fonts/NotoSansCJK-Regular.ttc" ]; then
            echo "캐시된 한글 글꼴 사용($(ls "$HOME/.fonts" | wc -l)개 파일)"
          else
            echo "캐시된 한글 글꼴 없음 — fonts-noto-cjk 설치해 ~/.fonts에 쌓는다"
            sudo apt-get update -qq || true
            ok=0
            for i in 1 2 3; do
              if sudo timeout 150 apt-get install -y -qq --no-install-recommends fonts-noto-cjk; then ok=1; break; fi
              echo "apt-get install $i번째 시도 실패/멈춤 — 다시 시도"
              sleep 5
            done
            [ $ok -eq 1 ] || { echo "fonts-noto-cjk 설치 실패"; exit 1; }
            mkdir -p "$HOME/.fonts"
            sudo cp /usr/share/fonts/opentype/noto/*.tt* "$HOME/.fonts/" 2>/dev/null || sudo find /usr/share/fonts -name 'Noto*CJK*.ttc' -exec cp {} "$HOME/.fonts/" ; 2>/dev/null || true
            echo "쌓은 글꼴 파일 $(ls "$HOME/.fonts" | wc -l)개"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개 · 대표 $(fc-match 'sans-serif:lang=ko' | head -1)"
          echo "한글 글꼴 준비 $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: 화면 공통 검사기 shard a(건너뜀=실패 — #657·#1080)
        timeout-minutes: 10
        if: needs.screen-changes.outputs.changed == 'true'
        run: |
          start=$(date +%s)
          npx vite build > /dev/null
          LT_SCREEN_AUDIT_SHARD=a LT_SCREEN_AUDIT_REQUIRE=1 node --test --test-name-pattern='^#657 화면 공통 검사기' tests/v41-screen-audit.test.mjs > /tmp/screen-audit.log 2>&1 & pid=$!
          r=0
          while kill -0 $pid 2>/dev/null; do
            sleep 30
            if ! kill -0 $pid 2>/dev/null; then break; fi
            last=$(grep -E '^(ok|not ok)' /tmp/screen-audit.log | tail -1)
            echo "…진행 중 $(( $(date +%s) - start ))초 — 마지막 완료: ${last:-아직 완료한 시험 없음}"
            echo "…진행 중 $(( $(date +%s) - start ))초 — 마지막 완료: ${last:-아직 완료한 시험 없음}" >> "$GITHUB_STEP_SUMMARY"
          done
          wait $pid || r=$?
          echo "화면 공통 검사기 shard a 종료 코드 $r · $(( $(date +%s) - start ))초"
          echo '— 화면 공통 검사기 실패 블록(전체) —'
          awk '/^not ok /{p=1} p{print} p&&/^  \.\.\./{p=0}' /tmp/screen-audit.log || true
          echo '— 화면 공통 검사기 출력(마지막 60줄) —'
          tail -60 /tmp/screen-audit.log || true
          echo "화면 공통 검사기 shard a $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
          exit $r
      - name: 화면 변경 없으면 건너뜀을 남긴다
        if: always()
        run: |
          if [ "${{ needs.screen-changes.outputs.changed }}" != "true" ]; then
            echo "건너뜀(화면 변경 없음)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

