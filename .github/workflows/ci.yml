name: Check
# PR 브랜치에 push하면 push 실행과 PR 실행이 둘 다 돌아 같은 잡이 두 벌 돈다(2026-11-22 CI 대기 원인).
# push 실행은 main에만 두고, 작업 브랜치는 PR 실행 하나로 본다.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # 2026-11-24: PR마다 Windows로 전체 시험을 돌리면 호스트 실행기를 오래 잡아 다른 PR이 줄을 섰다.
  # 화면(브라우저에서 도는 파일)·문서·화면 시험만 바뀐 PR은 Windows에서 운영체제 차이가 날 곳이 없어
  # 시험을 건너뛰고 성공으로 끝낸다(필수 검사 이름은 그대로). main에 들어간 뒤에는 Windows도 항상 다 돈다.
  # 도구·서버·스크립트·패키지·설정처럼 경로나 운영체제를 타는 파일이 하나라도 바뀌면 PR에서도 다 돈다.
  os-changes:
    name: 운영체제 차이 검사 필요 여부
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}' > /tmp/os-files.txt || { echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          node tools/ci/os-changes.mjs /tmp/os-files.txt
  check:
    needs: os-changes
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # 저장소 변수가 켜져 있고 같은 저장소 사건일 때만 우분투 잡을 자체 실행기로 옮긴다.
    # 포크 PR과 변수가 꺼진 경우에는 호스트에서 그대로 돈다.
    runs-on: ${{ fromJSON(((github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.USE_CGI_RUNNER == '1' && matrix.os == 'ubuntu-latest') && '["self-hosted","Linux","X64","cgi"]' || format('["{0}"]', matrix.os)) }}
    timeout-minutes: 15
    steps:
      - name: Windows 건너뜀 알림
        if: matrix.os == 'windows-latest' && needs.os-changes.outputs.changed != 'true'
        run: echo "운영체제를 타는 파일 변경 없음 — Windows 시험 건너뜀(main 병합 뒤에는 돈다)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: matrix.os != 'windows-latest' || needs.os-changes.outputs.changed == 'true'
        with:
          clean: true
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-latest' || needs.os-changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: matrix.os != 'windows-latest' || needs.os-changes.outputs.changed == 'true'
      - run: npm test
        if: matrix.os != 'windows-latest' || needs.os-changes.outputs.changed == 'true'
      - run: npm run build
        if: matrix.os != 'windows-latest' || needs.os-changes.outputs.changed == 'true'
  server-changes:
    name: 서버 바뀜 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 바뀐 파일로 서버 바뀜을 가린다
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --name-only "$base...$head" > /tmp/server-changed-files.txt
          node tools/ci/server-changes.mjs /tmp/server-changed-files.txt
  postgres:
    name: PostgreSQL 저장·로그인 상태 검증
    runs-on: ubuntu-latest
    needs: server-changes
    if: needs.server-changes.outputs.changed == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lovetree_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lovetree_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 격리 테스트 DB에서 저장 API·로그인 상태 검증
        env:
          LOVETREE_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/lovetree_test_ci
        run: |
          if [ -z "${LOVETREE_TEST_DATABASE_URL:-}" ]; then
            echo "실패: 연결 설정 누락 — 다른 연결 문자열로 대체하지 않습니다."
            exit 1
          fi
          status=0
          # B-04: 목록을 손으로 적으면 새 파일이 빠진다 — tests/*-postgres.test.mjs 전체를 쓴다.
          # migrations-postgres.test.mjs는 별도 migration 잡(빈 DB)에서 돌리므로 여기서는 제외한다.
          # 두 PostgreSQL 파일이 같은 DB에서 동시에 CREATE TABLE 하면 카탈로그가 경합한다
          # (pg_type_typname_nsp_index 중복). 파일 간 병렬을 풀어 DDL을 직렬화한다.
          pg_tests=$(printf '%s\n' tests/*-postgres.test.mjs | grep -v 'migrations-postgres.test.mjs')
          node --test --test-concurrency=1 --test-reporter=tap $pg_tests > /tmp/pg.tap 2>&1 || status=$?
          cat /tmp/pg.tap
          if [ "$status" -ne 0 ]; then
            echo "실패: 연결 실패 또는 테스트 실패 (exit $status)"
            exit 1
          fi
          pass=$(awk '/^# pass /{print $3}' /tmp/pg.tap)
          fail=$(awk '/^# fail /{print $3}' /tmp/pg.tap)
          skipped=$(awk '/^# skipped /{print $3}' /tmp/pg.tap)
          echo "pass=$pass fail=$fail skipped=$skipped"
          # 7개 파일의 실제 실행 시험 수 합계(루프 생성 1건 포함) = 40건.
          if [ "${fail:-1}" != "0" ] || [ "${skipped:-1}" != "0" ] || [ "${pass:-0}" -lt 40 ]; then
            echo "실패: skip 또는 40건 미달 — PostgreSQL 검증이 수행되지 않았습니다."
            exit 1
          fi
  migration:
    # server/db/migrations/*.sql 을 실제 PostgreSQL에 실행해 본다.
    # ALTER TABLE IF NOT EXISTS 같은 PostgreSQL에 없는 문법은 여기서 실패한다.
    name: PostgreSQL migrations 실행 시험
    runs-on: ubuntu-latest
    needs: server-changes
    if: needs.server-changes.outputs.changed == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lovetree_test_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lovetree_test_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빈 DB에 migrations 전체 적용 + 재실행 안전성 검증
        env:
          LOVETREE_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/lovetree_test_migrations
        run: |
          if [ -z "${LOVETREE_TEST_DATABASE_URL:-}" ]; then
            echo "실패: 연결 설정 누락 — 다른 연결 문자열로 대체하지 않습니다."
            exit 1
          fi
          status=0
          node --test --test-concurrency=1 --test-reporter=tap tests/migrations-postgres.test.mjs > /tmp/mig.tap 2>&1 || status=$?
          cat /tmp/mig.tap
          if [ "$status" -ne 0 ]; then
            echo "실패: migration 실행 실패 또는 테스트 실패 (exit $status)"
            exit 1
          fi
          pass=$(awk '/^# pass /{print $3}' /tmp/mig.tap)
          fail=$(awk '/^# fail /{print $3}' /tmp/mig.tap)
          skipped=$(awk '/^# skipped /{print $3}' /tmp/mig.tap)
          echo "pass=$pass fail=$fail skipped=$skipped"
          if [ "${fail:-1}" != "0" ] || [ "${skipped:-1}" != "0" ] || [ "${pass:-0}" -lt 1 ]; then
            echo "실패: skip 또는 1건 미달 — migration 검증이 수행되지 않았습니다."
            exit 1
          fi
  autodeploy:
    # 자동 배포 스크립트의 판정(같은 SHA/프런트만/migration/되돌림)을 가짜 명령으로 시험한다.
    # 운영 서비스·DB에는 접속하지 않는다.
    name: API 자동 배포 판정 시험
    runs-on: ubuntu-latest
    needs: server-changes
    if: needs.server-changes.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: autodeploy.sh 판정·되돌림 시험
        run: bash tests/autodeploy.test.sh
